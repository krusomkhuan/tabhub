<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('PwaHead'); ?>
  <?!= include('Styles'); ?>
</head>
<body>
  <div class="content pub-wrap">
    <header class="pub-hero no-print">
      <a id="pBack" class="btn sm pub-back" href="./" hidden>← กลับ</a>
      <img src="assets/icon-192.png" alt="" width="64" height="64">
      <div class="pub-hero-text"><h1 id="pTitle">ตารางเรียน / ตารางสอน</h1><p id="pCollege"></p></div>
      <label class="pub-sem"><span>ภาคเรียน</span><select id="pSem"></select></label><button type="button" class="theme-btn" onclick="Theme.toggle()" aria-label="สลับโหมดกลางคืน" title="สลับโหมดกลางคืน"></button>
    </header>
    <div class="pub-tabs no-print" id="pTabs"></div>
    <div class="card pub-controls no-print">
      <select id="pDept"></select><input id="pQ" type="search" placeholder="🔍 พิมพ์ชื่อเพื่อค้นหา…" aria-label="ค้นหา"><select id="pItem"></select>
      <div class="pub-actions"><span id="pModeControl"></span><button class="btn pri" id="pShare">📤 แชร์ PDF</button><button class="btn" onclick="window.print()">🖨 พิมพ์</button><button class="btn" id="pLink">🔗 คัดลอกลิงก์</button><button class="btn pwa-add" onclick="PWA.add()">📲 เพิ่มไอคอนลงมือถือ</button></div>
    </div>
    <div id="pOut" class="muted">กำลังโหลด…</div>
    <p class="app-ver no-print">เวอร์ชัน <span id="pVer"></span> · <a href="?page=pdpa">นโยบายคุ้มครองข้อมูลส่วนบุคคล</a></p>
  </div>
  <script>var PARAMS = <?!= params ?>;</script>
  <?!= include('GridCore'); ?>
  <script>
  var P = { type: PARAMS.teacher ? 'teacher' : PARAMS.room ? 'room' : 'group', id: PARAMS.group || PARAMS.teacher || PARAMS.room || '', dept: '' };
  var D = null, IX = {}, BASE = '';
  var esc = Grid.esc;

  function load(sem) {
    document.getElementById('pOut').textContent = 'กำลังโหลด…';
    google.script.run.withSuccessHandler(function (d) {
      D = d; IX = {};
      ['groups', 'teachers', 'rooms', 'courses', 'departments', 'buildings'].forEach(function (k) { IX[k] = {}; d[k].forEach(function (x) { IX[k][x.id] = x; }); });
      document.getElementById('pCollege').textContent = d.settings.college_name;
      document.getElementById('pSem').innerHTML = d.semesters.map(function (s) { return '<option value="' + esc(s.id) + '"' + (String(s.id) === String(d.semester_id) ? ' selected' : '') + '>' + esc(s.label) + '</option>'; }).join('');
      if (P.id && P.type === 'group' && IX.groups[P.id]) P.dept = IX.groups[P.id].department_id;
      if (P.id && P.type === 'teacher' && IX.teachers[P.id]) P.dept = IX.teachers[P.id].department_id;
      ui();
    }).withFailureHandler(function (e) { document.getElementById('pOut').innerHTML = '<div class="card">' + esc(e.message) + '</div>'; }).getPublicData(sem || PARAMS.sem || '');
  }

  function sortTh(a, f) { return a.slice().sort(function (x, y) { return String(f(x)).localeCompare(String(f(y)), 'th', { numeric: true }); }); }

  function ui() {
    document.getElementById('pTabs').innerHTML = [['group', '🎓', 'ตารางเรียน', 'กลุ่มเรียน', D.groups.length], ['teacher', '🧑‍🏫', 'ตารางสอน', 'ครู', D.teachers.length], ['room', '🚪', 'ตารางใช้ห้อง', 'ห้อง', D.rooms.length]].map(function (t) {
      return '<button class="pub-tab pub-' + t[0] + (P.type === t[0] ? ' on' : '') + '" data-t="' + t[0] + '" aria-pressed="' + (P.type === t[0]) + '"><span class="pub-tab-ic">' + t[1] + '</span><span class="pub-tab-text"><b>' + t[2] + '</b><small>' + t[4] + ' ' + t[3] + '</small></span></button>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (b) { b.onclick = function () { P.type = b.dataset.t; P.id = ''; ui(); }; });
    var dsel = document.getElementById('pDept');
    dsel.style.display = P.type === 'room' ? 'none' : '';
    dsel.innerHTML = '<option value="">ทุกแผนก</option>' + D.departments.map(function (d) { return '<option value="' + esc(d.id) + '"' + (String(d.id) === String(P.dept) ? ' selected' : '') + '>' + esc(d.name) + '</option>'; }).join('');
    dsel.onchange = function () { P.dept = this.value; P.id = ''; ui(); };
    var items;
    if (P.type === 'group') items = sortTh(D.groups.filter(function (g) { return !P.dept || String(g.department_id) === String(P.dept); }), function (g) { return g.code; }).map(function (g) { return [g.id, g.code, (IX.departments[g.department_id] || {}).name || 'ไม่ระบุแผนก']; });
    else if (P.type === 'teacher') items = sortTh(D.teachers.filter(function (t) { return !P.dept || Grid.inDept(t, P.dept); }), function (t) { return t.name; }).map(function (t) { return [t.id, t.name, (IX.departments[t.department_id] || {}).name || 'ไม่ระบุแผนก']; });
    else items = sortTh(D.rooms, function (r) { return (IX.buildings[r.building_id] || {}).name + r.name; }).map(function (r) { return [r.id, r.name + ' · ' + ((IX.buildings[r.building_id] || {}).name || ''), (IX.buildings[r.building_id] || {}).name || 'ไม่ระบุอาคาร', r.name]; });
    var isel = document.getElementById('pItem');
    isel.innerHTML = '<option value="">— เลือกรายการ —</option>' + items.map(function (x) { return '<option value="' + esc(x[0]) + '"' + (String(x[0]) === String(P.id) ? ' selected' : '') + '>' + esc(x[1]) + '</option>'; }).join('');
    isel.onchange = function () { P.id = this.value; draw(); };
    P.items = items;
    var q = document.getElementById('pQ');
    q.placeholder = P.type === 'teacher' ? '🔍 พิมพ์ชื่อครู…' : P.type === 'group' ? '🔍 พิมพ์รหัสกลุ่มเรียน…' : '🔍 พิมพ์ชื่อห้อง…';
    q.value = '';
    // พิมพ์เพื่อกรองรายการและชิป เหลือรายการเดียวหรือกด Enter จึงเปิดตาราง
    q.oninput = function () { filterItems(false); };
    q.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); filterItems(true); } };
    draw();
  }

  function tNames(ids) { return String(ids || '').split(',').filter(String).map(function (t) { return (IX.teachers[t] || {}).name || ''; }).join(', '); }
  function course(id) { return IX.courses[id] || { code: '', name: '' }; }
  function gcode(id) { return (IX.groups[id] || {}).code || ''; }

  /* เลือกจากชิปได้ในคลิกเดียว แยกตามแผนกหรืออาคาร */
  function pickerHtml() {
    var groups = {}, order = [];
    (P.items || []).forEach(function (x) { if (!groups[x[2]]) { groups[x[2]] = []; order.push(x[2]); } groups[x[2]].push(x); });
    order.sort(function (a, b) { return a.localeCompare(b, 'th'); });
    var hint = { group: 'เลือกกลุ่มเรียนเพื่อดูตารางเรียน', teacher: 'เลือกครูเพื่อดูตารางสอน', room: 'เลือกห้องเพื่อดูตารางใช้ห้อง' }[P.type];
    if (!order.length) return '<div class="card muted">ไม่พบรายการ</div>';
    /* ห้องไม่มีแผนให้เทียบ จึงบอกสถานะจัดครบได้เฉพาะกลุ่มเรียนและครู */
    var bad = {};
    (P.type === 'group' ? D.incomplete.groups : P.type === 'teacher' ? D.incomplete.teachers : []).forEach(function (id) { bad[id] = 1; });
    var anyBad = (P.items || []).some(function (x) { return bad[x[0]]; });
    /* สีแผนกคงที่ แม้จะกรองดูทีละแผนก: หมุนเฉดสีตามลำดับแผนกให้แผนกติดกันสีห่างกัน */
    var deptNames = sortTh(D.departments, function (d) { return d.name; }).map(function (d) { return d.name; });
    function deptStyle(name) { return P.type === 'teacher' ? ' class="pub-dept" style="--h:' + Math.round((Math.max(0, deptNames.indexOf(name)) * 137.5 + 25) % 360) + '"' : ''; }
    return '<div class="card pub-picker pub-' + P.type + '"><h2>' + hint + '</h2>' +
      (anyBad ? '<p class="pub-legend"><span class="pub-chip warn">⚠ สีนี้</span> หมายถึงตารางยังจัดไม่ครบตามแผนการเรียน อาจมีการเปลี่ยนแปลง</p>' : '') +
      order.map(function (name) {
      return '<section' + deptStyle(name) + '><h3>' + esc(name) + '<span>' + groups[name].length + '</span></h3><div class="pub-chips">' + groups[name].map(function (x) {
        var warn = bad[x[0]];
        return '<button class="pub-chip' + (warn ? ' warn' : '') + '" data-pick="' + esc(x[0]) + '"' + (warn ? ' title="ตารางยังจัดไม่ครบ"' : '') + '>' + (warn ? '⚠ ' : '') + esc(P.type === 'room' ? x[3] : x[1]) + '</button>';
      }).join('') + '</div></section>';
    }).join('') + '</div>';
  }
  function digitsKey(s) { return String(s || '').toLowerCase().replace(/[๐-๙]/g, function (d) { return String('๐๑๒๓๔๕๖๗๘๙'.indexOf(d)); }); }
  function filterItems(pick) {
    var q = digitsKey(document.getElementById('pQ').value.trim()), isel = document.getElementById('pItem'), hits = [];
    Array.prototype.forEach.call(isel.options, function (o) { if (!o.value) return; var hit = !q || digitsKey(o.text).indexOf(q) >= 0; o.hidden = !hit; if (hit) hits.push(o.value); });
    Array.prototype.forEach.call(document.querySelectorAll('#pOut .pub-picker section'), function (sec) {
      var shown = 0;
      Array.prototype.forEach.call(sec.querySelectorAll('[data-pick]'), function (b) { var hit = !q || digitsKey(b.textContent).indexOf(q) >= 0; b.hidden = !hit; if (hit) shown++; });
      sec.hidden = !shown;
    });
    if (q && hits.length && (pick || hits.length === 1) && P.id !== hits[0]) { P.id = hits[0]; isel.value = P.id; draw(); }
  }
  function bindPicker(out) {
    Array.prototype.forEach.call(out.querySelectorAll('[data-pick]'), function (b) {
      b.onclick = function () { P.id = b.dataset.pick; document.getElementById('pItem').value = P.id; draw(); window.scrollTo(0, 0); };
    });
  }

  function draw() {
    var out = document.getElementById('pOut');
    if (!P.id) { out.className = ''; out.innerHTML = pickerHtml(); bindPicker(out); return; }
    out.className = '';
    var ss, title;
    if (P.type === 'group') { ss = D.sessions.filter(function (s) { return String(s.group_id) === String(P.id); }); title = 'ตารางเรียน กลุ่ม ' + gcode(P.id); }
    else if (P.type === 'teacher') { ss = D.sessions.filter(function (s) { return String(s.teacher_ids).split(',').indexOf(String(P.id)) >= 0; }); title = 'ตารางสอน ' + (IX.teachers[P.id] || {}).name; }
    else { ss = D.sessions.filter(function (s) { return String(s.room_id) === String(P.id); }); title = 'ตารางใช้ห้อง ' + (IX.rooms[P.id] || {}).name; }
    var sem = D.semesters.filter(function (s) { return String(s.id) === String(D.semester_id); })[0];
    P.title = title + (sem ? ' ภาคเรียน ' + sem.label : '');
    if (P.type === 'teacher') {
      var t = IX.teachers[P.id] || {};
      var head = Grid.deptHead(D.teachers, t.department_id);
      out.innerHTML = Grid.teacherSheet({
        settings: D.settings, dayNames: D.days, locked: D.locked || [], teacher: t, teacherId: P.id, sessions: D.sessions, groups: D.groups,
        hourType: function (s, k) { var types; try { types = JSON.parse(s.hour_types || 'null'); } catch (e) {} return types && types.length === Number(s.length) ? types[k] : s.hour_type || 'in'; }, plc: D.plc || [],
        course: course, group: gcode, room: function (id) { return (IX.rooms[id] || {}).name || ''; }, color: publicSessionColor,
        deptName: (IX.departments[t.department_id] || {}).name || '', semLabel: sem ? sem.label : '', sign: Grid.signBlock(D.settings, head && head.name, false, (IX.departments[t.department_id] || {}).name)
      });
      return;
    }
    var g = IX.groups[P.id] || {}, r = IX.rooms[P.id] || {};
    var options = {
      settings: D.settings, dayNames: D.days, locked: D.locked || [], sessions: D.sessions, groups: D.groups,
      studentGroup: P.type === 'group' ? Object.assign({}, g, { id: P.id }) : null,
      roomInfo: P.type === 'room' ? Object.assign({}, r, { id: P.id }) : null,
      teacher: IX.teachers[g.advisor_id] || {}, course: course, group: gcode,
      room: function (id) { return (IX.rooms[id] || {}).name || ''; }, color: publicSessionColor,
      teacherNames: function (ids) { return Grid.shortTeacherNames(ids, function (id) { return IX.teachers[id]; }); },
      buildingName: (IX.buildings[r.building_id] || {}).name || '', semLabel: sem ? sem.label : '',
      sign: Grid.signBlock(D.settings, (Grid.deptHead(D.teachers, g.department_id) || {}).name, P.type === 'room', (IX.departments[g.department_id] || {}).name)
    };
    out.innerHTML = P.type === 'group' ? Grid.studentSheet(options) : Grid.roomSheet(options);
  }

  function publicSessionColor(s) {
    var c = course(s.course_id);
    return Grid.sessionColor({ settings: D.settings, groups: D.color_groups || [], course_id: s.course_id, color: c.color, course_type: c.course_type, name: c.name, teacher_ids: s.teacher_ids, room_id: s.room_id, room: (IX.rooms[s.room_id] || {}).name, department_id: (IX.groups[s.group_id] || {}).department_id, workplace: s.workplace });
  }

  document.getElementById('pModeControl').innerHTML = Grid.displayControl('pMode');
  Grid.bindDisplayControl(document.getElementById('pMode'), function () { if (D) draw(); });
  document.getElementById('pSem').onchange = function () { load(this.value); };
  document.getElementById('pLink').onclick = function () {
    var u = BASE + '?page=public&sem=' + encodeURIComponent(D.semester_id) + (P.id ? '&' + P.type + '=' + encodeURIComponent(P.id) : '');
    if (navigator.clipboard) navigator.clipboard.writeText(u).then(function () { alert('คัดลอกลิงก์แล้ว:\n' + u); }, function () { prompt('คัดลอกลิงก์นี้', u); });
    else prompt('คัดลอกลิงก์นี้', u);
  };
  Grid.bindShareButton(document.getElementById('pShare'), function () { return P.id ? document.querySelectorAll('#pOut .page') : []; }, function () { return P.title; }, function (msg) { alert(msg); });
  document.getElementById('pVer').textContent = APP_VERSION + ' · ผู้พัฒนา: ' + APP_DEVELOPERS;
  if (PWA.installed()) document.querySelector('.pwa-add').style.display = 'none';
  /* แอปที่ติดตั้งบางเครื่องไม่มีปุ่มย้อนกลับ จึงแสดงปุ่มเมื่อเปิดมาจากหน้าอื่นของระบบ */
  function showBack() {
    var from = document.referrer;
    document.getElementById('pBack').hidden = !(PWA.installed() && from.indexOf(location.origin + '/') === 0 && from.indexOf('page=public') < 0);
  }
  document.getElementById('pBack').onclick = function (e) { if (history.length > 1) { e.preventDefault(); history.back(); } };
  showBack();
  google.script.run.withSuccessHandler(function (u) { BASE = u; }).getWebAppUrl();
  load();
  // ลายเซ็นแสดงเฉพาะเครื่องที่เข้าระบบอยู่ คนทั่วไปเห็นเส้นลงชื่อว่าง
  (function () { var t = ''; try { t = localStorage.getItem('tt_token') || ''; } catch (e) {} Sig.watch(); Sig.load(t); })();
  </script>
</body>
</html>
