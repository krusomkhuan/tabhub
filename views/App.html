<script>
/* ===================== แกนหลักของแอป ===================== */
var S = { token: null, me: null, settings: {}, days: [], D: {}, sem: '', plans: [], sessions: [], view: 'dashboard', sel: { mode: 'group' }, url: '' };
var IDX = {};
var esc = Grid.esc;
var loadingCount = 0;
window.addEventListener('unhandledrejection', function (e) { e.preventDefault(); });

function $(q, el) { return (el || document).querySelector(q); }
function $$(q, el) { return Array.prototype.slice.call((el || document).querySelectorAll(q)); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }

function loading(d) {
  loadingCount = Math.max(0, loadingCount + d);
  var el = $('#ld');
  if (loadingCount && !el) { el = document.createElement('div'); el.id = 'ld'; el.className = 'loading'; document.body.appendChild(el); }
  if (!loadingCount && el) el.remove();
}

function toast(msg, bad) {
  var t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(function () { t.remove(); }, bad ? 5000 : 2600);
}

function api(fn) {
  var args = [].slice.call(arguments, 1);
  return new Promise(function (res, rej) {
    loading(1);
    google.script.run.withSuccessHandler(function (r) { loading(-1); res(r); })
      .withFailureHandler(function (e) {
        loading(-1);
        var m = (e && e.message) || String(e);
        if (m.indexOf('SESSION_EXPIRED') >= 0) { store('tt_token', null); S.token = null; renderLogin(); toast('หมดเวลาเข้าระบบ กรุณาเข้าใหม่', 1); }
        else toast(m, 1);
        rej(e);
      })[fn].apply(null, args);
  });
}

function modal(html, wide) {
  closeModal();
  var bg = document.createElement('div'); bg.className = 'modal-bg'; bg.id = 'mbg';
  bg.innerHTML = '<div class="modal' + (wide ? ' wide' : '') + '">' + html + '</div>';
  bg.addEventListener('mousedown', function (e) { if (e.target === bg) closeModal(); });
  document.body.appendChild(bg);
  return bg.firstChild;
}
function closeModal() { var m = $('#mbg'); if (m) m.remove(); }

var ROLE_LABELS = { admin: 'ผู้ดูแลระบบ', curriculum: 'เจ้าหน้าที่งานพัฒนาหลักสูตรฯ', dept: 'วิชาการแผนก', teacher: 'ครูผู้สอน' };
var ROLE_SCOPES = { admin: 'จัดการบัญชีผู้ใช้ สำรองข้อมูล ตั้งค่าระบบ และงานวิชาการทั้งหมด', curriculum: 'จัดการข้อมูลและงานวิชาการทุกแผนก จัดตาราง ตรวจรายงาน นิเทศ และค่าสอน โดยไม่จัดการบัญชีผู้ใช้ สำรองข้อมูล หรือตั้งค่าระบบ', dept: 'จัดแผนและตาราง ตรวจรายงาน นิเทศ และงานเบิกเฉพาะแผนกที่ได้รับมอบหมาย', teacher: 'ดูตารางและข้อมูลเผยแพร่ จัดทำรายงานการสอน บันทึกสอนแทน/สอนชดเชยของตนเอง และดูใบเบิกของตนเอง' };
function rank(r) { return { teacher: 1, dept: 2, curriculum: 3, admin: 4 }[r] || 0; }
function academicRole(r) { return r === 'admin' || r === 'curriculum'; }
function can(r) { return S.me && rank(S.me.role) >= rank(r); }
/* เมนูมาจากเซิร์ฟเวอร์ S.me.role คือบทบาทของหน้าปัจจุบัน ส่วน S.me.base_role คือบทบาทจริงของบัญชี */
function menuOk(id) { return !!S.me && (S.me.menus || []).indexOf(id) >= 0; }

function buildIndex() {
  IDX = {};
  Object.keys(S.D).forEach(function (k) { IDX[k] = {}; (S.D[k] || []).forEach(function (r) { IDX[k][r.id] = r; }); });
  IDX.Plans = {}; S.plans.forEach(function (p) { IDX.Plans[p.id] = p; });
}
function nm(table, id, field) { var r = IDX[table] && IDX[table][id]; return r ? r[field || 'name'] : ''; }
function teacherNames(ids) { return Sched.ids(ids).map(function (t) { return nm('Teachers', t) || '?'; }).join(', '); }
function courseOf(id) { return (IDX.Courses && IDX.Courses[id]) || { code: '', name: '' }; }
function groupCode(id) { var g = IDX.Groups[id]; return g ? (g.code || g.name) : ''; }
function roomName(id) { var r = IDX.Rooms[id]; if (!r) return ''; return r.name; }
function semLabel(id) { var s = IDX.Semesters[id]; return s ? (s.label || (s.term + '/' + s.year)) : ''; }
function ctx() {
  return Sched.makeCtx({ settings: S.settings, locked: S.D.LockedSlots, plc: S.D.PlcSlots, teachers: S.D.Teachers, rooms: S.D.Rooms, groups: S.D.Groups, courses: S.D.Courses, plans: S.plans });
}
function deptName(id) { return nm('Departments', id); }
function sortBy(arr, f) { return arr.slice().sort(function (a, b) { return String(f(a)).localeCompare(String(f(b)), 'th', { numeric: true }); }); }

/* ===================== เข้าระบบ ===================== */
function renderLogin() {
  document.getElementById('root').innerHTML =
    '<div class="login-wrap"><div class="login-head"><h1>ระบบจัดตารางเรียน–ตารางสอน</h1>' +
    '<div class="login-college"><div class="logo sm">ตร</div><b>' + esc(S.settings.college_name || 'วิทยาลัยการอาชีพโพนทอง') + '</b></div></div>' +
    '<div class="login card">' +
    '<form id="lf"><label class="f">ชื่อผู้ใช้</label><input id="lu" autocomplete="username" required placeholder="ชื่อผู้ใช้ของคุณ">' +
    '<label class="f">รหัสผ่าน</label><div class="pw-wrap"><input id="lp" type="password" autocomplete="current-password" required>' +
    '<button type="button" class="pw-eye" id="pwEye" aria-label="แสดงรหัสผ่าน" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button></div>' +
    '<button class="btn pri lg login-submit">เข้าสู่ระบบ</button></form>' +
    '<a class="pub-link" href="?page=public" target="_blank">📅 ดูตารางเรียน / ตารางสอน (ไม่ต้องเข้าระบบ) →</a>' +
    (PWA.installed() ? '' : '<button type="button" class="btn pwa-login" onclick="PWA.add()">📲 เพิ่มไอคอนลงมือถือ</button>') + '</div><p class="app-ver">เวอร์ชัน ' + esc(APP_VERSION) + '<br>ผู้พัฒนา: ' + esc(APP_DEVELOPERS) + '<br><a href="?page=pdpa" target="_blank">นโยบายคุ้มครองข้อมูลส่วนบุคคล</a></p><button type="button" class="theme-btn login-theme" onclick="Theme.toggle()" aria-label="สลับโหมดกลางคืน" title="สลับโหมดกลางคืน"></button></div>';
  $('#pwEye').onclick = function () {
    var show = $('#lp').type === 'password';
    $('#lp').type = show ? 'text' : 'password';
    this.setAttribute('aria-pressed', show ? 'true' : 'false');
    this.setAttribute('aria-label', show ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน');
  };
  $('#lf').onsubmit = function (e) {
    e.preventDefault();
    var btn = $('#lf .login-submit'); btn.disabled = true; btn.textContent = 'กำลังเข้าสู่ระบบ…';
    api('login', $('#lu').value, $('#lp').value).then(function (r) {
      S.token = r.token; store('tt_token', r.token); S.sel = { mode: 'group' }; start();
    }).catch(function () { btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ'; });
  };
}

function start() {
  document.getElementById('root').innerHTML = '<div class="boot"><div class="spinner"></div><p>กำลังโหลดข้อมูล…</p></div>';
  var query = new URLSearchParams(location.search), hoursTeacher = query.get('hours_teacher');
  api('bootstrap', S.token, (hoursTeacher && query.get('sem')) || store('tt_sem') || '').then(function (b) {
    S.me = b.me; S.settings = b.settings; S.days = b.days; S.D = b.data; S.url = b.url;
    S.sem = b.sem; S.plans = b.plans; S.sessions = b.sessions; buildIndex();
    if (S.me.role === 'dept' && !S.sel.dept) S.sel.dept = S.me.department_id;
    renderShell();
    if (b.backup_warning) setTimeout(function () { toast(b.backup_warning, 1); }, 600);
    if (hoursTeacher) { S.sel.hoursTeacher = hoursTeacher; return go('hours'); }
    go(S.me.role === 'teacher' ? 'mine' : 'dashboard');
  }).catch(function () { if (!S.token) return; store('tt_token', null); S.token = null; renderLogin(); });
}

/* ลิงก์ภายใน (#เมนู) — หน้าเว็บแอปอยู่ใน iframe ของ Google จึงห้ามเปลี่ยน URL จริง */
document.addEventListener('click', function (e) {
  var a = e.target.closest && e.target.closest('a[href^="#"]');
  if (!a) return;
  e.preventDefault();
  var v = a.getAttribute('href').slice(1);
  if (v === 'hours') S.sel.hoursTeacher = null; // กดเมนูแล้วกลับไปหน้ารายชื่อครู
  if (v && S.me) go(v);
}, true);

function loadSchedule() {
  if (!S.sem) { S.plans = []; S.sessions = []; buildIndex(); return Promise.resolve(); }
  return api('getSchedule', S.token, S.sem).then(function (r) { S.plans = r.plans; S.sessions = r.sessions; buildIndex(); });
}

function reloadData() {
  return api('bootstrap', S.token, S.sem).then(function (b) { S.settings = b.settings; S.D = b.data; S.plans = b.plans; S.sessions = b.sessions; buildIndex(); });
}

/* ===================== เมนู ===================== */
var NAV = [
  { sec: 'หลัก' },
  { id: 'dashboard', label: 'ภาพรวม', role: 'dept' },
  { id: 'mine', label: 'ตารางสอนของฉัน', role: 'teacher' },
  { id: 'schedule', label: 'จัดตารางเรียน', role: 'dept' },
  { id: 'plans', label: 'แผนการเรียน', role: 'dept' },
  { id: 'plancheck', label: 'ตรวจสอบแผนการเรียน', role: 'teacher' },
  { id: 't-PlcSlots', label: 'คาบ PLC', role: 'dept' },
  { id: 'manual', label: 'คู่มือการใช้งาน', role: 'teacher' },
  { sec: 'รายงาน' },
  { id: 'reports', label: 'ตารางเรียน / ตารางสอน / ห้อง', role: 'teacher' },
  { id: 'deptview', label: 'ตารางสอนรวมของแผนก', role: 'teacher' },
  { id: 'hours', label: 'สรุปชั่วโมงสอน', role: 'teacher' },
  { id: 'log', label: 'ประวัติการแก้ไข', role: 'dept' },
  { sec: 'ข้อมูลพื้นฐาน', role: 'curriculum' },
  { id: 't-Semesters', label: 'ปีการศึกษา / ภาคเรียน', role: 'curriculum' },
  { id: 't-Departments', label: 'แผนกวิชา', role: 'curriculum' },
  { id: 't-Majors', label: 'สาขาวิชา', role: 'curriculum' },
  { id: 't-Teachers', label: 'ครูผู้สอน', role: 'curriculum' },
  { id: 't-Buildings', label: 'อาคาร', role: 'curriculum' },
  { id: 't-Rooms', label: 'ห้องเรียน', role: 'curriculum' },
  { id: 't-Courses', label: 'รายวิชา', role: 'curriculum' },
  { id: 't-Groups', label: 'กลุ่มเรียน', role: 'curriculum' },
  { id: 't-Windows', label: 'คิวจัดตารางของแผนก', role: 'curriculum' },
  { sec: 'ระบบ', role: 'admin' },
  { id: 'users', label: 'ผู้ใช้งาน', role: 'admin' },
  { id: 'colors', label: 'สีตารางเรียน', role: 'admin' },
  { id: 'settings', label: 'ตั้งค่าวิทยาลัย', role: 'admin' },
  { id: 'import', label: 'นำเข้าข้อมูล', role: 'curriculum' },
  { id: 'backup', label: 'สำรองข้อมูล', role: 'admin' },
  { sec: 'ช่วยเหลือ' },
  { id: 'issues', label: 'แจ้งปัญหาการใช้งาน', role: 'teacher' }
];

var NAV_ICON = { dashboard: '🏠', mine: '🗓', schedule: '🧩', plans: '📚', plancheck: '✅', manual: '📖', backup: '💾', colors: '🎨', issues: '🛟', reports: '🖨', deptview: '👥', hours: '⏱', log: '📝',
  'ot-claims': '💰', 'ot-subs': '🔁', 'ot-summary': '🧾', 'ot-teachers': '🎚', 'ot-holidays': '🏖', users: '👤', settings: '⚙', import: '⤵',
  't-OtSchemes': '📋', 't-OtPerHead': '🙋', 't-OtRounds': '📆', 't-OtBlocked': '⛔', 't-Semesters': '📅', 't-Departments': '🏫', 't-Majors': '🎓',
  't-Teachers': '🧑‍🏫', 't-Buildings': '🏢', 't-Rooms': '🚪', 't-Courses': '📘', 't-Groups': '👩‍🎓', 't-Windows': '⏳', 't-PlcSlots': '🤝' };
function renderShell() {
  var navItems = NAV.filter(function (n) { return n.sec || menuOk(n.id); });
  var nav = navItems.filter(function (n, i) { return !n.sec || (navItems[i + 1] && !navItems[i + 1].sec); }).map(function (n) {
    return n.sec ? '<div class="sec">' + n.sec + '</div>' : '<a class="nav" href="#' + n.id + '" data-v="' + n.id + '"><span class="ic">' + (NAV_ICON[n.id] || '•') + '</span>' + n.label + '</a>';
  }).join('');
  var semOpts = S.D.Semesters.map(function (s) { return '<option value="' + esc(s.id) + '"' + (String(s.id) === String(S.sem) ? ' selected' : '') + '>ภาคเรียน ' + esc(s.label || (s.term + '/' + s.year)) + '</option>'; }).join('');
  var baseRole = S.me.base_role || S.me.role, roleTh = ROLE_LABELS[baseRole] || baseRole;
  var initials = String(S.me.name || '?').replace(/^(นาย|นางสาว|นาง|ว่าที่\S*)/, '').trim().slice(0, 2);
  document.getElementById('root').innerHTML =
    '<div class="shell"><div class="side-bg" id="sideBg"></div><aside class="side" id="side"><div class="brand"><div class="logo sm">ตร</div><div>ระบบจัดตารางเรียน<small>' + esc(S.settings.college_name || '') + '</small></div></div>' + nav +
    '<div class="sec">อื่นๆ</div><a class="nav" href="?page=public" target="_blank"><span class="ic">🌐</span>หน้าเผยแพร่สาธารณะ ↗</a><a class="nav" href="?page=pdpa" target="_blank"><span class="ic">🔒</span>นโยบายข้อมูลส่วนบุคคล (PDPA) ↗</a>' +
    (PWA.installed() ? '' : '<a class="nav" href="javascript:void 0" onclick="PWA.add()"><span class="ic">📲</span>เพิ่มไอคอนลงมือถือ</a>') +
    '<p class="app-ver side-ver">เวอร์ชัน ' + esc(APP_VERSION) + '<br>ผู้พัฒนา: ' + esc(APP_DEVELOPERS) + '</p></aside>' +
    '<div class="main"><div class="top no-print"><button class="btn sm menu-btn" id="mb">☰</button><h2 id="title"></h2>' +
    '<select id="semSel" class="sem">' + semOpts + '</select><button type="button" class="theme-btn" onclick="Theme.toggle()" aria-label="สลับโหมดกลางคืน" title="สลับโหมดกลางคืน"></button>' +
    (menuOk('plancheck') ? '<button type="button" class="bell-btn" id="bellBtn" aria-label="การแจ้งเตือนแผนการเรียน">🔔<span class="bell-n" id="bellN"></span></button>' : '') +
    '<div class="user" id="userBtn"><span class="av">' + (S.me.avatar ? '<img src="' + esc(S.me.avatar) + '" alt="">' : esc(initials)) + '</span><span class="un"><b>' + esc(S.me.name) + '</b><small>' + roleTh + '</small></span>' +
    '<div class="umenu" id="umenu"><a href="javascript:void 0" id="profBtn">👤 แก้ไขโปรไฟล์</a><a href="javascript:void 0" id="pwBtn">🔑 เปลี่ยนรหัสผ่าน</a><a href="javascript:void 0" id="outBtn">⎋ ออกจากระบบ</a></div></div></div>' +
    '<div class="content" id="content"></div></div></div>';
  $('#semSel').onchange = function () { S.sem = this.value; store('tt_sem', S.sem); loadSchedule().then(function () { go(S.view); }); };
  $('#outBtn').onclick = function () { api('logout', S.token); store('tt_token', null); S.token = null; S.sel = { mode: 'group' }; renderLogin(); };
  $('#pwBtn').onclick = changePw;
  $('#profBtn').onclick = editProfile;
  if ($('#bellBtn')) $('#bellBtn').onclick = function () { go('plancheck'); };
  $('#userBtn').onclick = function (e) { if (e.target.closest('#umenu')) return; $('#umenu').classList.toggle('open'); };
  $('#mb').onclick = function () { $('#side').classList.toggle('open'); $('#sideBg').classList.toggle('open'); };
  $('#sideBg').onclick = function () { $('#side').classList.remove('open'); this.classList.remove('open'); };
  TableFilter.watch($('#content'));
}

function go(v) {
  var n = NAV.filter(function (x) { return x.id === v && menuOk(x.id); })[0] || NAV.filter(function (x) { return x.id && menuOk(x.id); })[0];
  if (!n) { $('#content').innerHTML = '<div class="card">บัญชีนี้ยังไม่ได้รับสิทธิ์ใช้เมนูใด กรุณาติดต่อผู้ดูแลระบบ</div>'; return; }
  v = n.id;
  // ทำงานในหน้านี้ตามระดับของเมนูที่ได้รับ เช่น ครูที่ได้เมนูจัดตารางจะใช้หน้านั้นแบบวิชาการแผนก
  var base = S.me.base_role || S.me.role;
  S.me.role = rank(n.role) > rank(base) ? n.role : base;
  if (S.me.role === 'dept' && !S.sel.dept) S.sel.dept = S.me.department_id;
  S.view = v;
  window.scrollTo(0, 0);
  $$('.side a.nav').forEach(function (a) { a.classList.toggle('on', a.dataset.v === v); });
  $('#side').classList.remove('open'); if ($('#sideBg')) $('#sideBg').classList.remove('open');
  $('#title').textContent = n.label;
  updateBell();
  var el = $('#content');
  if (v.indexOf('t-') === 0) return viewTable(el, v.slice(2));
  (VIEWS[v] || function () { el.innerHTML = ''; })(el);
}

var VIEWS = {};

/* ===================== ตัวกรองตารางข้อมูล (ทุกเมนู) =====================
   ติดให้ทุกตารางข้อมูลในหน้าเนื้อหาโดยอัตโนมัติ: ช่องค้นหา และช่องเลือกของคอลัมน์ที่เป็นหมวดหมู่
   (เช่น บทบาท แผนก สถานะ) ตัวเลือกสร้างจากค่าที่มีในตารางจริง จึงใช้ได้กับทุกเมนูโดยไม่ต้องตั้งค่ารายหน้า
   ไม่ติดกับตารางเล็ก เอกสารสำหรับพิมพ์ ตารางในหน้าต่าง และตารางที่มีแถวรวมเซลล์ */
var TableFilter = (function () {
  var MIN_ROWS = 8, MAX_CHOICES = 40, MAX_LEN = 40, MAX_SELECTS = 4, state = {};
  // คอลัมน์ที่ไม่ใช่หมวดหมู่ ค้นหาด้วยช่องค้นหาแทน
  var NOT_CATEGORY = /อีเมล|วันที่|วันเริ่ม|เวลา|หมายเหตุ|ชื่อ|ลำดับ|รหัส|เลขที่|ลิงก์|รายละเอียด|ที่อยู่|โทร/;
  var NUMBER = /^[\d.,\s\-–/:]+$/;
  function text(el) { return String(el.innerText || el.textContent || '').replace(/\s+/g, ' ').trim(); }
  function usable(tbl) {
    if (tbl.getAttribute('data-tf') || tbl.closest('.page, .rp-doc, .modal, [data-nofilter]')) return false;
    var body = tbl.tBodies[0];
    if (!body || body.rows.length < MIN_ROWS || (tbl.tHead && tbl.tHead.rows.length > 1)) return false;
    return ![].some.call(body.rows, function (r) { return [].some.call(r.cells, function (c) { return c.rowSpan > 1; }); });
  }
  function attach(tbl, idx) {
    tbl.setAttribute('data-tf', '1');
    var head = tbl.tHead ? tbl.tHead.rows[0] : null;
    var heads = head ? [].map.call(head.cells, text) : [];
    // แถวข้อมูลคือแถวที่มีช่องครบตามหัวตาราง แถวอื่น (ไม่มีข้อมูล ยอดรวม) แสดงเสมอ
    var rows = [].filter.call(tbl.tBodies[0].rows, function (r) { return r.cells.length === heads.length && !/total|sum/.test(r.className); });
    if (rows.length < MIN_ROWS) return;
    var cells = rows.map(function (r) { return [].map.call(r.cells, text); });
    var whole = rows.map(function (r, i) { return cells[i].join(' ').toLowerCase(); });
    var cols = [];
    heads.forEach(function (h, i) {
      if (!h || NOT_CATEGORY.test(h) || cols.length >= MAX_SELECTS) return;
      var seen = {}, list = [];
      cells.forEach(function (c) { var v = c[i]; if (v && !seen[v]) { seen[v] = 1; list.push(v); } });
      // หมวดหมู่ต้องมีค่าซ้ำกันพอสมควร ไม่ใช่ตัวเลข และข้อความไม่ยาว
      if (list.length >= 2 && list.length <= MAX_CHOICES && list.length * 2 <= rows.length &&
          list.every(function (v) { return v.length <= MAX_LEN; }) && list.filter(function (v) { return NUMBER.test(v); }).length * 2 < list.length) {
        cols.push({ i: i, head: h, values: list.sort(function (a, b) { return a.localeCompare(b, 'th', { numeric: true }); }) });
      }
    });
    var box = tbl.closest('.tablewrap') || tbl, card = tbl.closest('.card') || box.parentNode;
    var ownSearch = card && card.querySelector('input[placeholder^="ค้นหา"]:not(.tf-q)');
    if (!cols.length && ownSearch) return;
    var key = S.view + '|' + idx + '|' + heads.join('/'), st = state[key] = state[key] || { q: '', cols: {} };
    var bar = document.createElement('div');
    bar.className = 'tf-bar no-print';
    bar.innerHTML = (ownSearch ? '' : '<input class="tf-q" type="search" placeholder="ค้นหาในตาราง…" aria-label="ค้นหาในตาราง">') +
      cols.map(function (c) {
        if (c.values.indexOf(st.cols[c.i]) < 0) delete st.cols[c.i];
        return '<select data-tf-col="' + c.i + '" aria-label="กรองตาม' + esc(c.head) + '"><option value="">' + esc(c.head) + ': ทั้งหมด</option>' +
          c.values.map(function (v) { return '<option value="' + esc(v) + '"' + (st.cols[c.i] === v ? ' selected' : '') + '>' + esc(c.head) + ': ' + esc(v) + '</option>'; }).join('') + '</select>';
      }).join('') + '<button type="button" class="btn sm tf-clear">ล้างตัวกรอง</button><span class="tf-count small muted"></span>';
    box.parentNode.insertBefore(bar, box);
    var q = bar.querySelector('.tf-q');
    if (q) q.value = st.q;
    function apply() {
      var needle = (st.q || '').toLowerCase().trim(), shown = 0;
      rows.forEach(function (r, i) {
        var ok = (!needle || whole[i].indexOf(needle) >= 0) && Object.keys(st.cols).every(function (ci) { return cells[i][ci] === st.cols[ci]; });
        r.style.display = ok ? '' : 'none';
        if (ok) shown++;
      });
      var active = needle || Object.keys(st.cols).length;
      bar.querySelector('.tf-count').textContent = active ? 'แสดง ' + shown + ' จาก ' + rows.length + ' รายการ' : rows.length + ' รายการ';
      bar.querySelector('.tf-clear').hidden = !active;
    }
    if (q) q.oninput = function () { st.q = q.value; apply(); };
    [].forEach.call(bar.querySelectorAll('[data-tf-col]'), function (s) {
      s.onchange = function () { var i = s.getAttribute('data-tf-col'); if (s.value) st.cols[i] = s.value; else delete st.cols[i]; apply(); };
    });
    bar.querySelector('.tf-clear').onclick = function () {
      st.q = ''; st.cols = {}; if (q) q.value = '';
      [].forEach.call(bar.querySelectorAll('[data-tf-col]'), function (s) { s.value = ''; });
      apply();
    };
    apply();
  }
  // table.data คือตารางของระบบ table.table คือตารางแบบ Bootstrap ในเมนูนิเทศและรายงานการสอน
  function scan(root) { [].forEach.call(root.querySelectorAll('table.data, table.table'), function (t, i) { if (usable(t)) attach(t, i); }); }
  function watch(root) {
    if (!root || root._tf) return;
    var timer;
    root._tf = new MutationObserver(function () { clearTimeout(timer); timer = setTimeout(function () { scan(root); }, 60); });
    root._tf.observe(root, { childList: true, subtree: true });
    scan(root);
  }
  return { watch: watch, scan: scan };
})();

/* ย่อรูปบนเครื่องก่อนส่ง ตัดกลางเป็นจัตุรัส และลดคุณภาพจนเล็กพอเก็บในแถวผู้ใช้ */
function avatarFromFile(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var side = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement('canvas'), q = 0.85, out;
      c.width = c.height = 256;
      var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 256, 256);
      x.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, 256, 256);
      URL.revokeObjectURL(url);
      do { out = c.toDataURL('image/jpeg', q); q -= 0.15; } while (out.length > 55000 && q > 0.2);
      resolve(out);
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('read')); };
    img.src = url;
  });
}

/* ===================== ตรวจสอบแผนการเรียน ===================== */
function planState(need, placed) {
  if (!need) return ['over', 'ไม่ได้กำหนดคาบ'];
  var left = need - placed;
  return left < 0 ? ['over', 'เกินแผน'] : left === 0 ? ['done', 'ครบแล้ว'] : placed > 0 ? ['part', 'ยังไม่ครบ'] : ['none', 'ยังไม่จัด'];
}
/* ครูเห็นวิชาของตนเอง ตัวแทนแผนกเห็นกลุ่มในแผนก ผู้ดูแลระบบเห็นทั้งหมด */
function planCheck() {
  var C = ctx(), placed = {}, me = S.me;
  S.sessions.forEach(function (s) { placed[s.plan_id] = (placed[s.plan_id] || 0) + (Number(s.length) || 0); });
  function inDept(gid) { return academicRole(me.role) || (IDX.Groups[gid] && String(IDX.Groups[gid].department_id) === String(me.department_id)); }
  var rows = S.plans.filter(function (p) {
    return me.role === 'teacher' ? Sched.ids(p.teacher_ids).indexOf(String(me.teacher_id)) >= 0 : inDept(p.group_id);
  }).map(function (p) {
    var need = Sched.planPeriods(p, C), got = placed[p.id] || 0;
    return { plan: p, gid: String(p.group_id), need: need, placed: got, state: planState(need, got) };
  });
  var busy = {};
  S.plans.forEach(function (p) { busy[p.group_id] = 1; });
  S.sessions.forEach(function (s) { busy[s.group_id] = 1; });
  var empty = me.role === 'teacher' ? [] : S.D.Groups.filter(function (g) { return !busy[g.id] && inDept(g.id); });
  var bad = rows.filter(function (r) { return r.state[0] !== 'done'; }), groups = {}, short = 0;
  bad.forEach(function (r) { groups[r.gid] = 1; short += Math.max(0, r.need - r.placed); });
  return { rows: rows, bad: bad, empty: empty, groupCount: Object.keys(groups).length, short: short, total: bad.length + empty.length };
}
/* กระดิ่งบอกจำนวนรายการที่ต้องแก้ และเตือนหนึ่งครั้งเมื่อเข้าใช้หรือเปลี่ยนภาคเรียน */
function updateBell() {
  var b = $('#bellBtn'); if (!b || !S.plans) return;
  var c = planCheck();
  $('#bellN').textContent = c.total ? (c.total > 99 ? '99+' : c.total) : '';
  b.title = c.total ? planIssueText(c) : 'จัดตารางครบตามแผนแล้ว';
  if (c.total && S.bellSem !== S.sem) toast(planIssueText(c) + ' ดูได้ที่กระดิ่งด้านบน');
  S.bellSem = S.sem;

/* บอกให้ตรงกับสิ่งที่พบ เพราะเกินแผนหรือไม่มีแผน ไม่ใช่การจัดไม่ครบ */
function planIssueText(c) {
  var n = function (st) { return c.bad.filter(function (r) { return r.state[0] === st; }).length; }, parts = [];
  var short = n('part') + n('none'), other = n('over');
  if (short) parts.push('ยังจัดไม่ครบ ' + short + ' วิชา ขาดอีก ' + c.short + ' คาบ');
  if (other) parts.push('คาบเกินแผนหรือไม่ได้กำหนดคาบ ' + other + ' วิชา');
  if (c.empty.length) parts.push('กลุ่มที่ไม่มีแผน ' + c.empty.length + ' กลุ่ม');
  return 'แผนการเรียนต้องตรวจสอบ: ' + parts.join(' · ');
}
function planAlertHtml(c) {
  if (c.total) return '<a class="plan-alert" href="#plancheck">⚠ ' + planIssueText(c) + ' — กดเพื่อตรวจสอบ</a>';
  return c.rows.length ? '<a class="plan-alert ok" href="#plancheck">✓ จัดตารางครบตามแผนการเรียนแล้ว</a>' : '';
}

    stat('📘', D.Courses.length, 'รายวิชา') + stat('🚪', D.Rooms.length, 'ห้องเรียน') + '</div>' +
    '<h3 class="sec-title">ทางลัด</h3><div class="tiles">' + tiles.map(function (t) {
      return '<a class="tile" href="#' + t[0] + '"><span class="ti">' + t[1] + '</span><b>' + t[2] + '</b><span class="muted small">' + t[3] + '</span></a>';
    }).join('') + '</div>' +
    '<div class="card" style="margin-top:16px"><h3>หน้าเผยแพร่สำหรับครูและนักเรียน</h3><p class="small muted" style="margin:0 0 8px">ส่งลิงก์นี้ให้ครู/นักเรียนดูตารางได้โดยไม่ต้องเข้าระบบ</p>' +
    '<div class="row"><input readonly value="' + esc(S.url) + '?page=public" onclick="this.select()" class="grow"><a class="btn pri" href="?page=public" target="_blank">เปิด ↗</a></div></div>';
};
function stat(ic, n, l) { return '<div class="card stat-card"><span class="si">' + ic + '</span><div><div class="stat">' + n + '</div><div class="stat-l">' + l + '</div></div></div>'; }

/* ===================== จัดตารางเรียน ===================== */
function groupListHtml(filterDept, selected, linkAttr) {
  var groups = S.D.Groups.filter(function (g) { return !filterDept || String(g.department_id) === String(filterDept); });
  var byLevel = {};
  sortBy(groups, function (g) { return g.code; }).forEach(function (g) { var l = g.year_level || g.level || 'อื่นๆ'; (byLevel[l] = byLevel[l] || []).push(g); });
  return Object.keys(byLevel).sort().map(function (l) {
    return '<div class="h">' + esc(l) + '</div>' + byLevel[l].map(function (g) {
      return '<a href="javascript:void 0" draggable="false" title="คลิกเพื่อเลือกกลุ่มเรียน แล้วลากก้อนรายวิชาลงตาราง" ' + linkAttr + '="' + esc(g.id) + '" class="' + (String(g.id) === String(selected) ? 'on' : '') + '">' + esc(g.code || g.name) + '</a>';
    }).join('');
  }).join('') || '<p class="muted small" style="padding:8px">ไม่มีกลุ่มเรียน</p>';
}

function deptOptions(sel, allLabel) {
  return '<option value="">' + (allLabel || 'ทุกแผนก') + '</option>' + sortBy(S.D.Departments, function (d) { return d.sort || d.name; }).map(function (d) {
    return '<option value="' + esc(d.id) + '"' + (String(d.id) === String(sel) ? ' selected' : '') + '>' + esc(d.name) + '</option>';
  }).join('');
}

function canEditGroup(gid) {
  if (!S.me) return false;
  if (academicRole(S.me.role)) return true;
  if (S.me.role !== 'dept') return false;
  var g = IDX.Groups[gid]; return g && String(g.department_id) === String(S.me.department_id);
}

VIEWS.schedule = function (el) {
  if (!S.sem) { el.innerHTML = '<div class="card">ยังไม่มีภาคเรียน — เพิ่มที่เมนู ปีการศึกษา / ภาคเรียน</div>'; return; }
  var sel = S.sel;
  var mode = sel.mode || 'group';
  var targetOpts = '';
  if (mode === 'teacher') targetOpts = sortBy(S.D.Teachers.filter(function (t) { return !sel.dept || String(t.department_id) === String(sel.dept); }), function (t) { return t.name; })
    .map(function (t) { return '<option value="' + esc(t.id) + '"' + (String(t.id) === String(sel.teacher) ? ' selected' : '') + '>' + esc(t.name) + '</option>'; }).join('');
  if (mode === 'room') targetOpts = sortBy(S.D.Rooms, function (r) { return nm('Buildings', r.building_id) + r.name; })
    .map(function (r) { return '<option value="' + esc(r.id) + '"' + (String(r.id) === String(sel.room) ? ' selected' : '') + '>' + esc(r.name + ' · ' + nm('Buildings', r.building_id)) + '</option>'; }).join('');

  el.innerHTML = '<div class="split"><div class="card" style="padding:10px">' +
    '<select id="sDept" style="margin-bottom:8px">' + deptOptions(sel.dept) + '</select>' +
    '<div class="row" style="gap:4px;margin-bottom:8px">' + ['group:กลุ่ม', 'teacher:ครู', 'room:ห้อง'].map(function (x) {
      var p = x.split(':'); return '<button class="btn sm' + (mode === p[0] ? ' pri' : '') + '" data-mode="' + p[0] + '">' + p[1] + '</button>';
    }).join('') + '</div>' +
    (mode === 'group' ? '<div class="glist">' + groupListHtml(sel.dept, sel.group, 'data-g') + '</div>'
      : '<select id="sTarget" size="18" style="height:60vh">' + targetOpts + '</select>') +
    '</div><div id="schedMain"></div></div>';

  $('#sDept').onchange = function () { sel.dept = this.value; VIEWS.schedule(el); };
  $$('[data-mode]', el).forEach(function (b) { b.onclick = function () { sel.mode = b.dataset.mode; VIEWS.schedule(el); }; });
  $$('[data-g]', el).forEach(function (a) { a.onclick = function () { sel.group = a.dataset.g; sel.chip = null; VIEWS.schedule(el); }; });
  if ($('#sTarget')) $('#sTarget').onchange = function () { sel[mode] = this.value; renderSchedMain(); };
  renderSchedMain();
};

function currentSessions() {
  var sel = S.sel, mode = sel.mode || 'group';
  if (mode === 'group') return S.sessions.filter(function (s) { return String(s.group_id) === String(sel.group); });
  if (mode === 'teacher') return S.sessions.filter(function (s) { return Sched.ids(s.teacher_ids).indexOf(String(sel.teacher)) >= 0; });
  return S.sessions.filter(function (s) { return String(s.room_id) === String(sel.room); });
}

/* ครูทุกคนในชุดคาบที่เรียนด้วยกัน ไม่ซ้ำกัน */
function allTeacherIds(list) {
  var seen = [];
  list.forEach(function (x) { Sched.ids(x.teacher_ids).forEach(function (t) { if (seen.indexOf(t) < 0) seen.push(t); }); });
  return seen.join(',');
}

function sessionLabel(mode) {
  return function (s, list) {
    var c = courseOf(s.course_id), joint = list && list.length > 1;
    var h = '<b>' + esc(c.code) + '</b><span>' + esc(c.name || '') + '</span>', parts = [];
    if (mode !== 'teacher') h += '<span>' + esc(teacherNames(allTeacherIds(list || [s]))) + '</span>';
    if (joint) parts.push(list.map(function (x) { return groupCode(x.group_id); }).join(' - ') + ' (เรียนรวม)');
    else if (mode !== 'group') parts.push(groupCode(s.group_id));
    if (mode !== 'room' && s.room_id) parts.push(roomName(s.room_id));
    return h + (parts.length ? '<span>' + esc(parts.join(' · ')) + '</span>' : '');
  };
}

/* คาบ PLC ของครูคนนี้ ในรูปแบบช่องล็อกสำหรับตาราง */
function plcLocks(teacherId) {
  var out = [], t = IDX.Teachers[teacherId] || {};
  Grid.plcFor(teacherId, t.department_id, S.D.PlcSlots).forEach(function (x) {
    for (var k = 0, n = Number(x.length) || 1; k < n; k++) out.push({ day: x.day, period: Number(x.start) + k, label: 'PLC' });
  });
  return out;
}

function sessionColor(s) {
  var c = courseOf(s.course_id);
  return Grid.sessionColor({ settings: S.settings, groups: S.D.ColorGroups || [], course_id: s.course_id, color: c.color, course_type: c.course_type, name: c.name, teacher_ids: s.teacher_ids, room_id: s.room_id, room: s.room_id ? roomName(s.room_id) : '', department_id: (IDX.Groups[s.group_id] || {}).department_id, workplace: Sched.isWorkplace(s, ctx()) });
}

function sessionHourType(s) {
  return s.hour_type || (IDX.Plans[s.plan_id] || {}).hour_type || 'in';
}

function hourTypeOptions(value, inherited) {
  return [['', 'ตามแผนการเรียน' + (inherited ? ' (' + ({ in: 'คาบใน', out: 'คาบนอก', none: 'ไม่นับ' }[inherited] || 'คาบใน') + ')' : '')], ['in', 'คาบใน'], ['out', 'คาบนอก'], ['none', 'ไม่นับ']].map(function (x) {
    return '<option value="' + x[0] + '"' + (String(value || '') === x[0] ? ' selected' : '') + '>' + x[1] + '</option>';
  }).join('');
}

/* คาบอื่นที่แสดงรวมช่องเดียวกับคาบนี้ (รวมตัวคาบเองด้วย) */
function jointPeers(s) {
  var same = S.sessions.filter(function (x) { return String(x.day) === String(s.day) && String(x.course_id) === String(s.course_id); });
  return Grid.mergeItems(same).filter(function (list) { return list.indexOf(s) >= 0; })[0] || [s];
}

/* ลากช่องที่รวมหลายกลุ่มได้เมื่อมีรหัสเรียนร่วมเดียวกัน เพราะการย้ายจะย้ายตามรหัสนี้ทั้งชุด */
function sharesJointKey(list) {
  var k = (IDX.Plans[list[0].plan_id] || {}).joint_key;
  return !!k && list.every(function (x) { return (IDX.Plans[x.plan_id] || {}).joint_key === k; });
}

function conflictMap() {
  var C = ctx(), out = {};
  S.sessions.forEach(function (s) {
    var others = S.sessions.filter(function (x) { return x !== s && String(x.day) === String(s.day); });
    if (Sched.check(s, others, C).some(function (p) { return p.hard && p.type !== 'maxday'; })) out[s.id] = 1;
  });
  return out;
}

function renderSchedMain() {
  var box = $('#schedMain'); if (!box) return;
  var sel = S.sel, mode = sel.mode || 'group';
  var target = mode === 'group' ? sel.group : sel[mode];
  if (!target) { box.innerHTML = '<div class="card muted">เลือก' + { group: 'กลุ่มเรียน', teacher: 'ครู', room: 'ห้อง' }[mode] + 'ด้านซ้ายเพื่อเริ่มจัดตาราง</div>'; return; }
  var title = mode === 'group' ? 'ตารางเรียน ' + groupCode(target) + ' · ' + deptName((IDX.Groups[target] || {}).department_id)
    : mode === 'teacher' ? 'ตารางสอน ' + nm('Teachers', target) : 'ตารางใช้ห้อง ' + roomName(target);
  var sessions = currentSessions();
  var cmap = conflictMap();
  var editableGroup = mode === 'group' && canEditGroup(target);
  var hours = sessions.reduce(function (a, s) { return a + Number(s.length); }, 0);

  var tools = '';
  if (can('dept')) {
    tools = '<div class="row no-print" style="margin-bottom:10px">' +
      (editableGroup ? '<button class="btn pri sm" id="aGroup">⚡ จัดอัตโนมัติ (กลุ่มนี้)</button>' : '') +
      '<button class="btn sm" id="aDept">⚡ จัดอัตโนมัติทั้งแผนก</button>' +
      (can('curriculum') ? '<button class="btn sm" id="aAll">⚡ ทั้งวิทยาลัย</button>' : '') +
      '<label class="small row" style="gap:4px"><input type="checkbox" id="aClear"> ล้างคาบที่ไม่ล็อกก่อนจัด</label>' +
      '<span class="grow"></span>' +
      (editableGroup ? '<button class="btn sm bad" id="clrGroup">ล้างตารางกลุ่มนี้</button>' : '') +
      '<button class="btn sm" id="chkAll">ตรวจการชนทั้งหมด</button></div>';
  }
  box.innerHTML = '<div class="card">' + tools +
    '<div class="row" style="margin-bottom:8px"><h3 style="margin:0" class="grow">' + esc(title) + '</h3><span class="tag">' + hours + ' คาบ/สัปดาห์</span></div>' +
    '<div id="gridBox"></div>' +
    '<p class="small muted no-print" style="margin:8px 0 0">ลากวิชาจากรายการด้านล่าง (หรือแตะวิชาแล้วแตะช่อง) ไปวางในตาราง · ลากคาบที่ลงแล้วเพื่อย้าย หรือบนมือถือแตะคาบแล้วเลือก ย้ายคาบ · คลิกคาบเพื่อเปลี่ยนห้อง/ล็อก/ลบ · ช่องเขียว = วางได้ เหลือง = มีคำเตือน แดง = ชน</p></div>' +
    (mode === 'group' ? '<div class="card" id="planBox"></div>' : '');

  $('#gridBox').innerHTML = Grid.render({
    settings: S.settings, dayNames: S.days, sessions: sessions, locked: S.D.LockedSlots,
    label: sessionLabel(mode), color: sessionColor, conflictIds: cmap, extraLocked: mode === 'teacher' ? plcLocks(target) : [],
    editable: function (s, list) {
      return (list.length === 1 || sharesJointKey(list)) && list.every(function (x) {
        return canEditGroup(x.group_id) && ((String(x.locked) !== 'true' && !Sched.isWorkplace(x, ctx())) || can('curriculum'));
      });
    }
  });
  if (mode === 'group') renderPlanBox(target, editableGroup);
  bindGrid();

  if ($('#aGroup')) $('#aGroup').onclick = function () { runAuto({ groupIds: [target] }); };
  if ($('#aDept')) $('#aDept').onclick = function () {
    var d = S.me.role === 'dept' ? S.me.department_id : (sel.dept || (IDX.Groups[sel.group] || {}).department_id);
    if (!d) return toast('เลือกแผนกด้านซ้ายก่อน', 1);
    if (confirm('จัดตารางอัตโนมัติทุกกลุ่มของแผนก ' + deptName(d) + ' ?')) runAuto({ departmentId: d });
  };
  if ($('#aAll')) $('#aAll').onclick = function () { if (confirm('จัดตารางอัตโนมัติทั้งวิทยาลัย? (อาจใช้เวลาหลายนาที)')) runAuto({}); };
  if ($('#clrGroup')) $('#clrGroup').onclick = function () {
    if (!confirm('ลบคาบที่ไม่ได้ล็อกทั้งหมดของกลุ่มนี้?')) return;
    api('clearSchedule', S.token, S.sem, [target]).then(function (ss) { S.sessions = ss; renderSchedMain(); });
  };
  if ($('#chkAll')) $('#chkAll').onclick = showAllConflicts;
}

function runAuto(opt) {
  opt.clear = $('#aClear') && $('#aClear').checked;
  toast('กำลังจัดตาราง… อาจใช้เวลาสักครู่');
  api('runAutoSchedule', S.token, S.sem, opt).then(function (r) {
    S.sessions = r.sessions; renderSchedMain();
    modal('<h3>จัดตารางอัตโนมัติเสร็จ</h3><p>ลงตารางเพิ่ม <b>' + r.added + '</b> คาบ</p>' +
      (r.unplaced.length ? '<p class="tag bad">ยังลงไม่ได้ ' + r.unplaced.length + ' ก้อน</p><ul class="small">' +
        r.unplaced.map(function (u) { return '<li>' + esc(u.label) + ' — ' + u.length + ' คาบ</li>'; }).join('') +
        '</ul><p class="small muted">สาเหตุที่พบบ่อย: ครูมีภาระเต็มสัปดาห์ ห้องที่กำหนดถูกใช้ครบ หรือคาบติดกันยาวเกินช่องว่าง — ลองแบ่งคาบ (เช่น 2+2) เปลี่ยนห้อง หรือลากวางเองแล้วดูว่าชนกับอะไร</p>'
        : '<p class="tag ok">ลงครบทุกวิชาแล้ว</p>') +
      '<div class="actions"><button class="btn pri" onclick="closeModal()">ตกลง</button></div>');
  });
}

function showAllConflicts() {
  var C = ctx(), rows = [];
  S.sessions.forEach(function (s) {
    var probs = Sched.check(s, S.sessions.filter(function (x) { return x !== s; }), C).filter(function (p) { return p.hard; });
    if (probs.length) rows.push({ s: s, probs: probs });
  });
  modal('<h3>ตรวจการชนทั้งภาคเรียน</h3>' + (rows.length ? '<div class="tablewrap" style="max-height:60vh"><table class="data"><thead><tr><th>กลุ่ม</th><th>วิชา</th><th>วัน/คาบ</th><th>ปัญหา</th></tr></thead><tbody>' +
    rows.map(function (r) {
      return '<tr><td><a href="javascript:void 0" data-jump="' + esc(r.s.group_id) + '">' + esc(groupCode(r.s.group_id)) + '</a></td><td>' + esc(courseOf(r.s.course_id).code) + '</td><td>' + esc(S.days[r.s.day]) + ' คาบ ' + Grid.periodRange(S.settings, r.s.start, r.s.length) +
        '</td><td class="small">' + r.probs.map(function (p) { return esc(p.msg); }).join('<br>') + '</td></tr>';
    }).join('') + '</tbody></table></div>' : '<p class="tag ok">ไม่พบการชน</p>') +
    '<div class="actions"><button class="btn pri" onclick="closeModal()">ปิด</button></div>', true);
  $$('[data-jump]').forEach(function (a) { a.onclick = function () { closeModal(); S.sel.mode = 'group'; S.sel.group = a.dataset.jump; VIEWS.schedule($('#content')); }; });
}

function renderPlanBox(gid, editable) {
  updateBell(); /* วาดใหม่ทุกครั้งที่ลงหรือย้ายคาบ ตัวเลขบนกระดิ่งจึงตรงเสมอ */
  var C = ctx();
  var plans = S.plans.filter(function (p) { return String(p.group_id) === String(gid); });
  var box = $('#planBox');
  if (!plans.length) { box.innerHTML = '<h3>วิชาในแผนการเรียน</h3><p class="muted">ยังไม่มีแผนการเรียนของกลุ่มนี้ในภาคเรียนนี้ — <a href="#plans">เพิ่มแผนการเรียน</a></p>'; return; }
  var totals = { t: 0, p: 0, u: 0, need: 0, placed: 0, done: 0 };
  var rows = sortBy(plans, function (p) { return courseOf(p.course_id).code; }).map(function (p) {
    var need = Sched.planPeriods(p, C);
    var placed = S.sessions.filter(function (s) { return String(s.plan_id) === String(p.id); }).reduce(function (a, s) { return a + Number(s.length); }, 0);
    var blocks = Sched.remainingBlocks(p, S.sessions, C);
    var c = courseOf(p.course_id);
    totals.t += Number(c.theory) || 0; totals.p += Number(c.practice) || 0; totals.u += Number(c.credits) || 0;
    totals.need += need; totals.placed += placed; if (placed === need) totals.done++;
    var chips = editable ? blocks.map(function (len, i) {
      var on = S.sel.chip && S.sel.chip.plan_id === p.id && S.sel.chip.i === i;
      return '<span class="chip' + (on ? ' sel' : '') + '" draggable="true" data-plan="' + esc(p.id) + '" data-len="' + len + '" data-i="' + i + '">' + len + ' คาบ</span>';
    }).join('') : '';
    var left = need - placed;
    var state = planState(need, placed);
    return '<tr class="plan-row ' + state[0] + '" data-plan-row="' + esc(p.id) + '"><td class="plan-c">' + esc(c.code) + '</td><td><div>' + esc(c.name) + (p.joint_key ? ' <span class="tag warn">เรียนร่วม</span>' : '') + '</div>' +
      '<div class="small muted">' + esc(teacherNames(p.teacher_ids)) + (p.room_id ? ' · ห้อง ' + esc(roomName(p.room_id)) : '') + '</div></td><td class="plan-c">' + esc([c.theory, c.practice, c.credits].join('-')) + '</td><td class="plan-c">' + need +
      '</td><td class="plan-c"><span class="plan-st">' + state[1] + '</span> (' + placed + '/' + need + ')' + (left > 0 && chips ? '<div>' + chips + (editable && left > 1 ? ' <button class="btn sm" data-custom="' + esc(p.id) + '" title="ลงจำนวนคาบอื่น">±</button>' : '') + '</div>' : '') + '</td></tr>';
  }).join('');
  box.innerHTML = '<div class="row"><h3 class="grow" style="margin:0 0 8px">รายวิชาที่ต้องจัด' + (editable ? ' — คลิกแถวเพื่อเริ่มจัดตาราง' : '') + '</h3><a class="small" href="#plans">แก้ไขแผนการเรียน</a></div>' +
    (editable ? '<label class="row small" style="margin:0 0 10px">ประเภทคาบที่จะลงใหม่ <select id="placeHourType" style="width:auto">' + hourTypeOptions(S.sel.placeHourType || '') + '</select></label>' : '') +
    '<div class="tablewrap"><table class="data plan-status"><thead><tr><th>รหัสวิชา</th><th>ชื่อวิชา</th><th>ท-ป-น</th><th>ชั่วโมง</th><th>สถานะ</th></tr></thead><tbody>' + rows +
    '<tr class="plan-total"><td></td><td>ครบแล้ว ' + totals.done + ' จาก ' + plans.length + ' วิชา</td><td class="plan-c">' + totals.t + '-' + totals.p + '-' + totals.u + '</td><td class="plan-c">' + totals.need + '</td><td class="plan-c">ลงแล้ว ' + totals.placed + '/' + totals.need + '</td></tr></tbody></table></div>';
  if ($('#placeHourType', box)) $('#placeHourType', box).onchange = function () { S.sel.placeHourType = this.value; };
  /* คลิกแถวเท่ากับเลือกก้อนคาบแรกที่ยังไม่ได้วาง */
  $$('[data-plan-row]', box).forEach(function (tr) {
    var first = $('.chip', tr);
    if (!first) return;
    tr.classList.add('pick');
    tr.onclick = function (e) { if (!e.target.closest('.chip, button, a')) first.click(); };
  });
  $$('.chip', box).forEach(function (ch) {
    ch.ondragstart = function (e) { startDrag({ plan_id: ch.dataset.plan, length: Number(ch.dataset.len) }, e); };
    ch.ondragend = endDrag;
    ch.onclick = function () {
      var same = S.sel.chip && S.sel.chip.plan_id === ch.dataset.plan && S.sel.chip.i === Number(ch.dataset.i);
      S.sel.chip = same ? null : { plan_id: ch.dataset.plan, length: Number(ch.dataset.len), i: Number(ch.dataset.i) };
      $$('.chip', box).forEach(function (x) { x.classList.toggle('sel', !same && x === ch); });
      if (S.sel.chip) markCells(S.sel.chip); else clearMarks();
    };
  });

    b.onclick = function () {

      if (!n || n < 1) return;

      markCells(S.sel.chip); toast('แตะช่องในตารางเพื่อวาง ' + n + ' คาบ');
    };
  });
}

/* ---------- ลากวาง ---------- */
var DRAG = null;
function startDrag(d, e) {
  DRAG = d;
  if (e && e.dataTransfer) {
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('application/x-tabhub-schedule', JSON.stringify(d));
    e.dataTransfer.setData('text/plain', JSON.stringify(d));
  }
  markCells(d);
}
function endDrag() { DRAG = null; if (!S.sel.chip) clearMarks(); }
function clearMarks() { $$('#gridBox td.cell').forEach(function (td) { td.classList.remove('ok', 'soft', 'hard', 'hover'); td.title = ''; }); }

function candidatesFor(d, day, start) {
  var plan = IDX.Plans[d.plan_id]; if (!plan) return [];
  var plans = plan.joint_key ? S.plans.filter(function (p) { return p.joint_key === plan.joint_key; }) : [plan];
  var orig = d.sid ? S.sessions.filter(function (s) { return String(s.id) === String(d.sid); })[0] : null;
  return plans.map(function (p) {
    return { id: orig && String(orig.plan_id) === String(p.id) ? orig.id : null, plan_id: p.id, group_id: p.group_id, course_id: p.course_id, teacher_ids: p.teacher_ids,
      room_id: orig ? orig.room_id : (p.room_id || (IDX.Groups[p.group_id] || {}).room_id || ''), day: day, start: start, length: d.length };
  });
}

function evalDrop(d, day, start) {
  var C = ctx(), probs = [];
  var orig = d.sid ? S.sessions.filter(function (s) { return String(s.id) === String(d.sid); })[0] : null;
  var moving = orig ? S.sessions.filter(function (s) {
    var p0 = IDX.Plans[orig.plan_id], p1 = IDX.Plans[s.plan_id];
    return s === orig || (p0 && p0.joint_key && p1 && p1.joint_key === p0.joint_key && s.day == orig.day && s.start == orig.start);
  }) : [];
  var others = S.sessions.filter(function (s) { return moving.indexOf(s) < 0; });
  candidatesFor(d, day, start).forEach(function (c) { probs = probs.concat(Sched.check(c, others, C)); });
  return probs;
}

function markCells(d) {
  $$('#gridBox td.cell').forEach(function (td) {
    var probs = evalDrop(d, Number(td.dataset.day), Number(td.dataset.period));
    var hard = probs.filter(function (p) { return p.hard; });
    td.classList.remove('ok', 'soft', 'hard');
    td.classList.add(hard.length ? 'hard' : probs.length ? 'soft' : 'ok');
    td.title = probs.map(function (p) { return p.msg; }).join('\n');
  });
}

function bindGrid() {
  $$('#gridBox .ss.edit').forEach(function (div) {
    div.ondragstart = function (e) {
      var s = S.sessions.filter(function (x) { return String(x.id) === div.dataset.sid; })[0];
      if (!s) { e.preventDefault(); return; }
      startDrag({ plan_id: s.plan_id, length: Number(s.length), sid: s.id }, e);
      e.stopPropagation();
    };
    div.ondragend = endDrag;
  });
  $$('#gridBox .ss').forEach(function (div) {
    div.onclick = function (e) {
      e.stopPropagation();
      if (e.target.closest('[data-move-session]')) return selectSessionMove(div.dataset.sid);
      if (S.sel.chip) return dropAt(S.sel.chip, div.parentNode);
      sessionModal(div.dataset.sid);
    };
  });
  $$('#gridBox td.cell').forEach(function (td) {
    td.ondragover = function (e) { if (DRAG) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; td.classList.add('hover'); } };
    td.ondragleave = function () { td.classList.remove('hover'); };
    td.ondrop = function (e) {
      e.preventDefault(); e.stopPropagation(); td.classList.remove('hover');
      var d = DRAG;
      if (!d && e.dataTransfer) {
        try { d = JSON.parse(e.dataTransfer.getData('application/x-tabhub-schedule')); } catch (err) {}
      }
      DRAG = null;
      if (d && IDX.Plans[d.plan_id] && Number(d.length) > 0) dropAt(d, td);
    };
    td.onclick = function () { if (S.sel.chip) dropAt(S.sel.chip, td); };
  });
}

/** ทางเลือกแทนการลาก: กดปุ่มลูกศรบนคาบ แล้วคลิก/แตะช่องปลายทาง */
function selectSessionMove(sid) {
  var s = S.sessions.filter(function (x) { return String(x.id) === String(sid); })[0];
  if (!s || !$$('#gridBox .ss.edit').some(function (div) { return div.dataset.sid === String(s.id); })) return;
  closeModal();
  S.sel.chip = { plan_id: s.plan_id, length: Number(s.length), sid: s.id, i: -1 };
  markCells(S.sel.chip);
  var old = $('#moveBar'); if (old) old.remove();
  var bar = document.createElement('div'); bar.className = 'move-bar'; bar.id = 'moveBar';
  bar.innerHTML = '<span class="grow">กำลังย้าย ' + esc(courseOf(s.course_id).code) + ' — คลิกหรือแตะช่องปลายทางในตาราง</span><button class="btn sm" id="moveCancel">ยกเลิก</button>';
  var grid = $('#gridBox'); grid.parentNode.insertBefore(bar, grid);
  bar.scrollIntoView({ block: 'nearest' });
  $('#moveCancel').onclick = function () { S.sel.chip = null; bar.remove(); clearMarks(); };
}

function dropAt(d, td, force) {
  var payload = { id: d.sid || '', plan_id: d.plan_id, day: Number(td.dataset.day), start: Number(td.dataset.period), length: d.length, force: !!force };
  if (!d.sid) payload.hour_type = S.sel.placeHourType || '';
  api('placeSession', S.token, payload).then(function (r) {
    if (!r.ok) {
      clearMarks();
      var m = modal('<h3>วางไม่ได้</h3><ul class="problems">' + r.problems.map(function (p) { return '<li class="' + (p.hard ? 'hard' : 'soft') + '">' + esc(p.msg) + '</li>'; }).join('') + '</ul>' +
        '<div class="actions">' + (can('curriculum') && r.problems.every(function (p) { return p.type !== 'over' && p.type !== 'range'; }) ? '<button class="btn bad" id="forceBtn">บังคับวาง (ผู้ดูแล)</button>' : '') +
        '<button class="btn pri" onclick="closeModal()">ตกลง</button></div>');
      if ($('#forceBtn', m)) $('#forceBtn', m).onclick = function () { closeModal(); dropAt(d, td, true); };
      return;
    }
    S.sessions = r.sessions; S.sel.chip = null;
    var warn = r.problems.filter(function (p) { return !p.hard; });
    if (warn.length) toast('วางแล้ว · คำเตือน: ' + warn.map(function (p) { return p.msg; }).join(', '));
    renderSchedMain();
  });
}

/* แบบฟอร์มตารางสอนครู (โค้ดอยู่ใน GridCore ใช้ร่วมกับหน้าเผยแพร่) */
function teacherSheet(id) {
  var t = IDX.Teachers[id] || {};
  return Grid.teacherSheet({
    settings: S.settings, dayNames: S.days, locked: S.D.LockedSlots, teacher: t, teacherId: id, sessions: S.sessions, groups: S.D.Groups,
    hourType: sessionHourType, plc: S.D.PlcSlots,
    course: courseOf, group: groupCode, room: roomName, color: sessionColor, deptName: deptName(t.department_id), semLabel: semLabel(S.sem), sign: signBlock(t.department_id)
  });

function reportPage(type, id) {
  if (type === 'teacher') return teacherSheet(id);
  var group = IDX.Groups[id] || {}, room = IDX.Rooms[id] || {};
  var options = {
    settings: S.settings, dayNames: S.days, locked: S.D.LockedSlots, sessions: S.sessions, groups: S.D.Groups,
    studentGroup: type === 'group' ? Object.assign({}, group, { id: id }) : null,
    roomInfo: type === 'room' ? Object.assign({}, room, { id: id }) : null,
    teacher: IDX.Teachers[group.advisor_id] || {}, course: courseOf, group: groupCode, room: roomName, color: sessionColor,
    teacherNames: function (ids) { return Grid.shortTeacherNames(ids, function (tid) { return IDX.Teachers[tid]; }); },
    buildingName: nm('Buildings', room.building_id), semLabel: semLabel(S.sem),
    sign: type === 'room' ? Grid.signBlock(S.settings, '', true) : signBlock(group.department_id)
  };
  return type === 'group' ? Grid.studentSheet(options) : Grid.roomSheet(options);
}

/* หน้าเลือกครู: การ์ดรายชื่อแยกตามแผนก กดแล้วเปิดสรุปรายบุคคลในแท็บใหม่ */
VIEWS.hours = function (el) {
  if (S.sel.hoursTeacher) return hoursDetail(el, S.sel.hoursTeacher);
  el.innerHTML = '<div class="hours-sem">ภาคเรียน <span>' + esc(semLabel(S.sem)) + '</span></div><p class="small muted hours-hint">เลือกชื่อครูเพื่อเปิดสรุปชั่วโมงสอนรายบุคคลในแท็บใหม่</p>' +

      return '<a class="hours-card" target="_blank" rel="noopener" href="?hours_teacher=' +encodeURIComponent(t.id) + '&amp;sem=' + encodeURIComponent(S.sem) + '"' + (title ? ' title="' + title + '"' : '') + '>' + inner + '<b>' + esc(teacherBareName(t.name)) + '</b></a>';
    });

function teacherBareName(n) { return String(n || '').replace(/^(นางสาว|นาย|นาง|ว่าที่\s*\S+\s+)/, '').trim(); }

/* การ์ดครูแยกตามแผนก ใช้ร่วมกันหลายหน้า: สีแดงคือหัวหน้าแผนกวิชาและวิชาการแผนกวิชา
   card(t, iconHtml, roleText) คืน HTML ของการ์ด 1 ใบ */
function teacherCards(teachers, card) {
  var depts = sortBy(S.D.Departments, function (d) { return d.sort || d.name; }).concat([{ id: '', name: 'ไม่ระบุแผนก' }]);
  var icon = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1-4 4-6 7.5-6s6.500 2 7.500 6"/></svg>';
  return depts.map(function (d) {
    var list = teachers.filter(function (t) { return String(t.department_id || '') === String(d.id); }).map(function (t) { return { t: t, name: teacherBareName(t.name) }; })
      .sort(function (a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; });
    if (!list.length) return '';
    return '<h3 class="hours-dept">' + esc(d.name) + '</h3><div class="hours-grid">' + list.map(function (x) {
      var isHead = String(x.t.is_dept_head) === 'true', isAcademic = String(x.t.is_dept_academic) === 'true';
      var role = [isHead ? 'หัวหน้าแผนกวิชา' : '', isAcademic ? 'วิชาการแผนกวิชา' : ''].filter(Boolean).join(' และ');
      return card(x.t, '<span class="hours-ic' + (role ? ' head' : '') + '">' + icon + '</span>', role);
    }).join('') + '</div>';
  }).join('') || '<div class="card muted">ไม่มีข้อมูลครู</div>';
}

/* สรุปรายบุคคล: คาบเรียนรวมเวลาเดียวกันนับเป็นชั่วโมงสอนเดียว เหมือนแบบฟอร์มตารางสอนครู */
function hoursDetail(el, id) {
  var t = IDX.Teachers[id];
  if (!t) { el.innerHTML = '<div class="card muted">ไม่พบข้อมูลครู</div>'; return; }
  $('#title').textContent = 'สรุปชั่วโมงสอน ' + t.name;
  var sessions = S.sessions.filter(function (s) { return Sched.ids(s.teacher_ids).indexOf(String(id)) >= 0; });
  var blocks = Grid.mergeItems(sessions), byCourse = {}, byDay = {}, groups = {}, total = 0;
  blocks.forEach(function (list) {
    var s = list[0], len = Number(s.length) || 0, r = byCourse[s.course_id] || (byCourse[s.course_id] = { n: 0, groups: {} });
    total += len; r.n += len; byDay[s.day] = (byDay[s.day] || 0) + len;
    list.forEach(function (x) { r.groups[groupCode(x.group_id)] = 1; groups[x.group_id] = 1; });
  });
  var days = String(S.settings.days || '0,1,2,3,4').split(',').map(Number);
  var courses = sortBy(Object.keys(byCourse), function (k) { return courseOf(k).code; });
  el.innerHTML = '<div class="card"><div class="row"><div class="grow"><h3 style="margin:0">' + esc(t.name) + '</h3><div class="small muted">' + esc(t.position || '') + (t.position ? ' · ' : '') + 'แผนกวิชา' + esc(deptName(t.department_id)) + ' · ภาคเรียน ' + esc(semLabel(S.sem)) + '</div></div>' +
    '<button class="btn pri no-print" onclick="window.print()">🖨 พิมพ์</button></div></div>' +
    '<div class="grid4">' + stat('⏱', total, 'คาบ/สัปดาห์') + stat('📘', courses.length, 'รายวิชา') + stat('👩‍🎓', Object.keys(groups).length, 'กลุ่มเรียน') + stat('🗓', Object.keys(byDay).length, 'วันที่มีสอน') + '</div>' +
    '<div class="card"><h3>ชั่วโมงสอนรายวัน</h3><div class="tablewrap"><table class="data"><thead><tr>' + days.map(function (d) { return '<th>' + esc(S.days[d]) + '</th>'; }).join('') + '<th>รวม</th></tr></thead><tbody><tr>' +
    days.map(function (d) { return '<td>' + (byDay[d] || '-') + '</td>'; }).join('') + '<td><b>' + total + '</b></td></tr></tbody></table></div></div>' +
    '<div class="card"><h3>รายวิชาที่สอน</h3><div class="tablewrap"><table class="data"><thead><tr><th>รหัสวิชา</th><th>ชื่อวิชา</th><th>ท-ป-น</th><th>กลุ่มเรียน</th><th style="text-align:right">คาบ/สัปดาห์</th></tr></thead><tbody>' +
    (courses.map(function (k) {
      var c = courseOf(k);
      return '<tr><td>' + esc(c.code) + '</td><td>' + esc(c.name) + '</td><td>' + esc([c.theory, c.practice, c.credits].join('-')) + '</td><td class="small">' + esc(Object.keys(byCourse[k].groups).join(', ')) + '</td><td style="text-align:right">' + byCourse[k].n + '</td></tr>';
    }).join('') || '<tr><td colspan="5" class="muted">ไม่มีคาบสอนในภาคเรียนนี้</td></tr>') + '</tbody></table></div></div>';
}

/* ===================== สำรองข้อมูล ===================== */
/* สถานะสำรองอัตโนมัติครั้งล่าสุด ให้ผู้ดูแลเห็นทันทีเมื่อสำรองไม่สำเร็จ */
function backupStatusHtml(d) {
  var s = d.auto_status || {}, last = (d.files || []).filter(function (f) { return f.kind === 'auto'; })[0];
  var lines = ['ไฟล์สำรองอัตโนมัติล่าสุด: ' + (last ? esc(last.time) : 'ยังไม่มี')];
  if (s.state === 'ok') lines.push('ครั้งล่าสุดสำเร็จเมื่อ ' + esc(s.at));
  else if (s.state === 'error') lines.push('<b>ครั้งล่าสุดไม่สำเร็จ</b> เมื่อ ' + esc(s.at) + ': ' + esc(s.error || ''));
  else if (s.state === 'running') lines.push('<b>เริ่มสำรองเมื่อ ' + esc(s.at) + ' แต่ไม่จบ</b> — โฮสติ้งอาจหยุดสคริปต์ก่อนเสร็จ หรือหน่วยความจำ/เวลาไม่พอ ดูรายละเอียดใน PHP error log');
  else lines.push('ยังไม่มีบันทึกผลการสำรองอัตโนมัติ');
  var bad = (d.dirs || []).filter(function (x) { return !x.writable; });
  var dirs = bad.length ? '<div class="alert alert-danger" style="margin-top:10px"><b>PHP เขียนโฟลเดอร์เหล่านี้ไม่ได้</b> ระบบจึงสำรองข้อมูลหรือเก็บรูปไม่ได้<ul style="margin:6px 0">' +
    bad.map(function (x) { return '<li><code>' + esc(x.dir) + '</code> — ' + esc(x.use) + (x.exists ? ' · Permission ' + esc(x.perms) + ' · Owner ' + esc(x.owner) + ' · Group ' + esc(x.group) : ' (ยังไม่มีโฟลเดอร์)') + '</li>'; }).join('') +
    '</ul>PHP ทำงานด้วยบัญชี <b>' + esc(bad[0].php_user || '-') + '</b> — แก้ใน File Manager หรือ FTP ของโฮสติ้ง: ถ้า Owner ตรงกับบัญชีของ PHP ตั้ง Permission เป็น 755 ถ้า Owner ไม่ตรงแต่ Group ตรง ให้ตั้ง 775 ถ้าไม่ตรงทั้งคู่ ให้เปลี่ยน Owner เป็นบัญชีของ PHP หรือแจ้งผู้ดูแลโฮสติ้ง ตั้งให้ทุกโฟลเดอร์ในรายการ แล้วเปิดหน้านี้ใหม่</div>' : '';
  return dirs + '<div class="' + (d.warning ? 'alert alert-warning' : 'small muted') + '" style="margin-top:10px">' + (d.warning ? '<b>⚠ ' + esc(d.warning) + '</b><br>' : '') + lines.join('<br>') + '</div>';
}

VIEWS.backup = function (el) {
  el.innerHTML = '<div class="card muted">กำลังโหลด…</div>';
  function size(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
  function refresh() { VIEWS.backup(el); }
  function restore(f) {
    var m = modal('<h3>กู้คืนข้อมูล</h3><p>ข้อมูลในระบบตอนนี้จะถูกแทนที่ด้วยไฟล์ <b>' + esc(f.time) + '</b> (' + esc(f.kind_label) + ') รวมถึงตารางสอน บัญชีผู้ใช้ และรูปประกอบรายงาน</p>' +
      (f.images === null ? '<p class="small"><b>ไฟล์นี้สร้างก่อนระบบสำรองรูปได้</b> จึงกู้คืนเฉพาะข้อมูล รูปที่มีอยู่ในเครื่องจะคงไว้ตามเดิม</p>' : '') +
      '<p class="small muted">ระบบจะสำรองข้อมูลปัจจุบันให้ก่อนกู้คืน หากกู้ผิดไฟล์สามารถย้อนกลับได้</p><label class="f">พิมพ์คำว่า กู้คืน เพื่อยืนยัน</label><input id="bkC" autocomplete="off">' +
      '<div class="actions"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn bad" id="bkGo" disabled>กู้คืนข้อมูล</button></div>');
    $('#bkC', m).oninput = function () { $('#bkGo', m).disabled = this.value.trim() !== 'กู้คืน'; };
    $('#bkGo', m).onclick = function () {
      this.disabled = true; this.textContent = 'กำลังกู้คืน…';
      api('backupRestore', S.token, f.name, $('#bkC', m).value.trim()).then(function (r) {
        closeModal(); toast('กู้คืนแล้ว ' + r.rows + ' แถว กำลังโหลดระบบใหม่');
        setTimeout(function () { location.reload(); }, 1200);
      }).catch(function () { closeModal(); refresh(); });
    };
  }
  api('backupList', S.token).then(function (d) {
    el.innerHTML = '<div class="card"><h3>สำรองข้อมูล</h3><p class="small muted">เก็บทุกตารางในระบบ รวมถึงบัญชีผู้ใช้และรหัสผ่านที่เข้ารหัสแล้ว และรูปประกอบรายงานการสอน (ตอนนี้มี ' + d.image_count + ' รูป รวม ' + size(d.image_bytes) + ') ไฟล์ที่ดาวน์โหลดมีข้อมูลส่วนบุคคลและรูปนักเรียน ควรเก็บในที่ปลอดภัย และควรคัดลอกออกจากเครื่องนี้เป็นระยะ</p>' +
      '<div class="row"><button class="btn pri" id="bkNew">💾 สำรองข้อมูลตอนนี้</button><label class="btn" for="bkFile">⤴ อัปโหลดไฟล์สำรอง</label><input type="file" id="bkFile" accept=".gz" hidden></div>' +
      '<div class="row bk-auto"><label class="row small" style="gap:6px"><input type="checkbox" id="bkAuto" style="width:auto"' + (d.auto ? ' checked' : '') + '> สำรองอัตโนมัติวันละครั้ง</label>' +
      '<label class="row small" style="gap:6px">เก็บไว้ <input type="number" id="bkKeep" min="1" max="365" value="' + d.keep + '" style="width:80px"> ไฟล์ล่าสุด</label><button class="btn sm" id="bkSave">บันทึก</button></div>' +
      '<p class="small muted" style="margin:6px 0 0">ระบบสำรองอัตโนมัติเมื่อมีคนเปิดหน้าเว็บในวันนั้น ถ้าไม่มีคนใช้งานจะยังไม่สำรอง ทุกไฟล์เก็บรูปทั้งหมดซ้ำกัน ถ้ารูปมากขึ้นและพื้นที่เครื่องน้อย ให้ลดจำนวนไฟล์ที่เก็บ</p>' + backupStatusHtml(d) + '</div>' +
      '<div class="card"><h3>ไฟล์สำรอง (' + d.files.length + ')</h3><div class="tablewrap"><table class="data"><thead><tr><th>วันเวลา</th><th>ประเภท</th><th style="text-align:right">รูป</th><th style="text-align:right">ขนาด</th><th></th></tr></thead><tbody>' +
      (d.files.map(function (f, i) {
        return '<tr><td style="white-space:nowrap">' + esc(f.time) + '</td><td>' + esc(f.kind_label) + '</td><td style="text-align:right;white-space:nowrap">' + (f.images === null ? '<span class="muted">ไม่รวมรูป</span>' : f.images) + '</td><td style="text-align:right;white-space:nowrap">' + size(f.size) + '</td><td style="white-space:nowrap;text-align:right">' +
          '<button class="btn sm" data-bk-dl="' + i + '">ดาวน์โหลด</button> <button class="btn sm" data-bk-rs="' + i + '">กู้คืน</button> <button class="btn sm bad" data-bk-del="' + i + '">ลบ</button></td></tr>';
      }).join('') || '<tr><td colspan="5" class="muted">ยังไม่มีไฟล์สำรอง</td></tr>') + '</tbody></table></div></div>';
    $('#bkNew', el).onclick = function () {
      this.disabled = true; this.textContent = 'กำลังสำรอง…';
      api('backupCreate', S.token).then(function () { toast('สำรองข้อมูลแล้ว'); refresh(); }).catch(refresh);
    };
    $('#bkSave', el).onclick = function () {
      api('saveSettings', S.token, { backup_auto: $('#bkAuto', el).checked ? 'true' : 'false', backup_keep: String(Math.max(1, Number($('#bkKeep', el).value) || 14)) }).then(function (ns) { S.settings = ns; toast('บันทึกแล้ว'); refresh(); });
    };
    $('#bkFile', el).onchange = function () {
      var file = this.files[0]; if (!file) return;
      /* ส่งทีละส่วนเล็ก ๆ เพราะโฮสติ้งหลายแห่งจำกัดขนาดคำขอไว้ต่ำ */
      var CHUNK = 2 * 1024 * 1024, label = $('label[for=bkFile]', el);
      function send(off, id) {
        var r = new FileReader(), last = off + CHUNK >= file.size;
        r.onload = function () {
          api('backupUploadChunk', S.token, id, off, String(r.result).split(',')[1] || '', last).then(function (x) {
            if (last) { toast('อัปโหลดแล้ว กดกู้คืนที่ไฟล์นั้นเมื่อต้องการใช้'); refresh(); return; }
            label.textContent = 'กำลังอัปโหลด ' + Math.round((off + CHUNK) / file.size * 100) + '%';
            send(off + CHUNK, x.id);
          }).catch(refresh);
        };
        r.onerror = function () { toast('อ่านไฟล์ไม่สำเร็จ', 1); refresh(); };
        r.readAsDataURL(file.slice(off, off + CHUNK));
      }
      label.textContent = 'กำลังอัปโหลด…';
      send(0, '');
    };
    $$('[data-bk-dl]', el).forEach(function (b) {
      b.onclick = function () { api('backupDownload', S.token, d.files[b.dataset.bkDl].name).then(function (u) { var a = document.createElement('a'); a.href = u; a.download = ''; document.body.appendChild(a); a.click(); a.remove(); }); };
    });
    $$('[data-bk-rs]', el).forEach(function (b) { b.onclick = function () { restore(d.files[b.dataset.bkRs]); }; });
    $$('[data-bk-del]', el).forEach(function (b) {
      b.onclick = function () { if (confirm('ลบไฟล์สำรอง ' + d.files[b.dataset.bkDel].time + '? ลบแล้วเอากลับคืนไม่ได้')) api('backupDelete', S.token, d.files[b.dataset.bkDel].name).then(refresh); };
    });
  });
};

function enumOpts(t) { return t.slice(5).split(',').map(function (x) { var p = x.split('='); return [p[0], p[1] === undefined ? p[0] : p[1]]; }); }
function enumLabel(t, v) { var o = enumOpts(t).filter(function (x) { return String(x[0]) === String(v); })[0]; return o ? o[1] : v; }
function refLabel(table, id) {
  if (table === 'Semesters') return semLabel(id);
  if (table === 'Rooms') return roomName(id);
  if (table === 'OtRounds') { var rr = IDX.OtRounds && IDX.OtRounds[id]; return rr ? rr.name + ' (' + semLabel(rr.semester_id) + ')' : ''; }
  return nm(table, id);
}

/* ===================== นำเข้า / ส่งออกข้อมูลพื้นฐาน ===================== */
/** อ่านข้อความตาราง รองรับเครื่องหมายคำพูด จุลภาค และการขึ้นบรรทัดในเซลล์ */
function parseTableText(text) {
  text = String(text || '').replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
  var first = text.split('\n')[0] || '';
  var sep = first.indexOf('\t') >= 0 ? '\t' : ',';
  var rows = [], row = [], cell = '', quoted = false;
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (quoted) {
      if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (ch === '"') quoted = false;
      else cell += ch;
    }
    else if (ch === '"' && cell === '') quoted = true;
    else if (ch === sep) { row.push(cell); cell = ''; }
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  row.push(cell); rows.push(row);
  return rows.filter(function (r) { return r.some(function (c) { return String(c).trim() !== ''; }); });
}

/** จับคู่หัวคอลัมน์ ชื่อที่ตรงเป๊ะมาก่อน เพื่อไม่ให้ชื่อที่ขึ้นต้นเหมือนกันสลับคอลัมน์ */
function fieldForHeader(def, h) {
  var stem = function (f) { return f[1].split(' (')[0]; };
  return def.fields.filter(function (f) { return f[0] === h || f[1] === h; })[0] ||
    def.fields.filter(function (f) { return stem(f) === h; })[0] ||
    def.fields.filter(function (f) { return h.indexOf(stem(f)) === 0; })[0] || null;
}

function importCell(f, raw, miss) {
  var t = f[2], v = String(raw === undefined ? '' : raw).trim().replace(/^'(?=[=+\-@])/, '');
  var refId = function (tb, x) {
    var hit = (S.D[tb] || []).filter(function (r) { return String(r.id) === x || refLabel(tb, r.id) === x; })[0];
    if (!hit) miss.push(x);
    return hit ? hit.id : '';
  };
  if (t === 'bool') return /^(true|1|ใช่|y|yes|✓)$/i.test(v);
  if (!v) return v;
  if (t.indexOf('ref:') === 0) return refId(t.slice(4), v);
  if (t.indexOf('multi:') === 0) return v.split(',').map(function (x) { return refId(t.slice(6), x.trim()); }).filter(String).join(',');
  if (t.indexOf('enum:') === 0) {
    var o = enumOpts(t).filter(function (x) { return x[0] === v || x[1] === v; })[0];
    if (!o) miss.push(v);
    return o ? o[0] : '';
  }
  if (t === 'period') { var p = Grid.periodFromNo(S.settings, v); if (p === '') miss.push('คาบ ' + v); return p; }
  return v;
}

/** แถวซ้ำดูจากรหัสหรือชื่อ ร่วมกับช่องอ้างอิง เช่น ห้องชื่อเดียวกันคนละอาคารไม่ถือว่าซ้ำ */
function importKey(def, r) {
  var main = String(r.code || r.name || '').trim();
  if (!main) return '';
  return main + '|' + def.fields.filter(function (f) { return f[2].indexOf('ref:') === 0; }).map(function (f) { return String(r[f[0]] || ''); }).join('|');
}

function readImportRows(name, text) {
  var def = TABLES[name], table = parseTableText(text);
  if (table.length < 2) return { error: 'ต้องมีหัวคอลัมน์และข้อมูลอย่างน้อย 1 แถว' };
  var map = table[0].map(function (h) { return fieldForHeader(def, String(h).trim()); }), miss = [];
  if (!map.some(Boolean)) return { error: 'ไม่พบหัวคอลัมน์ที่รู้จัก กรุณาใช้ไฟล์ตัวอย่าง' };
  var seen = {}, dup = 0, rows = [];
  (S.D[name] || []).forEach(function (r) { var k = importKey(def, r); if (k) seen[k] = 1; });
  table.slice(1).forEach(function (cells) {
    var o = {};
    map.forEach(function (f, i) { if (f) o[f[0]] = importCell(f, cells[i], miss); });
    var k = importKey(def, o);
    if (k && seen[k]) { dup++; return; }
    if (k) seen[k] = 1;
    rows.push(o);
  });
  return { rows: rows, dup: dup, miss: miss, columns: map.filter(Boolean).map(function (f) { return f[1]; }) };
}

/** วางจาก Excel และนำเข้า CSV ใช้หน้าต่างและตัวตรวจชุดเดียวกัน */

  }

/** ไฟล์ Excel ภาษาไทยอาจเป็น UTF-8 หรือ Windows-874 ลอง UTF-8 ก่อน */
function decodeCsv(buffer) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buffer); }
  catch (e) { return new TextDecoder('windows-874').decode(buffer); }
}

function csvText(rows) {
  var cell = function (v) {
    v = String(v === undefined || v === null ? '' : v);
    // กันสูตรใน Excel จากข้อความที่ขึ้นต้นด้วยเครื่องหมายคำนวณ
    if (/^[=+@\t\r]/.test(v) || /^-[^\d.]/.test(v)) v = "'" + v;
    return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  };
  return rows.map(function (r) { return r.map(cell).join(','); }).join('\r\n') + '\r\n';
}

function saveCsv(fileName, rows) {
  // BOM ทำให้ Excel อ่านภาษาไทยถูกต้อง
  var url = URL.createObjectURL(new Blob(['\uFEFF' + csvText(rows)], { type: 'text/csv;charset=utf-8' }));
  var a = document.createElement('a'); a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}

function exportCell(f, v) {
  var t = f[2];
  if (t === 'bool') return String(v) === 'true' ? 'ใช่' : '';
  if (v === undefined || v === '') return '';
  if (t.indexOf('ref:') === 0) return refLabel(t.slice(4), v);
  if (t.indexOf('multi:') === 0) return Sched.ids(v).map(function (x) { return refLabel(t.slice(6), x); }).join(',');
  if (t.indexOf('enum:') === 0) return enumLabel(t, v);
  if (t === 'period') return Grid.periodNo(S.settings, v);
  return v;
}

function exportTable(name, rows) {
  var def = TABLES[name];
  var d = new Date(), pad2 = function (x) { return (x < 10 ? '0' : '') + x; };
  saveCsv(def.title + ' ' + d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + '.csv', [def.fields.map(function (f) { return f[1]; })].concat(rows.map(function (r) {
    return def.fields.map(function (f) { return exportCell(f, r[f[0]]); });
  })));
}

/** แถวตัวอย่าง: ไม่ใช้ชื่อครูจริง ส่วนช่องอ้างอิงอื่นใช้ค่าที่มีในระบบ เพื่อให้นำเข้าได้ทันที */
function sampleCsv(name) {
  var def = TABLES[name];
  var value = function (f) {
    var k = f[0], t = f[2];
    if (t === 'bool') return 'ใช่';
    if (t === 'number') return '1';
    if (t === 'date') return '2026-01-31';
    if (t === 'period') return '1';
    if (t === 'slots' || t.indexOf('multi:') === 0) return '';
    if (t.indexOf('enum:') === 0) { var o = enumOpts(t).filter(function (x) { return x[0] !== ''; })[0]; return o ? o[1] : ''; }
    if (t.indexOf('ref:') === 0) {
      var tb = t.slice(4), first = (S.D[tb] || [])[0];
      return tb === 'Teachers' ? 'ชื่อครูตามเมนูครูผู้สอน' : first ? refLabel(tb, first.id) : '';
    }
    return k === 'code' ? 'ตัวอย่าง-001' : 'ตัวอย่าง ' + f[1].split(' (')[0];
  };
  saveCsv('ตัวอย่าง ' + def.title + '.csv', [def.fields.map(function (f) { return f[1]; }), def.fields.map(value)]);
}

      sortBy(users, function (u) { return u.role + u.name; }).map(function (u) {
        return '<tr><td>' + esc(u.username) + '</td><td>' + esc(u.name) + '</td><td>' + esc(roleTh[u.role] || u.role) + '</td><td>' + userPermTag(u) + '</td><td>' + esc(deptName(u.department_id)) + '</td><td>' + esc(nm('Teachers', u.teacher_id)) +
          '</td><td>' + (String(u.active) === 'false' ? '<span class="tag bad">ปิด</span>' : !u.has_password ? '<span class="tag warn">ยังไม่ตั้งรหัสผ่าน</span>' : '<span class="tag ok">ใช้งาน</span>') + '</td><td style="white-space:nowrap"><button class="btn sm" data-u="' + esc(u.id) + '">แก้ไข</button> <button class="btn sm bad" data-du="' + esc(u.id) + '">ลบ</button></td></tr>';
      }).join('') + '</tbody></table></div></div>';
    $('#uAdd').onclick = function () { userModal({ role: 'dept', active: true }); };
    $('#uBulk').onclick = function () {
      var pw = prompt('สร้างบัญชีให้ครูทุกคนที่ยังไม่มีบัญชี (ชื่อผู้ใช้ = ส่วนหน้าอีเมล หรือรหัสครู)\nตั้งรหัสผ่านเริ่มต้น (อย่างน้อย 6 ตัว) — ให้ครูเปลี่ยนเองหลังเข้าระบบ:');
      if (!pw) return;
      api('bulkCreateTeacherUsers', S.token, pw).then(function (n) { toast('สร้าง ' + n + ' บัญชี'); VIEWS.users(el); });
    };
    $$('[data-u]', el).forEach(function (b) { b.onclick = function () { userModal(users.filter(function (u) { return u.id === b.dataset.u; })[0]); }; });
    $$('[data-du]', el).forEach(function (b) { b.onclick = function () { if (confirm('ลบบัญชีนี้?')) api('deleteUser', S.token, b.dataset.du).then(function () { VIEWS.users(el); }); }; });
  });
};

function userPermTag(u) {
  if (u.role === 'admin') return '<span class="small muted">ทุกเมนู</span>';
  var p = u.menu_perms || { grant: [], deny: [] };
  if (!p.grant.length && !p.deny.length) return '<span class="small muted">ตามบทบาท</span>';
  return (p.grant.length ? '<span class="tag ok">เพิ่ม ' + p.grant.length + '</span> ' : '') + (p.deny.length ? '<span class="tag warn">ถอน ' + p.deny.length + '</span>' : '');
}

/* เมนูระบบยังเป็นของผู้ดูแลระบบเท่านั้น จึงไม่แสดงให้เลือก */
function permMenuHtml() {
  var html = '', open = false;
  NAV.forEach(function (n) {
    if (n.sec) { html +=(open ? '</div>' : '') + '<div class="perm-sec">' + esc(n.sec) + '</div><div class="perm-grid">'; open = true; return; }
    if (n.role === 'admin') return;
    html += '<label class="perm-item"><input type="checkbox" data-menu="' + esc(n.id) + '" data-level="' + esc(n.role) + '"><span>' + esc(n.label) + '</span><small></small></label>';
  });
  return html + (open ? '</div>' : '');
}

function userModal(u) {
  var perms = u.menu_perms || { grant: [], deny: [] };
  var tOpts = '<option value="">—</option>' + sortBy(S.D.Teachers, function (t) { return t.name; }).map(function (t) { return '<option value="' + esc(t.id) + '"' + (String(t.id) === String(u.teacher_id) ? ' selected' : '') + '>' + esc(t.name) + '</option>'; }).join('');
  var m = modal('<h3>' + (u.id ? 'แก้ไขผู้ใช้' : 'เพิ่มผู้ใช้') + '</h3>' +
    '<label class="f">ชื่อผู้ใช้ (ใช้เข้าระบบ)</label><input id="uU" value="' + esc(u.username) + '">' +
    '<label class="f">ชื่อ-สกุล</label><input id="uN" value="' + esc(u.name) + '">' +
    '<label class="f">บทบาท</label><select id="uR">' + ['curriculum', 'dept', 'teacher', 'admin'].map(function (role) { return '<option value="' + role + '">' + esc(ROLE_LABELS[role]) + '</option>'; }).join('') + '</select><p id="uScope" class="small muted"></p>' +
    '<label class="f">แผนกวิชา</label><select id="uD">' + deptOptions(u.department_id, '—') + '</select>' +
    '<label class="f">ผูกกับรายชื่อครู</label><select id="uT">' + tOpts + '</select>' +
    '<label class="f">' + (u.id ? 'ตั้งรหัสผ่านใหม่ (เว้นว่าง = ไม่เปลี่ยน)' : 'รหัสผ่าน (อย่างน้อย 6 ตัว)') + '</label><input id="uP" type="password" autocomplete="new-password">' +
    '<label class="row small" style="margin-top:10px"><input type="checkbox" id="uA" style="width:auto"' + (String(u.active) !== 'false' ? ' checked' : '') + '> เปิดใช้งาน</label>' +
    '<div class="perm-box"><div class="row"><b class="grow">สิทธิ์เมนูรายบุคคล</b><button type="button" class="btn sm" id="uPermReset">คืนค่าตามบทบาท</button></div>' +
    '<p class="small muted" id="uPermHint"></p><div id="uPerms">' + permMenuHtml() + '</div></div>' +
    '<div class="actions"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn pri" id="uS">บันทึก</button></div>', true);
  $('#uR', m).value = u.role || 'dept';
  function isDefault(box, role) { return rank(role) >= rank(box.dataset.level); }
  function markPerm(box) {
    var def = isDefault(box, $('#uR', m).value), label = box.parentNode.querySelector('small');
    label.textContent = $('#uR', m).value === 'admin' || box.checked === def ? '' : box.checked ? 'เพิ่มให้' : 'ถอนออก';
    box.parentNode.classList.toggle('changed', label.textContent !== '');
  }
  function fillPerms(useSaved) {
    var role = $('#uR', m).value, isAdmin = role === 'admin';
    $$('[data-menu]', m).forEach(function (box) {
      var id = box.dataset.menu;
      box.checked = isAdmin || (useSaved && perms.grant.indexOf(id) >= 0) || (isDefault(box, role) && !(useSaved && perms.deny.indexOf(id) >= 0));
      box.disabled = isAdmin;
      markPerm(box);
    });
    $('#uPermReset', m).disabled = isAdmin;
    $('#uPermHint', m).textContent = isAdmin ? 'ผู้ดูแลระบบเข้าได้ทุกเมนูเสมอ' : 'ติ๊กเพื่อให้สิทธิ์ เอาออกเพื่อถอนสิทธิ์ เมนูระดับแผนกจะทำงานได้เฉพาะแผนกของผู้ใช้ ส่วนเมนูผู้ใช้งาน สีตาราง ตั้งค่าวิทยาลัย และสำรองข้อมูลเป็นของผู้ดูแลระบบเท่านั้น';
  }
  $$('[data-menu]', m).forEach(function (box) { box.onchange = function () { markPerm(box); }; });
  $('#uPermReset', m).onclick = function () { fillPerms(false); };
  function showUserScope() {
    var role = $('#uR', m).value;
    $('#uScope', m).textContent = ROLE_SCOPES[role];
    $('#uD', m).required = role === 'dept'; $('#uT', m).required = role === 'teacher';
  }
  $('#uR', m).onchange = function () { showUserScope(); fillPerms(true); }; showUserScope(); fillPerms(true);
  $('#uT', m).onchange = function () {
    var t = IDX.Teachers[this.value]; if (!t) return;
    if (!$('#uN').value) $('#uN').value = t.name;
    if (!$('#uD').value) $('#uD').value = t.department_id;
  };
  $('#uS', m).onclick = function () {
    api('saveUser', S.token, { id: u.id, username: $('#uU').value, name: $('#uN').value, role: $('#uR').value, department_id: $('#uD').value, teacher_id: $('#uT').value, password: $('#uP').value, active: $('#uA').checked, menus: $$('[data-menu]', m).filter(function (b) { return b.checked; }).map(function (b) { return b.dataset.menu; }) })
      .then(function () { closeModal(); toast('บันทึกสิทธิ์แล้ว'); if (String(u.id) === String(S.me.id)) start(); else VIEWS.users($('#content')); });
  };
}

    f('signer_finance', 'หัวหน้างานการเงิน (ผู้รับรองใบเบิก)') + f('signer_admin_deputy', 'รองผู้อำนวยการฝ่ายบริหารทรัพยากร (ผู้รับรองใบเบิก)') + f('signer_dvt', 'หัวหน้างานอาชีวศึกษาระบบทวิภาคี (รายงานการนิเทศ)') + f('signer_director', 'ผู้อำนวยการวิทยาลัย') +

  $('#setSave').onclick = $('#setSaveInfo').onclick = function () {
    var o = {};
    $$('[data-s]', el).forEach(function (i) { o[i.dataset.s] = i.value; });
    o.days = $$('[data-day]', el).filter(function (c) { return c.checked; }).map(function (c) { return c.dataset.day; }).join(',');

      var x = c.dataset.lock.split('-'); return { day: x[0], period: x[1], label: $('[data-lockl="' + x[1] + '"]', el).value };
    });
    api('bulkImport', S.token, 'LockedSlots', rows, 'replace').then(reloadData).then(function () { buildIndex(); toast('บันทึกแล้ว'); VIEWS.settings(el); });
  };
};

    '<li>ใส่ในไฟล์ <code>.env</code> ของเซิร์ฟเวอร์: <code>TAB_API_KEY=key ที่คัดลอก</code> แล้วรีสตาร์ตระบบ</li>' +

    '<p class="small">หรือนำเข้าทั้งฐานข้อมูลจากไฟล์ .xlsx ด้วยคำสั่ง <code>php scripts/import.php ไฟล์.xlsx</code> ที่เซิร์ฟเวอร์ (แต่ละแผ่นงานคือหนึ่งตาราง)</p></div>';
  $('#tabList').onclick = function () {
    api('listTabSemesters', S.token).then(function (list) {
      $('#tabSem').innerHTML = list.map(function (s) { return '<option value="' + esc(s.id) + '">' + esc(s.label) + '</option>'; }).join('');
      $('#tabGo').disabled = !list.length;

  };
  $('#tabGo').onclick = function () {
    $('#tabRes').textContent = 'กำลังนำเข้า… (ห้ามปิดหน้านี้)';
    api('importFromTAB', S.token, $('#tabSem').value).then(function (r) {

      return reloadData().then(function () { renderShell(); go('import'); $('#tabRes').innerHTML = msg; toast('นำเข้าข้อมูลเสร็จ'); });
    }).catch(function () { $('#tabRes').textContent = ''; });

};

  google.script.run.withSuccessHandler(function (u) {
    S.url = u;
    google.script.run.withSuccessHandler(function (pub) {
      S.settings.college_name = pub.college_name;
      var t = store('tt_token');
      if (t) { S.token = t; start(); } else renderLogin();

  }).getWebAppUrl();
}
