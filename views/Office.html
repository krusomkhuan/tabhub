      var body = doc.getElementsByTagNameNS(W, 'body')[0] || doc.documentElement;
      var html = blocks(body);
      return Promise.all(imgs.map(function (im) {
        return inflate(entries[im.path]).then(function (b) { return b ? shrinkData(b, im.ext) : ''; }).catch(function () { return ''; });
      })).then(function (srcs) {
        html = html.replace(/\u0000IMG(\d+)\u0000/g, function (_, i) { var s = srcs[+i]; return s ? '<img src="' + s + '" alt=""' + (imgs[+i].w ? ' style="width:' + Math.min(680, imgs[+i].w) + 'px;max-width:100%"' : '') + '>' : ''; });
        return html.split('\u0000PAGE\u0000').map(function (p) { return '<div class="rp-page rp-imported">' + p + '</div>'; }).join('');
      });
    });
  }

  /* ---------- Excel → HTML: ชีตแรกเป็นตาราง ช่องรวมคงไว้ ---------- */
  function fromXlsx(entries) {
    return Promise.all([text(entries, 'xl/workbook.xml'), text(entries, 'xl/_rels/workbook.xml.rels'), text(entries, 'xl/sharedStrings.xml'), text(entries, 'xl/styles.xml')]).then(function (t) {
      var wb = xml(t[0]), rels = {}, shared = [], boldXf = {};
      Array.prototype.forEach.call(xml(t[1]).getElementsByTagName('Relationship'), function (r) { rels[r.getAttribute('Id')] = r.getAttribute('Target'); });
      if (t[2]) Array.prototype.forEach.call(xml(t[2]).getElementsByTagName('si'), function (si) { shared.push(Array.prototype.map.call(si.getElementsByTagName('t'), function (n) { return n.textContent; }).join('')); });
      if (t[3]) {
        var s = xml(t[3]), fonts = Array.prototype.map.call((s.getElementsByTagName('fonts')[0] || s).getElementsByTagName('font'), function (f) { return !!f.getElementsByTagName('b').length; });
        var cx = s.getElementsByTagName('cellXfs')[0];
        if (cx) Array.prototype.forEach.call(cx.getElementsByTagName('xf'), function (f, i) { boldXf[i] = { bold: fonts[+f.getAttribute('fontId')], align: (f.getElementsByTagName('alignment')[0] || { getAttribute: function () { return ''; } }).getAttribute('horizontal') }; });
      }
      var sheet = wb.getElementsByTagName('sheet')[0], rid = sheet.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id') || sheet.getAttribute('r:id');
      var path = 'xl/' + String(rels[rid] || 'worksheets/sheet1.xml').replace(/^\/?xl\//, '');
      return text(entries, path).then(function (sx) {
        var sh = xml(sx), cells = {}, maxR = 0, maxC = 0, merged = {}, cover = {};
        function rc(ref) { var m = ref.match(/^([A-Z]+)(\d+)$/), c = 0; for (var i = 0; i < m[1].length; i++) c = c * 26 + m[1].charCodeAt(i) - 64; return [+m[2] - 1, c - 1]; }
        Array.prototype.forEach.call(sh.getElementsByTagName('c'), function (c) {
          var p = rc(c.getAttribute('r')), type = c.getAttribute('t'), v = c.getElementsByTagName('v')[0], val = '';
          if (type === 's') val = shared[+(v && v.textContent)] || '';
          else if (type === 'inlineStr') val = Array.prototype.map.call(c.getElementsByTagName('t'), function (n) { return n.textContent; }).join('');
          else val = v ? v.textContent : '';
          cells[p[0] + ':' + p[1]] = { v: val, s: boldXf[+c.getAttribute('s')] || {} };
          if (val !== '') { maxR = Math.max(maxR, p[0]); maxC = Math.max(maxC, p[1]); }
        });
        Array.prototype.forEach.call(sh.getElementsByTagName('mergeCell'), function (m) {
          var a = m.getAttribute('ref').split(':'), s = rc(a[0]), f = rc(a[1] || a[0]);
          merged[s[0] + ':' + s[1]] = [f[0] - s[0] + 1, f[1] - s[1] + 1];
          for (var r = s[0]; r <= f[0]; r++) for (var c = s[1]; c <= f[1]; c++) if (r !== s[0] || c !== s[1]) cover[r + ':' + c] = 1;
          maxC = Math.max(maxC, f[1]);
        });
        var h = '<table class="rp-table"><tbody>';
        for (var r = 0; r <= maxR; r++) {
          h += '<tr>';
          for (var c = 0; c <= maxC; c++) {
            if (cover[r + ':' + c]) continue;
            var cell = cells[r + ':' + c] || { v: '', s: {} }, mg = merged[r + ':' + c], st = cell.s.align ? ' style="text-align:' + (cell.s.align === 'centerContinuous' ? 'center' : cell.s.align) + '"' : '';
            var v = e(cell.v).replace(/\n/g, '<br>');
            h += '<td' + (mg && mg[0] > 1 ? ' rowspan="' + mg[0] + '"' : '') + (mg && mg[1] > 1 ? ' colspan="' + mg[1] + '"' : '') + st + '>' + (cell.s.bold && v ? '<b>' + v + '</b>' : v) + '</td>';
          }
          h += '</tr>';
        }
        return '<div class="rp-page rp-imported">' + h + '</tbody></table></div>';
      });
    });
  }

  function fromFile(file) {
    return file.arrayBuffer().then(function (buf) {
      var entries = unzip(buf);
      if (entries['word/document.xml']) return { ext: 'docx', html: fromDocx(entries) };
      if (entries['xl/workbook.xml']) return { ext: 'xlsx', html: fromXlsx(entries) };
      throw new Error('type');
    }).then(function (r) { return r.html.then(function (h) { return { ext: r.ext, html: h }; }); });
  }

  function save(blob, name) {
    var a = document.createElement('a'), url = URL.createObjectURL(blob);
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }
  function safeName(s) { return String(s || 'เอกสาร').replace(/[\\/:*?"<>|\u0000-\u001f]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 120) || 'เอกสาร'; }

  return { toDocx: toDocx, toXlsx: toXlsx, fromFile: fromFile, save: save, safeName: safeName, b64: b64, unb64: unb64 };
})();
</script>
