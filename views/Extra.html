<script>
/* ===================== รายงานการสอน / นิเทศฝึกงาน / งบหน้า (jQuery + Bootstrap 5) ===================== */
(function ($j) {
  var i = NAV.map(function (n) { return n.sec; }).indexOf('ค่าสอนเกินภาระงาน');
  NAV.splice(i, 0,
    { sec: 'รายงานการสอน' },
    { id: 'teach-report', label: 'รายงานการสอนของฉัน', role: 'teacher' },
    { id: 'teach-review', label: 'ตรวจรายงานการสอน', role: 'dept' },
    { sec: 'นิเทศนักศึกษาฝึกงาน' },
    { id: 'intern', label: 'นักศึกษาฝึกงาน / บันทึกนิเทศ', role: 'teacher' },
    { id: 'intern-summary', label: 'สรุปการนิเทศ', role: 'dept' }
  );
  var wi = NAV.map(function (n) { return n.id; }).indexOf('t-Windows');
  if (wi >= 0) NAV[wi] = { id: 'windows', label: 'คิว/ช่วงเวลาจัดตาราง', role: 'admin' };
  NAV_ICON.windows = '⏳';
  var at = NAV.map(function (n) { return n.id; }).indexOf('ot-summary');
  NAV.splice(at + 1, 0, { id: 'ot-cover', label: 'งบหน้าแผนกวิชา', role: 'dept' });
  $j.extend(NAV_ICON, { 'teach-report': '📝', 'teach-review': '✅', intern: '🏭', 'intern-summary': '📊', 'ot-cover': '📄' });

  var STATUS = { draft: ['ร่าง', 'secondary'], submitted: ['รอตรวจ', 'warning'], approved: ['อนุมัติแล้ว', 'success'], returned: ['ส่งกลับแก้ไข', 'danger'] };
  var KIND = { normal: '', sub: 'สอนแทน', makeup: 'สอนชดเชย' };
  var pad = function (x) { return (x < 10 ? '0' : '') + x; };
  var todayStr = function () { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var badge = function (s) { var v = STATUS[s] || ['ยังไม่รายงาน', 'light text-dark border']; return '<span class="badge text-bg-' + v[1].split(' ')[0] + '">' + v[0] + '</span>'; };
  var safeLink = function (u, label) { return /^https?:\/\//i.test(u || '') ? '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(label || 'เปิดลิงก์') + '</a>' : ''; };
  var courseLabel = function (id) { var c = courseOf(id); return esc(c.code + ' ' + c.name); };
  var dayLabel = function (date) { var d = new Date(date + 'T00:00:00'); return (S.days[(d.getDay() + 6) % 7] || '') + ' ' + thDate(date); };
  var periodLabel = function (st, len) { return 'คาบ ' + st + (Number(len) > 1 ? '–' + (Number(st) + Number(len) - 1) : ''); };
  var teacherOptions = function (list, sel, blank) {
    return (blank ? '<option value="">' + blank + '</option>' : '') + sortBy(list, function (t) { return t.name; }).map(function (t) {
      return '<option value="' + esc(t.id) + '"' + (String(t.id) === String(sel) ? ' selected' : '') + '>' + esc(t.name) + '</option>';
    }).join('');
  };
  var myTeachers = function () { return S.me.role === 'dept' ? S.D.Teachers.filter(function (t) { return String(t.department_id) === String(S.me.department_id); }) : S.D.Teachers; };
  var deptSelect = function (id, sel, blank) {
    if (S.me.role === 'dept') return '<input type="hidden" id="' + id + '" value="' + esc(S.me.department_id) + '">';
    return '<select id="' + id + '" class="form-select form-select-sm w-auto">' + (blank ? '<option value="">' + blank + '</option>' : '') +
      sortBy(S.D.Departments, function (d) { return d.name; }).map(function (d) { return '<option value="' + esc(d.id) + '"' + (String(d.id) === String(sel) ? ' selected' : '') + '>' + esc(d.name) + '</option>'; }).join('') + '</select>';
  };
  var val = function (sel) { return $j(sel).val(); };

  /* ---------- รายงานการสอนของฉัน ---------- */
  var TR = { date: todayStr(), teacher: '' };
  VIEWS['teach-report'] = function (el) {
    if (S.me.role === 'teacher') {
      TR.teacher = S.me.teacher_id;
      if (!TR.teacher) { el.innerHTML = '<div class="alert alert-warning">บัญชีนี้ยังไม่ได้ผูกกับรายชื่อครู กรุณาแจ้งผู้ดูแลระบบ</div>'; return; }
    }
    var list = myTeachers();
    if (!TR.teacher && list.length) TR.teacher = sortBy(list, function (t) { return t.name; })[0].id;
    $j(el).html('<div class="card no-print"><div class="d-flex flex-wrap gap-2 align-items-center">' +
      (S.me.role !== 'teacher' ? '<select id="trT" class="form-select form-select-sm w-auto">' + teacherOptions(list, TR.teacher) + '</select>' : '') +
      '<button class="btn sm" id="trPrev">‹ สัปดาห์ก่อน</button><input type="date" id="trD" class="form-control form-control-sm w-auto" value="' + esc(TR.date) + '"><button class="btn sm" id="trNext">สัปดาห์ถัดไป ›</button>' +
      '<button class="btn sm" id="trNow">สัปดาห์นี้</button><span class="grow"></span><span id="trCount" class="small muted"></span></div></div><div id="trOut"></div>');
    var shift = function (n) { var d = new Date(TR.date + 'T00:00:00'); d.setDate(d.getDate() + n); TR.date = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); $j('#trD').val(TR.date); load(); };
    function load() {
      if (!TR.teacher) { $j('#trOut').html('<div class="card muted">ยังไม่มีครูในแผนก</div>'); return; }
      api('teachReportSlots', S.token, S.sem, TR.teacher, TR.date).then(function (d) { draw(d); });
    }
    function draw(d) {
      var rows = d.slots.filter(function (s) { return !s.replaced; });
      var done = rows.filter(function (s) { return s.report && (s.report.status === 'submitted' || s.report.status === 'approved'); }).length;
      $j('#trCount').text('ส่งแล้ว ' + done + ' จาก ' + rows.length + ' คาบ (' + thDate(d.from) + ' – ' + thDate(d.to) + ')');
      if (!d.slots.length) { $j('#trOut').html('<div class="card muted">สัปดาห์นี้ไม่มีคาบสอนในภาคเรียนที่เลือก</div>'); return; }
      $j('#trOut').html('<div class="card"><div class="table-responsive"><table class="table table-sm table-hover align-middle mb-0"><thead><tr><th>วัน</th><th>คาบ</th><th>วิชา</th><th>กลุ่ม</th><th>หัวข้อที่สอน</th><th>สถานะ</th><th></th></tr></thead><tbody>' +
        d.slots.map(function (s, n) {
          var r = s.report;
          if (s.replaced) return '<tr class="table-light"><td>' + esc(dayLabel(s.date)) + '</td><td>' + periodLabel(s.start, s.length) + '</td><td>' + courseLabel(s.course_id) + '</td><td>' + esc(groupCode(s.group_id)) + '</td><td colspan="3" class="muted small">มีผู้สอนแทนหรือย้ายไปสอนชดเชยแล้ว ไม่ต้องรายงานคาบนี้</td></tr>';
          var future = s.date > d.today;
          return '<tr><td class="text-nowrap">' + esc(dayLabel(s.date)) + '</td><td class="text-nowrap">' + periodLabel(s.start, s.length) + (KIND[s.kind] ? ' <span class="badge text-bg-info">' + KIND[s.kind] + '</span>' : '') + '</td><td>' + courseLabel(s.course_id) + '</td><td>' + esc(groupCode(s.group_id)) + '</td><td class="small">' + esc(r ? r.topic : '') +
            (r && r.status === 'returned' && r.review_note ? '<div class="text-danger">เหตุผล: ' + esc(r.review_note) + '</div>' : '') + '</td><td>' + (r ? badge(r.status) : (future ? '<span class="small muted">ยังไม่ถึงวัน</span>' : badge(''))) + '</td><td class="text-end">' +
            (future ? '' : '<button class="btn sm pri" data-n="' + n + '">' + (r ? (r.status === 'approved' ? 'ดู' : 'แก้ไข') : 'รายงาน') + '</button>') + '</td></tr>';
        }).join('') + '</tbody></table></div></div>');
      $j('#trOut [data-n]').on('click', function () { form(d.slots[Number($j(this).data('n'))]); });
    }
    function form(s) {
      var r = s.report || {}, locked = r.status === 'approved' && S.me.role !== 'admin', g = IDX.Groups[s.group_id] || {};
      var dis = locked ? ' disabled' : '';
      var m = modal('<h3>รายงานการสอน</h3><p class="small muted mb-2">' + esc(dayLabel(s.date)) + ' · ' + periodLabel(s.start, s.length) + ' · ' + courseLabel(s.course_id) + ' · ' + esc(groupCode(s.group_id)) + '</p>' +
        '<label class="form-label mb-1">หัวข้อที่สอน *</label><input id="rpT" class="form-control mb-2" maxlength="500"' + dis + '>' +
        '<label class="form-label mb-1">กิจกรรมการเรียนการสอน</label><textarea id="rpA" class="form-control mb-2" rows="3"' + dis + '></textarea>' +
        '<div class="d-flex gap-2 mb-2"><div class="flex-fill"><label class="form-label mb-1">นักเรียนมาเรียน (คน)</label><input id="rpP" type="number" min="0" class="form-control"' + dis + '></div><div class="flex-fill"><label class="form-label mb-1">ขาดเรียน (คน)</label><input id="rpB" type="number" min="0" class="form-control"' + dis + '></div></div>' +
        '<label class="form-label mb-1">ปัญหา/ข้อเสนอแนะ</label><textarea id="rpQ" class="form-control mb-2" rows="2"' + dis + '></textarea>' +
        '<label class="form-label mb-1">ลิงก์หลักฐาน (เช่น Google Drive, รูปภาพ)</label><input id="rpL" type="url" class="form-control" placeholder="https://"' + dis + '>' +
        '<div class="actions"><button class="btn" onclick="closeModal()">ปิด</button>' + (locked ? '' : (r.id && r.status !== 'approved' ? '<button class="btn bad" id="rpDel">ลบ</button>' : '') + '<button class="btn" id="rpDraft">บันทึกร่าง</button><button class="btn pri" id="rpSend">ส่งรายงาน</button>') + '</div>', true);
      $j('#rpT').val(r.topic || ''); $j('#rpA').val(r.activity || ''); $j('#rpP').val(r.students_present !== undefined && r.students_present !== '' ? r.students_present : (g.students || '')); $j('#rpB').val(r.students_absent || 0); $j('#rpQ').val(r.problems || ''); $j('#rpL').val(r.attachment_link || '');
      var save = function (submit) {
        api('teachReportSave', S.token, { semester_id: S.sem, teacher_id: TR.teacher, session_id: s.session_id, date: s.date, start: s.start, topic: val('#rpT'), activity: val('#rpA'), students_present: val('#rpP'), students_absent: val('#rpB'), problems: val('#rpQ'), attachment_link: val('#rpL') }, submit)
          .then(function () { closeModal(); toast(submit ? 'ส่งรายงานแล้ว' : 'บันทึกร่างแล้ว'); load(); });
      };
      $j('#rpDraft', m).on('click', function () { save(false); });
      $j('#rpSend', m).on('click', function () { save(true); });
      $j('#rpDel', m).on('click', function () { if (confirm('ลบรายงานนี้?')) api('teachReportDelete', S.token, r.id).then(function () { closeModal(); load(); }); });
    }
    $j('#trT').on('change', function () { TR.teacher = this.value; load(); });
    $j('#trD').on('change', function () { if (this.value) { TR.date = this.value; load(); } });
    $j('#trPrev').on('click', function () { shift(-7); }); $j('#trNext').on('click', function () { shift(7); });
    $j('#trNow').on('click', function () { TR.date = todayStr(); $j('#trD').val(TR.date); load(); });
    load();
  };

  /* ---------- ตรวจรายงานการสอน ---------- */
  var RV = { status: 'submitted', dept: '', from: '', to: '', tab: 'list' };
  VIEWS['teach-review'] = function (el) {
    if (!RV.from) { var d = new Date(), m = new Date(d); m.setDate(d.getDate() - ((d.getDay() + 6) % 7)); RV.from = m.getFullYear() + '-' + pad(m.getMonth() + 1) + '-' + pad(m.getDate()); RV.to = todayStr(); }
    $j(el).html('<div class="card no-print"><div class="d-flex flex-wrap gap-2 align-items-center">' + deptSelect('rvD', RV.dept, 'ทุกแผนก') +
      '<input type="date" id="rvF" class="form-control form-control-sm w-auto" value="' + esc(RV.from) + '"><span class="small">ถึง</span><input type="date" id="rvTo" class="form-control form-control-sm w-auto" value="' + esc(RV.to) + '">' +
      '<select id="rvS" class="form-select form-select-sm w-auto"><option value="submitted">รอตรวจ</option><option value="approved">อนุมัติแล้ว</option><option value="returned">ส่งกลับแก้ไข</option><option value="draft">ร่าง</option><option value="">ทุกสถานะ</option></select>' +
      '<button class="btn sm" id="rvSum">สรุปรายครู</button><button class="btn sm" onclick="window.print()">🖨 พิมพ์</button></div></div><div id="rvOut"></div>');
    $j('#rvS').val(RV.status);
    function read() { RV.dept = val('#rvD'); RV.from = val('#rvF'); RV.to = val('#rvTo'); RV.status = val('#rvS'); }
    function list() {
      read();
      api('teachReportList', S.token, { semester_id: S.sem, department_id: RV.dept, status: RV.status, from: RV.from, to: RV.to }).then(function (rows) {
        if (!rows.length) { $j('#rvOut').html('<div class="card muted">ไม่มีรายงานตามเงื่อนไข</div>'); return; }
        $j('#rvOut').html('<div class="card"><div class="table-responsive"><table class="table table-sm table-hover align-middle mb-0"><thead><tr><th>วัน/คาบ</th><th>ครู</th><th>วิชา / กลุ่ม</th><th>เนื้อหา</th><th>นักเรียน</th><th>สถานะ</th><th class="no-print"></th></tr></thead><tbody>' +
          rows.map(function (r) {
            return '<tr><td class="text-nowrap small">' + esc(dayLabel(r.date)) + '<br>' + periodLabel(r.start, r.length) + (KIND[r.kind] ? ' <span class="badge text-bg-info">' + KIND[r.kind] + '</span>' : '') + '</td><td>' + esc(nm('Teachers', r.teacher_id)) + '</td><td class="small">' + courseLabel(r.course_id) + '<br>' + esc(groupCode(r.group_id)) + '</td><td class="small"><b>' + esc(r.topic) + '</b><br>' + esc(r.activity) +
              (r.problems ? '<div class="text-muted">ปัญหา: ' + esc(r.problems) + '</div>' : '') + (r.attachment_link ? '<div>' + safeLink(r.attachment_link, 'หลักฐาน') + '</div>' : '') + (r.review_note ? '<div class="text-danger">หมายเหตุ: ' + esc(r.review_note) + '</div>' : '') +
              '</td><td class="small text-nowrap">มา ' + esc(r.students_present) + '<br>ขาด ' + esc(r.students_absent) + '</td><td>' + badge(r.status) + '</td><td class="no-print text-nowrap">' +
              (r.status === 'submitted' ? '<button class="btn sm pri" data-ok="' + esc(r.id) + '">อนุมัติ</button> <button class="btn sm bad" data-back="' + esc(r.id) + '">ส่งกลับ</button>' : '') + '</td></tr>';
          }).join('') + '</tbody></table></div></div>');
        $j('#rvOut [data-ok]').on('click', function () { api('teachReportReview', S.token, $j(this).data('ok'), 'approve', '').then(list); });
        $j('#rvOut [data-back]').on('click', function () { var n = prompt('เหตุผลที่ส่งกลับให้แก้ไข', ''); if (n) api('teachReportReview', S.token, $j(this).data('back'), 'return', n).then(list); });
      });
    }
    function summary() {
      read();
      api('teachReportSummary', S.token, S.sem, RV.dept, RV.from, RV.to).then(function (rows) {
        $j('#rvOut').html('<div class="card"><h3>สรุปการส่งรายงานการสอน ' + thDate(RV.from) + ' – ' + thDate(RV.to) + '</h3><div class="table-responsive"><table class="table table-sm table-bordered align-middle mb-0"><thead><tr><th>ครู</th><th class="text-end">คาบที่ต้องรายงาน</th><th class="text-end">อนุมัติแล้ว</th><th class="text-end">รอตรวจ</th><th class="text-end">ส่งกลับ</th><th class="text-end">ร่าง</th><th class="text-end">ยังไม่รายงาน</th></tr></thead><tbody>' +
          (rows.length ? sortBy(rows, function (r) { return r.name; }).map(function (r) { return '<tr><td>' + esc(r.name) + '</td><td class="text-end">' + r.expected + '</td><td class="text-end">' + r.approved + '</td><td class="text-end">' + r.submitted + '</td><td class="text-end">' + r.returned + '</td><td class="text-end">' + r.draft + '</td><td class="text-end' + (r.missing ? ' text-danger fw-bold' : '') + '">' + r.missing + '</td></tr>'; }).join('') : '<tr><td colspan="7" class="muted">ไม่มีคาบสอนในช่วงนี้</td></tr>') + '</tbody></table></div></div>');
      });
    }
    $j('#rvD,#rvF,#rvTo,#rvS').on('change', list);
    $j('#rvSum').on('click', summary);
    list();
  };

  /* ---------- นักศึกษาฝึกงาน + บันทึกนิเทศ ---------- */
  VIEWS.intern = function (el) {
    var canEdit = can('dept');
    $j(el).html('<div class="card no-print"><div class="d-flex flex-wrap gap-2 align-items-center"><input id="inQ" class="form-control form-control-sm w-auto" placeholder="ค้นหาชื่อ / สถานประกอบการ"><span class="grow"></span>' +
      (canEdit ? '<button class="btn sm" id="inBulk">วางจาก Excel</button><button class="btn sm pri" id="inAdd">+ เพิ่มนักศึกษา</button>' : '') + '</div></div><div id="inOut"></div>');
    var rows = [];
    function load() { api('internList', S.token, S.sem).then(function (r) { rows = r; draw(); }); }
    function draw() {
      var q = String(val('#inQ') || '').toLowerCase();
      var show = rows.filter(function (r) { return !q || (r.student_name + ' ' + r.student_code + ' ' + r.company_name).toLowerCase().indexOf(q) >= 0; });
      if (!show.length) { $j('#inOut').html('<div class="card muted">' + (rows.length ? 'ไม่พบตามคำค้น' : (canEdit ? 'ยังไม่มีข้อมูลนักศึกษาฝึกงานในภาคเรียนนี้ กด "เพิ่มนักศึกษา" เพื่อเริ่มต้น' : 'ยังไม่มีนักศึกษาที่ครูเป็นผู้นิเทศในภาคเรียนนี้')) + '</div>'); return; }
      $j('#inOut').html('<div class="card"><div class="table-responsive"><table class="table table-sm table-hover align-middle mb-0"><thead><tr><th>นักศึกษา</th><th>กลุ่ม</th><th>สถานประกอบการ</th><th>ช่วงฝึก</th><th>ครูนิเทศ</th><th class="text-end">นิเทศแล้ว</th><th class="no-print"></th></tr></thead><tbody>' +
        sortBy(show, function (r) { return r.student_name; }).map(function (r) {
          return '<tr><td>' + esc(r.student_name) + '<div class="small muted">' + esc(r.student_code) + '</div></td><td>' + esc(groupCode(r.group_id)) + '</td><td>' + esc(r.company_name) + '<div class="small muted">' + esc(r.mentor_name) + (r.company_phone ? ' · ' + esc(r.company_phone) : '') + '</div></td><td class="small text-nowrap">' + (r.start_date ? thDate(r.start_date) : '') + (r.end_date ? ' – ' + thDate(r.end_date) : '') + '</td><td>' + esc(nm('Teachers', r.supervisor_teacher_id)) + '</td><td class="text-end"><span class="badge text-bg-' + (r.visits_done ? 'success' : 'secondary') + '">' + r.visits_done + ' ครั้ง</span>' + (r.visits_planned ? ' <span class="badge text-bg-info">นัด ' + r.visits_planned + '</span>' : '') + '</td><td class="no-print text-end text-nowrap"><button class="btn sm pri" data-v="' + esc(r.id) + '">นิเทศ</button>' +
            (canEdit ? ' <button class="btn sm" data-e="' + esc(r.id) + '">แก้ไข</button> <button class="btn sm bad" data-d="' + esc(r.id) + '">ลบ</button>' : '') + '</td></tr>';
        }).join('') + '</tbody></table></div></div>');
      var find = function (id) { return rows.filter(function (x) { return x.id === id; })[0]; };
      $j('#inOut [data-v]').on('click', function () { visits(find($j(this).data('v'))); });
      $j('#inOut [data-e]').on('click', function () { edit(find($j(this).data('e'))); });
      $j('#inOut [data-d]').on('click', function () { if (confirm('ลบนักศึกษาคนนี้และบันทึกนิเทศทั้งหมด?')) api('internDelete', S.token, $j(this).data('d')).then(load); });
    }
    var groupOpts = function (sel) { var g = S.me.role === 'dept' ? S.D.Groups.filter(function (x) { return String(x.department_id) === String(S.me.department_id); }) : S.D.Groups; return '<option value="">— เลือกกลุ่ม —</option>' + sortBy(g, function (x) { return x.code; }).map(function (x) { return '<option value="' + esc(x.id) + '"' + (String(x.id) === String(sel) ? ' selected' : '') + '>' + esc(x.code || x.name) + '</option>'; }).join(''); };
    function edit(r) {
      r = r || { status: 'active' };
      var field = function (id, label, type) { return '<div><label class="form-label mb-1">' + label + '</label><input id="' + id + '" type="' + (type || 'text') + '" class="form-control"></div>'; };
      var m = modal('<h3>' + (r.id ? 'แก้ไข' : 'เพิ่ม') + 'นักศึกษาฝึกงาน</h3><div class="form-grid">' + field('iC', 'รหัสนักศึกษา') + field('iN', 'ชื่อ-สกุล *') +

            '<td style="min-width:310px"><div class="d-flex flex-wrap gap-1 align-items-center justify-content-end"><div class="d-flex flex-nowrap gap-1"><button class="btn sm" data-a="up"' + (i === 0 ? ' disabled' : '') + ' title="เลื่อนขึ้น">↑</button><button class="btn sm" data-a="down"' + (i === rows.length - 1 ? ' disabled' : '') + ' title="เลื่อนลง">↓</button><button class="btn sm text-nowrap" data-a="open">เปิดก่อนกำหนด</button></div>' +
            '<div class="d-flex flex-nowrap gap-1 align-items-center"><input type="date" class="form-control form-control-sm w-auto wq-s" value="' + esc(w.start_date) + '"><span class="muted">–</span><input type="date" class="form-control form-control-sm w-auto wq-e" value="' + esc(w.end_date) + '"></div><div class="d-flex flex-nowrap gap-1"><button class="btn sm text-nowrap" data-a="save">บันทึกช่วงเวลา</button><button class="btn sm bad" data-a="del">ลบ</button></div></div></td></tr>';
        }).join('') + '</tbody></table></div></div>');
      $j('#wqOut [data-a]').on('click', function () {
        var a = $j(this).data('a'), tr = $j(this).closest('tr'), id = tr.data('id');
        if (a === 'up' || a === 'down') api('windowMove', S.token, id, a === 'up' ? -1 : 1).then(load);
        else if (a === 'open') { if (confirm('เปิดคิวนี้ตั้งแต่วันนี้?')) api('windowOpenNow', S.token, id).then(function () { toast('เปิดคิวแล้ว'); reload(); }); }
        else if (a === 'save') api('windowSave', S.token, id, tr.find('.wq-s').val(), tr.find('.wq-e').val()).then(function () { toast('บันทึกแล้ว'); reload(); });
        else if (a === 'del') { if (confirm('ลบคิวนี้? แผนกจะจัดตารางได้ตลอดเวลาถ้าไม่มีคิวอื่น')) api('windowDelete', S.token, id).then(reload); }
      });
    }
    $j('#wqS').on('change', function () { WQ.sem = this.value; load(); });
    $j('#wqAdd').on('click', function () { api('windowCreateMissing', S.token, WQ.sem).then(function (n) { toast(n ? 'สร้างคิวแล้ว ' + n + ' แผนก' : 'ทุกแผนกมีคิวแล้ว'); reload(); }); });
    load();
  };
})(jQuery);
</script>
