<script>
/* ===================== รายงานการสอน / นิเทศออนไลน์ / งบหน้า (jQuery + Bootstrap 5) ===================== */
(function ($j) {
  var i = NAV.map(function (n) { return n.sec; }).indexOf('ค่าสอนเกินภาระงาน');
  NAV.splice(i, 0,
    { sec: 'รายงานการสอน' },
    { id: 'teach-report', label: 'รายงานการสอนออนไลน์', role: 'teacher' },
    { id: 'teach-review', label: 'ตรวจรายงานการสอน', role: 'dept' },
    { sec: 'นิเทศวิชาในสถานประกอบการ' },
    { id: 'intern', label: 'นิเทศออนไลน์', role: 'teacher' },
    { id: 'intern-summary', label: 'สรุปการนิเทศ', role: 'dept' }
  );
  var wi = NAV.map(function (n) { return n.id; }).indexOf('t-Windows');
  if (wi >= 0) NAV[wi] = { id: 'windows', label: 'คิว/ช่วงเวลาจัดตาราง', role: 'admin' };
  NAV_ICON.windows = '⏳';
  var at = NAV.map(function (n) { return n.id; }).indexOf('ot-summary');
  NAV.splice(at + 1, 0, { id: 'ot-cover', label: 'งบหน้าแผนกวิชา', role: 'dept' });
  $j.extend(NAV_ICON, { 'teach-report': '📝', 'teach-review': '✅', intern: '🏭', 'intern-summary': '📊', 'ot-cover': '📄' });

  var STATUS = { draft: ['ร่าง', 'secondary'], submitted: ['รอตรวจ', 'warning'], approved: ['อนุมัติแล้ว', 'success'], returned: ['ส่งกลับแก้ไข', 'danger'] };
  var KIND = { normal: '', sub: 'สอนแทน', makeup: 'สอนชดเชย' };
  var pad = function (x) { return (x < 10 ? '0' : '') + x; };
  var todayStr = function () { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var badge = function (s) { var v = STATUS[s] || ['ยังไม่รายงาน', 'light text-dark border']; return '<span class="badge text-bg-' + v[1].split(' ')[0] + '">' + v[0] + '</span>'; };
  var safeLink = function (u, label) { return /^https?:\/\//i.test(u || '') ? '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(label || 'เปิดลิงก์') + '</a>' : ''; };
  var courseLabel = function (id) { var c = courseOf(id); return esc(c.code + ' ' + c.name); };
  var dayLabel = function (date) { var d = new Date(date + 'T00:00:00'); return (S.days[(d.getDay() + 6) % 7] || '') + ' ' + thDate(date); };
  var periodLabel = function (st, len) { return 'คาบ ' + Grid.periodRange(S.settings, st, len); };
  var teacherOptions = function (list, sel, blank) {
    return (blank ? '<option value="">' + blank + '</option>' : '') + sortBy(list, function (t) { return t.name; }).map(function (t) {
      return '<option value="' + esc(t.id) + '"' + (String(t.id) === String(sel) ? ' selected' : '') + '>' + esc(t.name) + '</option>';
    }).join('');
  };
  var myTeachers = function () { return S.me.role === 'dept' ? S.D.Teachers.filter(function (t) { return String(t.department_id) === String(S.me.department_id); }) : S.D.Teachers; };
  var deptSelect = function (id, sel, blank) {
    if (S.me.role === 'dept') return '<input type="hidden" id="' + id + '" value="' + esc(S.me.department_id) + '">';
    return '<select id="' + id + '" class="form-select form-select-sm w-auto">' + (blank ? '<option value="">' + blank + '</option>' : '') +
      sortBy(S.D.Departments, function (d) { return d.name; }).map(function (d) { return '<option value="' + esc(d.id) + '"' + (String(d.id) === String(sel) ? ' selected' : '') + '>' + esc(d.name) + '</option>'; }).join('') + '</select>';
  };
  var val = function (sel) { return $j(sel).val(); };

  /* ---------- ตัวช่วยรายงานการสอนออนไลน์ ---------- */
  var MAX_IMAGES = 4;
  var groupNames = function (ids) { return (ids || []).map(groupCode).join(', '); };
  var firstLine = function (s) { return String(s || '').split(/\r?\n/)[0]; };
  var parseAttendance = function (r) { try { var a = JSON.parse(r.attendance || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } };
  var reportGroupIds = function (r) { return r.group_ids ? String(r.group_ids).split(',').filter(String) : [r.group_id]; };
  var TH_MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
  var thNum = function (s) { return String(s === undefined || s === null ? '' : s).replace(/[0-9]/g, function (d) { return '๐๑๒๓๔๕๖๗๘๙'[d]; }); };
  var dateParts = function (date) { var p = String(date || '').slice(0, 10).split('-'); return { day: Number(p[2]) || '', month: TH_MONTHS[Number(p[1]) - 1] || '', year: p[0] ? Number(p[0]) + 543 : '' }; };
  var thLongDate = function (date) { var d = dateParts(date); return thNum(d.day + ' ' + d.month + ' ' + d.year); };
  var DEFAULT_MEMO = 'ตาม ประกาศ{วิทยาลัย} เรื่องการจัดการเรียน การสอนในรูปแบบ Online เป็นกรณีพิเศษ ในวันที่ {วันที่} ได้มอบหมายให้ข้าราชการครูและบุคลากรทางการศึกษา มาปฏิบัติหน้าที่ราชการตามปกติ โดยให้ครูผู้สอนจัดกิจกรรมการเรียนการสอนออนไลน์ตามตารางเรียน ตารางสอนที่วิทยาลัยฯ กำหนดไว้';
  var memoTemplate = function (date) { return String(S.settings.report_memo_text || DEFAULT_MEMO).replace(/\{วิทยาลัย\}/g, S.settings.college_name || '').replace(/\{วันที่\}/g, thLongDate(date)); };
  var rankText = function (pos) { pos = String(pos || 'ครู'); return /^ครู(ชำนาญ|เชี่ยวชาญ)/.test(pos) ? 'ครู วิทยฐานะ ' + pos : pos; };

  /* ย่อรูปในเครื่องก่อนส่ง รูปหน้าจอจากมือถือมักใหญ่เกินจำเป็น */
  function shrinkImage(file) {
    return new Promise(function (resolve, reject) {
      if (!/^image\/(jpeg|png)$/.test(file.type)) return reject(new Error('type'));
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('read')); };
      img.src = url;
    });
  }

  /* เอกสาร 3 หน้าตามแบบของวิทยาลัย */
  function reportDocHtml(r, images) {
    var st = S.settings, college = st.college_name || '', t = IDX.Teachers[r.teacher_id] || {}, c = courseOf(r.course_id), gids = reportGroupIds(r), groups = gids.map(function (g) { return IDX.Groups[g] || {}; });
    var dept = deptName(t.department_id), rank = rankText(t.position);
    var head = S.D.Teachers.filter(function (x) { return String(x.department_id) === String(t.department_id) && String(x.is_dept_head) === 'true'; })[0] || {};
    var uniq = function (a) { return a.filter(function (x, i) { return x && a.indexOf(x) === i; }); };
    var levels = uniq(groups.map(function (g) { return g.year_level || g.level; })).join(', ');
    var majors = uniq(groups.map(function (g) { return nm('Majors', g.major_id).replace(/\s*\((ปวช|ปวส)\.?\)\s*$/, ''); })).join(', ');
    var times = Grid.periodTimes(st), from = times[Number(r.start) - 1] || ['', ''], to = times[Number(r.start) + Number(r.length) - 2] || from;
    var clock = function (x) { return thNum(String(x).replace('.', ':')); }, d = dateParts(r.date);
    var dayName = S.days[(new Date(r.date + 'T00:00:00').getDay() + 6) % 7] || '';
    var f = function (v, cls) { return '<span class="rp-f' + (cls ? ' ' + cls : '') + '">' + esc(thNum(v)) + '</span>'; };
    var numbered = function (text) { return '<ol class="rp-list">' + String(text || '').split(/\r?\n/).map(function (x) { return x.trim(); }).filter(String).map(function (x, i) { return '<li><span>' + thNum(i + 1) + '.</span>' + esc(thNum(x)) + '</li>'; }).join('') + '</ol>'; };
    var dots = '.............................................';
    var opinion = function (title, lines, name, role) { return '<td><b>' + title + '</b><div>เรียน ผู้อำนวยการ' + esc(college) + '</div>' + lines.map(function (l) { return '<div class="rp-ind">- ' + l + '</div>'; }).join('') + '<div class="rp-sig">ลงชื่อ' + dots + '<br>( ' + esc(name || dots) + ' )<br>' + esc(role) + '</div></td>'; };
    var sign = function (name, role, suffix) { return '<div>ลงชื่อ' + dots + (suffix || '') + '<br>( ' + esc(name || dots) + ' )' + (role ? '<br>' + esc(role) : '') + '</div>'; };
    var memo = '<div class="page rp-page" data-pdf-width="760"><div class="rp-memo-head"><img src="assets/krut.png" alt="ตราครุฑ"><h1>บันทึกข้อความ</h1></div>' +
      '<div class="rp-line"><b>ส่วนราชการ</b>' + f(college, 'grow') + '</div><div class="rp-line"><b>ที่</b>' + f(r.memo_no, 'grow') + '<b>วันที่</b>' + f(thLongDate(r.memo_date || r.date), 'grow') + '</div><div class="rp-line"><b>เรื่อง</b>' + f('รายงานการสอนออนไลน์', 'grow') + '</div>' +
      '<p class="rp-to">เรียน ผู้อำนวยการ' + esc(college) + '</p><p class="rp-para">' + esc(thNum(r.memo_reason || memoTemplate(r.date))) + '</p>' +
      '<p class="rp-para">ในการนี้ ข้าพเจ้า ' + esc(t.name) + ' ตำแหน่ง ' + esc(rank) + ' แผนกวิชา' + esc(dept) + ' ได้ดำเนินการจัดการเรียนการสอนออนไลน์ ในช่วงเวลาดังกล่าวเสร็จสิ้นเป็นที่เรียบร้อยแล้ว จึงขออนุญาตรายงานผลการจัดการเรียนการสอนดังกล่าว ดังรายละเอียดที่แนบมาพร้อมนี้</p>' +
      '<p class="rp-para">จึงเรียนมาเพื่อโปรดทราบและพิจารณา</p><div class="rp-sign-one">' + sign(t.name, 'ตำแหน่ง ' + rank, 'ครูผู้สอน') + '</div>' +
      '<table class="rp-opinions"><tr>' + opinion('ความเห็นของหัวหน้าแผนกวิชา', ['เพื่อโปรดทราบและพิจารณาอนุญาต'], head.name, 'หัวหน้าแผนกวิชา' + dept) + opinion('ความเห็นของหัวหน้างานพัฒนาหลักสูตรฯ', ['เพื่อโปรดทราบและพิจารณาอนุญาต'], st.signer_curriculum, 'หัวหน้างานพัฒนาหลักสูตรและการจัดการเรียนรู้') + '</tr><tr>' +
      opinion('ความเห็นของรองผู้อำนวยการฝ่ายวิชาการ', ['เพื่อโปรดทราบ', 'เพื่อโปรดพิจารณาอนุญาต'], st.signer_deputy, 'รองผู้อำนวยการฝ่ายวิชาการ') +
      '<td><b>ความเห็นของผู้อำนวยการ</b><div class="rp-check"><span>(   ) ทราบ</span><span>(   ) อนุญาต</span><span>(   ) ไม่อนุญาต</span><span>(   ) อื่น ๆ ..............</span></div><div class="rp-sig">ลงชื่อ' + dots + '<br>( ' + esc(st.signer_director || dots) + ' )<br>ผู้อำนวยการ' + esc(college) + '</div></td></tr></table></div>';
    var detailHead = '<h2 class="rp-title">รายงานการสอนออนไลน์</h2><div class="rp-line">ชื่อวิชา' + f(c.name, 'grow') + 'รหัสวิชา' + f(c.code) + '</div><div class="rp-line">ระดับชั้น' + f(levels) + 'กลุ่มชั้นเรียน/ห้อง' + f(gids.map(groupCode).join(' , '), 'grow') + 'สาขาวิชา' + f(majors, 'grow') + '</div>' +
      '<div class="rp-line">วัน' + f(dayName, 'grow') + 'ที่' + f(d.day) + 'เดือน' + f(d.month, 'grow') + 'พ.ศ.' + f(d.year) + 'เวลา' + '<span class="rp-f">' + clock(from[0]) + ' - ' + clock(to[1]) + '</span>น.</div><hr class="rp-dash">';
    var pics = images.length ? '<div class="rp-pics rp-pics-' + Math.min(images.length, 4) + '">' + images.map(function (x) { return '<img src="' + x.url + '" alt="รูปประกอบการเรียนการสอน">'; }).join('') + '</div>' : '<p class="rp-empty">ไม่มีรูปประกอบ</p>';
    var page2 = '<div class="page rp-page" data-pdf-width="760">' + detailHead + '<h3>รูปภาพประกอบการเรียนการสอนออนไลน์</h3>' + pics + '<h3>เนื้อหา/กิจกรรมการเรียนการสอน</h3>' + numbered(r.topic) + (r.activity ? '<p class="rp-text">' + esc(thNum(r.activity)) + '</p>' : '') + '</div>';
    var att = parseAttendance(r);
    var page3 = '<div class="page rp-page" data-pdf-width="760"><h3>สื่อการสอน</h3>' + numbered(r.media) + '<h3>การวัดและประเมินผล</h3>' + numbered(r.evaluation) + '<h3>งานที่มอบหมาย</h3><p class="rp-text">' + esc(thNum(r.assignment)) + '</p>' +
      att.map(function (a) { return '<p class="rp-room">ห้อง ' + f(groupCode(a.group_id)) + ' มีจำนวนผู้เรียนทั้งหมด ' + f(a.total) + ' คน เข้าเรียน ' + f(a.present) + ' คน ขาดเรียน ' + f(a.absent) + ' คน' + (a.numbers ? '<br>(เลขที่ ' + f(a.numbers) + ')' : '') + '</p>'; }).join('') +
      '<div class="rp-sign-four">' + sign(t.name, '', 'ครูผู้สอน') + sign(head.name, '', 'หัวหน้าแผนกวิชา') + sign(st.signer_curriculum, 'หัวหน้างานพัฒนาหลักสูตรและการจัดการเรียนรู้') + sign(st.signer_deputy, 'รองผู้อำนวยการฝ่ายวิชาการ') + '</div></div>';
    return memo + page2 + page3;
  }

  /* เปิดเอกสารเต็มหน้า พร้อมปุ่มแชร์และพิมพ์ */
  function showReportDoc(r) {
    if (r.kind && r.kind !== 'normal') return showSubDocs([r]);
    var el = document.getElementById('content'), view = S.view;
    el.innerHTML = '<div class="card muted">กำลังโหลดเอกสาร…</div>';
    api('teachReportImages', S.token, r.id).then(function (images) {
      var c = courseOf(r.course_id);
      el.innerHTML = '<div class="row no-print" style="margin-bottom:12px"><button class="btn" id="rdBack">‹ กลับ</button><button class="btn pri" id="rdShare">📤 แชร์ PDF</button><button class="btn" onclick="window.print()">🖨 พิมพ์</button></div><div class="rp-doc">' + reportDocHtml(r, images) + '</div>';
      document.getElementById('rdBack').onclick = function () { go(view); };
      Grid.bindShareButton(document.getElementById('rdShare'), function () { return el.querySelectorAll('.rp-page'); }, function () { return 'รายงานการสอนออนไลน์ ' + c.code + ' ' + r.date; }, function (m, bad) { toast(m, bad); });
      window.scrollTo(0, 0);
    });
  }

  /* ---------- เอกสารสอนแทน / สอนชดเชย ---------- */
  var TH_MONTHS_SHORT = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  var shortDate = function (date) { var p = String(date || '').slice(0, 10).split('-'); return p[0] ? thNum(Number(p[2]) + ' ' + TH_MONTHS_SHORT[Number(p[1]) - 1] + ' ' + String(Number(p[0]) + 543).slice(-2)) : ''; };
  var timeRange = function (start, len) { var t = Grid.periodTimes(S.settings), a = t[Number(start) - 1] || ['', ''], b = t[Number(start) + Number(len) - 2] || a; return thNum(String(a[0]).replace(':', '.') + '-' + String(b[1]).replace(':', '.')); };
  var rpDots = '.............................................';
  var rpSign = function (name, role, suffix) { return '<div>ลงชื่อ' + rpDots + (suffix || '') + '<br>( ' + esc(name || rpDots) + ' )' + (role ? '<br>' + esc(role) : '') + '</div>'; };
  var deptHead = function (t) { return S.D.Teachers.filter(function (x) { return String(x.department_id) === String(t.department_id) && String(x.is_dept_head) === 'true'; })[0] || {}; };
  var rpMemoHead = function (subject, no, date) {
    var st = S.settings;
    return '<div class="rp-memo-head"><img src="assets/krut.png" alt="ตราครุฑ"><h1>บันทึกข้อความ</h1></div><div class="rp-line"><b>ส่วนราชการ</b> ' + esc(st.college_name) + '</div><div class="rp-line"><b>ที่</b><span class="rp-f grow">' + esc(thNum(no)) + '</span><b>วันที่</b><span class="rp-f grow">' + esc(thLongDate(date)) + '</span></div><div class="rp-line"><b>เรื่อง</b> ' + esc(subject) + '</div><p class="rp-to"><b>เรียน</b> ผู้อำนวยการ' + esc(st.college_name) + '</p>';
  };
  /* ช่องเสนอตามสายงาน: หัวหน้าแผนกและงานหลักสูตรทางซ้าย รองฯ และผู้อำนวยการทางขวา */
  var rpApproval = function (t, want) {
    var st = S.settings, dept = deptName(t.department_id), line = '<b>เรียน</b> ผู้อำนวยการฯ ' + want, sig = function (name, role) { return '<div class="rp-sig">ลงชื่อ' + rpDots + '<br>( ' + esc(name || rpDots) + ' )<br>' + esc(role) + '</div>'; };
    return '<table class="rp-opinions"><tr><td>' + line + sig(deptHead(t).name, 'หัวหน้าแผนกวิชา' + dept) + '<div class="rp-gap">' + line + '</div>' + sig(st.signer_curriculum, 'หัวหน้างานพัฒนาหลักสูตรและการจัดการเรียนรู้') + '</td><td>' + line + sig(st.signer_deputy, 'รองผู้อำนวยการฝ่ายวิชาการ') + '<div class="rp-check rp-gap"><span>(   ) อนุมัติ</span><span>(   ) ไม่อนุมัติ</span></div>' + sig(st.signer_director, 'ผู้อำนวยการ' + st.college_name) + '</td></tr></table>';
  };
  var splitClass = function (code) { var m = String(code).match(/^(.*?)\s*(\d+\/\d+)$/); return m ? [m[1], m[2]] : [code, '']; };
  var subMemoTemplate = function (s) {

      var teachers = sortBy(Object.keys(byTeacher).map(function (t) { return { id: t, name: nm('Teachers', t) || 'ยังไม่กำหนดครูผู้สอน', units: byTeacher[t] }; }), function (x) { return x.name; });
      $j('#inOut').html(teachers.map(function (x) {
        var done = x.units.filter(function (u) { return Number(u.visits_done) > 0; }).length;
        return '<div class="card"><div class="d-flex flex-wrap gap-2 align-items-center mb-2"><h3 class="mb-0">' + esc(x.name) + '</h3><span class="grow"></span><span class="small muted">นิเทศแล้ว ' + done + ' จาก ' + x.units.length + ' รายวิชา</span></div>' +
          '<div class="table-responsive"><table class="table table-sm table-hover align-middle mb-0"><thead><tr><th>รายวิชา</th><th>กลุ่มเรียน</th><th>เวลาในตาราง</th><th class="text-end">นิเทศแล้ว</th><th class="no-print"></th></tr></thead><tbody>' +
          sortBy(x.units, function (u) { return courseOf(u.course_id).code; }).map(function (u) {
            var c = courseOf(u.course_id);
            return '<tr><td><b>' + esc(c.code) + '</b><div class="small">' + esc(c.name) + '</div></td><td class="small">' + esc(groupsOf(u)) + '</td><td class="small">' + (u.slots.length ? u.slots.map(esc).join('<br>') : '<span class="muted">ยังไม่ลงตาราง</span>') +
              '</td><td class="text-end text-nowrap"><span class="badge text-bg-' + (Number(u.visits_done) ? 'success' : 'secondary') + '">' + u.visits_done + ' ครั้ง</span>' + (Number(u.visits_planned) ? ' <span class="badge text-bg-info">นัด ' + u.visits_planned + '</span>' : '') + (u.last_visit ? '<div class="small muted">ล่าสุด ' + thDate(u.last_visit) + '</div>' : '') +
              '</td><td class="no-print text-end"><button class="btn sm pri" data-v="' + esc(u.key) + '">นิเทศ</button></td></tr>';
          }).join('') + '</tbody></table></div></div>';
      }).join(''));
      $j('#inOut [data-v]').on('click', function () { var k = String($j(this).data('v')); visits(rows.filter(function (x) { return x.key === k; })[0]); });
    }
    function visits(u) {
      var c = courseOf(u.course_id);
      var m = modal('<h3>บันทึกนิเทศ: ' + esc(c.code + ' ' + c.name) + '</h3><p class="small muted mb-2">' + esc(groupsOf(u)) + ' · ครูผู้สอน ' + esc(teachersOf(u) || '-') + '</p><div id="vList" class="mb-3"></div><hr>' +
        '<h3 id="vTitle" class="h6">เพิ่มการนิเทศ</h3><div class="form-grid"><div><label class="form-label mb-1">วันที่ *</label><input id="vD" type="date" class="form-control"></div>' +
        '<div><label class="form-label mb-1">สถานประกอบการ</label><input id="vK" class="form-control"></div>' +
        '<div><label class="form-label mb-1">รูปแบบ</label><select id="vY" class="form-select"><option value="online">ออนไลน์</option><option value="onsite">ไปสถานประกอบการ</option></select></div>' +
        '<div><label class="form-label mb-1">สถานะ</label><select id="vS" class="form-select"><option value="done">นิเทศแล้ว</option><option value="planned">นัดหมาย</option></select></div>' +
        '<div><label class="form-label mb-1">ลิงก์ประชุมออนไลน์</label><input id="vM" type="url" class="form-control" placeholder="https://"></div>' +
        '<div><label class="form-label mb-1">คะแนน (0–5)</label><input id="vC" type="number" min="0" max="5" step="0.5" class="form-control"></div>' +
        '<div><label class="form-label mb-1">นิเทศครั้งถัดไป</label><input id="vN" type="date" class="form-control"></div></div>' +
        '<label class="form-label mb-1 mt-2">หัวข้อ</label><input id="vT" class="form-control mb-2"><label class="form-label mb-1">ผลการนิเทศ *</label><textarea id="vF" class="form-control mb-2" rows="3"></textarea>' +
        '<label class="form-label mb-1">ข้อเสนอแนะ</label><textarea id="vG" class="form-control mb-2" rows="2"></textarea><label class="form-label mb-1">ลิงก์หลักฐาน</label><input id="vE" type="url" class="form-control" placeholder="https://">' +
        '<div class="actions"><button class="btn" onclick="closeModal()">ปิด</button><button class="btn pri" id="vSave">บันทึกการนิเทศ</button></div>', true);
      var cur = '';
      var reset = function () { cur = ''; $j('#vTitle').text('เพิ่มการนิเทศ'); $j('#vD').val(todayStr()); $j('#vY').val('online'); $j('#vS').val('done'); $j('#vK,#vM,#vC,#vN,#vT,#vF,#vG,#vE').val(''); };
      function list() {
        api('visitList', S.token, S.sem, u.key).then(function (v) {
          $j('#vList').html(v.length ? '<div class="table-responsive"><table class="table table-sm align-middle mb-0"><thead><tr><th>วันที่</th><th>รูปแบบ</th><th>ผล</th><th>คะแนน</th><th></th></tr></thead><tbody>' + v.map(function (x) {
            return '<tr><td class="text-nowrap small">' + thDate(x.visit_date) + (x.status === 'planned' ? ' <span class="badge text-bg-info">นัดหมาย</span>' : '') + '</td><td class="small">' + (x.visit_type === 'onsite' ? 'ไปสถานประกอบการ' : 'ออนไลน์') + (x.company_name ? '<br>' + esc(x.company_name) : '') + (x.meeting_link ? '<br>' + safeLink(x.meeting_link, 'เข้าประชุม') : '') + '</td><td class="small"><b>' + esc(x.topic) + '</b> ' + esc(x.findings) + (x.suggestions ? '<div class="text-muted">แนะนำ: ' + esc(x.suggestions) + '</div>' : '') + (x.evidence_link ? '<div>' + safeLink(x.evidence_link, 'หลักฐาน') + '</div>' : '') + '</td><td>' + esc(x.score) + '</td><td class="text-nowrap text-end"><button class="btn sm" data-ve="' + esc(x.id) + '">แก้ไข</button> <button class="btn sm bad" data-vd="' + esc(x.id) + '">ลบ</button></td></tr>';
          }).join('') + '</tbody></table></div>' : '<div class="small muted">ยังไม่มีบันทึกนิเทศ</div>');
          $j('#vList [data-ve]').on('click', function () {
            var id = String($j(this).data('ve')), x = v.filter(function (i) { return String(i.id) === id; })[0];
            cur = x.id; $j('#vTitle').text('แก้ไขการนิเทศ'); $j('#vD').val(x.visit_date); $j('#vK').val(x.company_name); $j('#vY').val(x.visit_type); $j('#vS').val(x.status); $j('#vM').val(x.meeting_link); $j('#vC').val(x.score); $j('#vN').val(x.next_visit_date); $j('#vT').val(x.topic); $j('#vF').val(x.findings); $j('#vG').val(x.suggestions); $j('#vE').val(x.evidence_link);
          });
          $j('#vList [data-vd]').on('click', function () { if (confirm('ลบรายการนี้?')) api('visitDelete', S.token, $j(this).data('vd')).then(function () { list(); load(); }); });
        });
      }
      $j('#vSave', m).on('click', function () {
        api('visitSave', S.token, { id: cur, semester_id: S.sem, unit_key: u.key, company_name: val('#vK'), visit_date: val('#vD'), visit_type: val('#vY'), status: val('#vS'), meeting_link: val('#vM'), score: val('#vC'), next_visit_date: val('#vN'), topic: val('#vT'), findings: val('#vF'), suggestions: val('#vG'), evidence_link: val('#vE') })
          .then(function () { toast('บันทึกแล้ว'); reset(); list(); load(); });
      });
      reset(); list();
    }
    $j('#inQ').on('input', draw);
    $j('#inF').on('change', draw);
    load();
  };

  /* ---------- สรุปการนิเทศ ---------- */
  VIEWS['intern-summary'] = function (el) {
    api('superviseList', S.token, S.sem).then(function (rows) {
      var by = {};
      rows.forEach(function (u) {
        (u.teacher_ids.length ? u.teacher_ids : ['-']).forEach(function (k) {
          var b = by[k] = by[k] || { name: nm('Teachers', k) || 'ยังไม่กำหนดครู', units: 0, done: 0, none: [] };
          b.units++; b.done += Number(u.visits_done) || 0;
          if (!Number(u.visits_done)) b.none.push(courseOf(u.course_id).code + ' ' + groupsOf(u));
        });
      });
      var list = sortBy(Object.keys(by).map(function (k) { return by[k]; }), function (b) { return b.name; });
      $j(el).html('<div class="card no-print"><div class="d-flex gap-2 align-items-center"><span class="small muted">ภาคเรียน ' + esc(semLabel(S.sem)) + ' · วิชาในสถานประกอบการ ' + rows.length + ' รายการ</span><span class="grow"></span><button class="btn sm" onclick="window.print()">🖨 พิมพ์</button></div></div>' +
        '<div class="card"><h3>สรุปการนิเทศวิชาที่สอนในสถานประกอบการ</h3><div class="table-responsive"><table class="table table-sm table-bordered align-middle mb-0"><thead><tr><th>ครูผู้สอน</th><th class="text-end">รายการวิชา</th><th class="text-end">นิเทศแล้ว (ครั้ง)</th><th>ยังไม่ได้นิเทศ</th></tr></thead><tbody>' +
        (list.length ? list.map(function (b) { return '<tr><td>' + esc(b.name) + '</td><td class="text-end">' + b.units + '</td><td class="text-end">' + b.done + '</td><td class="small' + (b.none.length ? ' text-danger' : '') + '">' + (b.none.length ? esc(b.none.join(', ')) : 'ครบทุกรายการ') + '</td></tr>'; }).join('') : '<tr><td colspan="4" class="muted">ยังไม่มีข้อมูล</td></tr>') + '</tbody></table></div></div>');
    });
  };

  /* ---------- งบหน้าแผนกวิชา ---------- */
  var CV = { dept: '' };
  VIEWS['ot-cover'] = function (el) {
    if (!(S.D.OtRounds || []).length) { el.innerHTML = '<div class="card">ยังไม่มีรอบการเบิก</div>'; return; }
    if (!CV.dept) CV.dept = S.me.department_id || (S.D.Departments[0] || {}).id;
    $j(el).html('<div class="card no-print"><div class="d-flex flex-wrap gap-2 align-items-center"><select id="cvR" class="form-select form-select-sm w-auto">' + roundOptions() + '</select>' + deptSelect('cvD', CV.dept) + '<span class="grow"></span><button class="btn sm pri" onclick="window.print()">🖨 พิมพ์ / PDF</button></div></div><div id="cvOut" class="muted">กำลังโหลด…</div>');
    function load() {
      OT.round = val('#cvR'); CV.dept = val('#cvD');
      api('otCoverSheet', S.token, OT.round, CV.dept).then(function (r) {
        var s = S.settings, round = r.round;
        var head = S.D.Teachers.filter(function (t) { return String(t.department_id) === String(CV.dept) && String(t.is_dept_head) === 'true'; })[0];
        var sign = function (name, role) { return '<div>ลงชื่อ.................................<br>(' + esc(name || '.................................') + ')<br>' + role + '</div>'; };
        var num = function (v) { return '<td class="text-end">' + money(v) + '</td>'; };
        $j('#cvOut').removeClass('muted').html('<div class="page"><h2 class="text-center">งบหน้าการเบิกค่าสอนเกินภาระงาน</h2><div class="sub text-center">' + esc(s.college_name) + ' · แผนกวิชา' + esc(deptName(CV.dept)) + '<br>' + esc(round.name) + ' ภาคเรียนที่ ' + esc(semLabel(round.semester_id)) + ' (' + thDate(round.start_date) + ' – ' + thDate(round.end_date) + ')</div>' +
          (r.notLocked.length ? '<div class="alert alert-warning no-print py-2 small">ยังไม่ล็อกใบเบิก: ' + esc(r.notLocked.join(', ')) + ' — งบหน้านับเฉพาะใบที่ล็อกแล้ว</div>' : '') +
          '<div class="table-responsive"><table class="table table-sm table-bordered align-middle"><thead class="text-center"><tr><th rowspan="2">ที่</th><th rowspan="2">ชื่อ-สกุล</th><th rowspan="2">ตำแหน่ง</th><th colspan="' + r.weeks.length + '">จำนวนเงินรายสัปดาห์ (บาท)</th><th rowspan="2">รวม (ชม.)</th><th rowspan="2">รวมเงิน (บาท)</th></tr><tr>' +
          r.weeks.map(function (w) { return '<th title="' + thDate(w.from) + ' – ' + thDate(w.to) + '">' + w.index + '</th>'; }).join('') + '</tr></thead><tbody>' +
          (r.rows.length ? r.rows.map(function (x, i) { return '<tr><td class="text-center">' + (i + 1) + '</td><td>' + esc(x.name) + '</td><td class="small">' + esc(x.position) + '</td>' + r.weeks.map(function (w) { return num(x.week_amounts[w.index] || 0); }).join('') + '<td class="text-end">' + x.hours + '</td>' + num(x.amount) + '</tr>'; }).join('') : '<tr><td colspan="' + (r.weeks.length + 5) + '" class="text-center muted">ยังไม่มีใบเบิกที่ล็อกแล้ว</td></tr>') +
          '<tr class="fw-bold"><td colspan="3" class="text-end">รวมทั้งสิ้น</td>' + r.weeks.map(function (w) { return num(r.weekTotals[w.index] || 0); }).join('') + '<td class="text-end">' + r.totals.hours + '</td>' + num(r.totals.amount) + '</tr>' +
          '<tr><td colspan="' + (r.weeks.length + 5) + '" class="text-center">(' + esc(r.totalText) + ')</td></tr></tbody></table></div>' +
          '<p class="small">ผู้มีสิทธิ์เบิก ' + r.rows.length + ' คน · ชั่วโมงรวม ปวช. ' + r.totals.vc + ' · ปวส. ' + r.totals.vs + ' · ปตรี. ' + r.totals.bd + ' · เบิกรายหัว ' + money(r.totals.perHeadAmount) + ' บาท</p>' +
          '<div class="signs">' + sign(head && head.name, 'หัวหน้าแผนกวิชา<br>ผู้จัดทำ') + sign(s.signer_curriculum, 'หัวหน้างานพัฒนาหลักสูตรฯ<br>ผู้ตรวจสอบ') + '</div>' +
          '<div class="signs">' + sign(s.signer_deputy, 'รองผู้อำนวยการฝ่ายวิชาการ') + sign(s.signer_director, 'ผู้อำนวยการวิทยาลัย<br>ผู้อนุมัติ') + '</div></div>');
      });
    }
    $j('#cvR,#cvD').on('change', load);
    load();
  };

  /* ---------- คิว/ช่วงเวลาจัดตาราง ---------- */
  var WQ = { sem: '' };
  var dmy = function (s) { if (!s) return '—'; var p = String(s).slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; };
  var dm = function (s) { var p = String(s).slice(0, 10).split('-'); return p[2] + '/' + p[1]; };
  var dayNo = function (s) { return Math.round(new Date(String(s).slice(0, 10) + 'T00:00:00Z').getTime() / 86400000); };
  var winStatus = function (w, today) {
    if (!w.start_date && !w.end_date) return ['ไม่กำหนด', 'text-bg-light border'];
    if (w.start_date && today < w.start_date) return ['รอคิว', 'text-bg-info'];
    if (w.end_date && today > w.end_date) return ['ปิดแล้ว', 'text-bg-secondary'];
    return ['เปิดอยู่', 'text-bg-success'];
  };
  VIEWS.windows = function (el) {
    if (!WQ.sem) WQ.sem = S.sem;
    var semOpts = S.D.Semesters.map(function (s) { return '<option value="' + esc(s.id) + '"' + (String(s.id) === String(WQ.sem) ? ' selected' : '') + '>' + esc(s.label || (s.term + '/' + s.year)) + '</option>'; }).join('');
    $j(el).html('<div class="card no-print"><div class="d-flex flex-wrap gap-3 align-items-end"><div><label class="form-label small muted mb-1">ภาคเรียน</label><select id="wqS" class="form-select" style="min-width:230px">' + semOpts + '</select></div><button class="btn pri" id="wqAdd">+ สร้างคิวสำหรับแผนกที่ยังไม่มี</button></div></div><div id="wqOut"></div>');
    function reload() {
      // หน้าจัดตารางใช้ข้อมูลคิวชุดเดียวกัน จึงโหลดข้อมูลหลักใหม่ด้วย
      return reloadData().then(load);
    }
    function load() { return api('windowList', S.token, WQ.sem).then(draw); }
    function draw(rows) {
      if (!rows.length) { $j('#wqOut').html('<div class="card muted">ภาคเรียนนี้ยังไม่มีคิว กด "สร้างคิวสำหรับแผนกที่ยังไม่มี" เพื่อเริ่มต้น แผนกที่ไม่มีคิวจะจัดตารางได้ตลอดเวลา</div>'); return; }
      var today = todayStr();
      var dated = rows.filter(function (w) { return w.start_date && w.end_date; });
      var min = dated.length ? Math.min.apply(null, dated.map(function (w) { return dayNo(w.start_date); })) : 0;
      var max = dated.length ? Math.max.apply(null, dated.map(function (w) { return dayNo(w.end_date); })) : 0;
      var span = Math.max(1, max - min + 1);
      $j('#wqOut').html('<div class="card p-0"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr class="small muted"><th class="ps-3">คิว</th><th>สาขาวิชา</th><th>เริ่ม</th><th>สิ้นสุด</th><th>สถานะ</th><th style="min-width:110px">ตำแหน่งช่วงเวลา</th><th></th></tr></thead><tbody>' +
        rows.map(function (w, i) {
          var st = winStatus(w, today), bar = '';
          if (w.start_date && w.end_date) {
            var left = (dayNo(w.start_date) - min) / span * 100, width = Math.max(4, (dayNo(w.end_date) - dayNo(w.start_date) + 1) / span * 100);
            var color = st[0] === 'เปิดอยู่' ? '#198754' : (st[0] === 'รอคิว' ? '#0dcaf0' : '#8a97a6');
            bar = '<div title="' + dmy(w.start_date) + ' – ' + dmy(w.end_date) + '" class="position-absolute top-0 bottom-0 rounded text-white text-center overflow-hidden text-nowrap small" style="left:' + left + '%;width:' + Math.min(width, 100 - left) + '%;background:' + color + ';line-height:24px;font-family:monospace">' + dm(w.start_date) + '-' + dm(w.end_date) + '</div>';
          }
          return '<tr data-id="' + esc(w.id) + '"><td class="ps-3">' + (i + 1) + '</td><td>' + esc(deptName(w.department_id) || '—') + '</td><td class="text-nowrap" style="font-family:monospace">' + dmy(w.start_date) + '</td><td class="text-nowrap" style="font-family:monospace">' + dmy(w.end_date) + '</td><td><span class="badge rounded-pill ' + st[1] + '">' + st[0] + '</span></td>' +
            '<td><div class="position-relative rounded" style="height:24px;background:#e4e8ec">' + bar + '</div></td>' +
            '<td style="min-width:310px"><div class="d-flex flex-wrap gap-1 align-items-center justify-content-end"><div class="d-flex flex-nowrap gap-1"><button class="btn sm" data-a="up"' + (i === 0 ? ' disabled' : '') + ' title="เลื่อนขึ้น">↑</button><button class="btn sm" data-a="down"' + (i === rows.length - 1 ? ' disabled' : '') + ' title="เลื่อนลง">↓</button><button class="btn sm text-nowrap" data-a="open">เปิดก่อนกำหนด</button></div>' +
            '<div class="d-flex flex-nowrap gap-1 align-items-center"><input type="date" class="form-control form-control-sm w-auto wq-s" value="' + esc(w.start_date) + '"><span class="muted">–</span><input type="date" class="form-control form-control-sm w-auto wq-e" value="' + esc(w.end_date) + '"></div><div class="d-flex flex-nowrap gap-1"><button class="btn sm text-nowrap" data-a="save">บันทึกช่วงเวลา</button><button class="btn sm bad" data-a="del">ลบ</button></div></div></td></tr>';
        }).join('') + '</tbody></table></div></div>');
      $j('#wqOut [data-a]').on('click', function () {
        var a = $j(this).data('a'), tr = $j(this).closest('tr'), id = tr.data('id');
        if (a === 'up' || a === 'down') api('windowMove', S.token, id, a === 'up' ? -1 : 1).then(load);
        else if (a === 'open') { if (confirm('เปิดคิวนี้ตั้งแต่วันนี้?')) api('windowOpenNow', S.token, id).then(function () { toast('เปิดคิวแล้ว'); reload(); }); }
        else if (a === 'save') api('windowSave', S.token, id, tr.find('.wq-s').val(), tr.find('.wq-e').val()).then(function () { toast('บันทึกแล้ว'); reload(); });
        else if (a === 'del') { if (confirm('ลบคิวนี้? แผนกจะจัดตารางได้ตลอดเวลาถ้าไม่มีคิวอื่น')) api('windowDelete', S.token, id).then(reload); }
      });
    }
    $j('#wqS').on('change', function () { WQ.sem = this.value; load(); });
    $j('#wqAdd').on('click', function () { api('windowCreateMissing', S.token, WQ.sem).then(function (n) { toast(n ? 'สร้างคิวแล้ว ' + n + ' แผนก' : 'ทุกแผนกมีคิวแล้ว'); reload(); }); });
    load();
  };
})(jQuery);
</script>
