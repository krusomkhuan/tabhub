<style>
  /* Multiple teaching groups share a cell; each card must size to its content. */
  .ot-claim-grid .ss { height: auto; min-height: 40px; }
  .ot-claim-grid td.cell { vertical-align: top; }
  .ot-claim-grid .ot-homeroom { background: #eceef3; color: #334155; }
</style>
<script>
/* ===================== ค่าสอนเกินภาระงาน (ตามระเบียบวิทยาลัยการอาชีพโพนทอง) ===================== */
(function () {
  var i = NAV.map(function (n) { return n.sec; }).indexOf('ข้อมูลพื้นฐาน');
  NAV.splice(i, 0,
    { sec: 'ค่าสอนเกินภาระงาน' },
    { id: 'ot-claims', label: 'เลือกชั่วโมงเบิก', role: 'teacher' },
    { id: 'ot-subs', label: 'สอนแทน / สอนชดเชย', role: 'teacher' },
    { id: 'ot-summary', label: 'สรุปเสนอเบิก', role: 'dept' },
    { id: 'ot-teachers', label: 'กำหนดแบบการเบิกให้ครู', role: 'curriculum' },
    { id: 't-OtSchemes', label: 'ตั้งค่าแบบการเบิก', role: 'curriculum' },
    { id: 't-OtPerHead', label: 'เกณฑ์เบิกรายหัว', role: 'curriculum' },
    { id: 't-OtRounds', label: 'รอบการเบิก', role: 'curriculum' },
    { id: 't-OtBlocked', label: 'ชั่วโมงที่ห้ามเบิก', role: 'curriculum' },
    { id: 'ot-holidays', label: 'วันหยุดของวิทยาลัย', role: 'curriculum' }
  );
})();

var OT = { round: '', dept: '', teacher: '', data: null, sel: {}, ph: {}, scheme: '' };
var LV = Ot.LEVEL_TH;
function money(x) { return Number(x || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function thDate(s) { var p = String(s).slice(0, 10).split('-'); return Number(p[2]) + '/' + Number(p[1]) + '/' + (Number(p[0]) + 543); }
function roundOptions(sel) {
  var rs = sortBy(S.D.OtRounds || [], function (r) { return r.start_date; }).reverse();
  if (!OT.round && rs.length) OT.round = rs[0].id;
  return rs.map(function (r) { return '<option value="' + esc(r.id) + '"' + (String(r.id) === String(sel || OT.round) ? ' selected' : '') + '>' + esc(r.name + ' · ' + semLabel(r.semester_id) + ' (' + thDate(r.start_date) + ' – ' + thDate(r.end_date) + ')') + '</option>'; }).join('');
}
function otTeachers(dept) {
  return sortBy(S.D.Teachers.filter(function (t) { return (!dept || String(t.department_id) === String(dept)); }), function (t) { return t.name; });
}

/* ---------- เลือกชั่วโมงเบิก ---------- */
VIEWS['ot-claims'] = function (el) {
  if (!(S.D.OtRounds || []).length) { el.innerHTML = '<div class="card">ยังไม่มีรอบการเบิก — ผู้ดูแลเพิ่มที่เมนู <a href="#t-OtRounds">รอบการเบิก</a></div>'; return; }
  if (S.me.role === 'teacher') { OT.teacher = S.me.teacher_id; }
  if (S.me.role === 'dept' && !OT.dept) OT.dept = S.me.department_id;
  var tlist = otTeachers(OT.dept);
  el.innerHTML = '<div class="card no-print"><div class="row"><select id="oR" style="width:auto">' + roundOptions() + '</select>' +
    (S.me.role !== 'teacher' ? '<select id="oD" style="width:auto">' + deptOptions(OT.dept) + '</select><select id="oT" style="width:auto;min-width:220px"><option value="">— เลือกครู —</option>' +
      tlist.map(function (t) { return '<option value="' + esc(t.id) + '"' + (String(t.id) === String(OT.teacher) ? ' selected' : '') + '>' + esc(t.name) + (String(t.ot_enabled) === 'true' ? '' : ' (ยังไม่เปิดเบิก)') + '</option>'; }).join('') + '</select>' : '') +
    '</div><div id="oAlerts" class="small" style="margin-top:8px"></div></div><div id="oMain"></div>';
  $('#oR').onchange = function () { OT.round = this.value; loadClaim(); };
  if ($('#oD')) $('#oD').onchange = function () { OT.dept = this.value; OT.teacher = ''; VIEWS['ot-claims'](el); };
  if ($('#oT')) $('#oT').onchange = function () { OT.teacher = this.value; loadClaim(); };
  api('otAlerts', S.token).then(function (a) {
    if (!a.length) return;
    $('#oAlerts').innerHTML = '<span class="tag warn">สอนชดเชยรอแนบรายงานผลการสอน ' + a.length + ' รายการ</span> ' +
      a.slice(0, 6).map(function (x) { return '<span class="' + (x.overdue ? 'tag bad' : 'muted') + '">' + esc(x.teacher) + (x.course ? ' ' + esc(x.course) : '') + ' (ชดเชย ' + thDate(x.date) + ', ครบกำหนด ' + thDate(x.due) + (x.overdue ? ' — เลยกำหนด' : '') + ')</span>'; }).join(' · ') + (a.length > 6 ? ' · และอีก ' + (a.length - 6) + ' รายการ' : '') +
      ' <a href="#ot-subs">จัดการ</a>';
  });
  loadClaim();
};

function loadClaim() {
  var box = $('#oMain'); if (!box) return;
  if (!OT.teacher) { box.innerHTML = '<div class="card muted">เลือกครูเพื่อทำใบเบิก</div>'; return; }
  api('otTeacherData', S.token, OT.round, OT.teacher).then(function (d) {
    OT.data = d;
    OT.sel = {}; OT.ph = {};
    var saved = d.claim && d.claim.weeks || {};
    d.weeks.forEach(function (w) { OT.sel[w.index] = (saved[w.index] && saved[w.index].sel) || {}; OT.ph[w.index] = (saved[w.index] && saved[w.index].ph) || {}; });
    // ชั่วโมงที่ติดวันลา/ห้ามเบิก หรือไม่มีในตารางแล้ว ถูกเอาออกจากการเลือกอัตโนมัติ
    var removed = 0;
    d.weeks.forEach(function (w) {
      var ok = {}; w.items.forEach(function (it) { if (!it.blocked && !it.absent) ok[it.key] = 1; });
      var rm = 0;
      Object.keys(OT.sel[w.index]).forEach(function (k) { if (!ok[k]) { delete OT.sel[w.index][k]; rm++; } });
      w.cleaned = rm; removed += rm;
    });
    OT.scheme0 = (d.claim && d.claim.scheme_id) || (d.schemes[0] && d.schemes[0].id) || '';
    if (removed && !(d.claim && d.claim.status !== 'draft')) {
      var s0 = d.allSchemes.filter(function (s) { return String(s.id) === String(OT.scheme0); })[0];
      if (s0) d.weeks.forEach(function (w) { if (w.cleaned) OT.sel[w.index] = Ot.autoSelect(w.items, s0, d.cap); });
    }
    if (removed && !(d.claim && d.claim.status !== 'draft')) toast('เอาชั่วโมงที่ติดวันลา/วันหยุด/ห้ามเบิกออก ' + removed + ' ชม. และเลือกใหม่อัตโนมัติในสัปดาห์นั้น — กรุณาตรวจ');
    OT.scheme = (d.claim && d.claim.scheme_id) || (d.schemes[0] && d.schemes[0].id) || '';
    if (!d.claim && OT.scheme) d.weeks.forEach(function (w) { OT.sel[w.index] = Ot.autoSelect(w.items, schemeObj(), d.cap); });
    renderClaim();
  });
}

function schemeObj() { var d = OT.data; return d.allSchemes.filter(function (s) { return String(s.id) === String(OT.scheme); })[0]; }
function weekEval(w) {
  var sch = schemeObj(); if (!sch) return null;
  return Ot.evalWeek(w.items, OT.sel[w.index] || {}, OT.ph[w.index] || {}, sch, OT.data.cap, { subQuota: w.subQuota, perHead: OT.data.perHead, courses: IDX.Courses, refAmount: OT.data.refAmount });
}

function otSignatureName(name) {
  var text = String(name || '').trim(), match = text.match(/^(ว่าที่[ \t]*ร้อยโท)[ \t]*/);
  return { prefix: match ? 'ว่าที่ร้อยโท' : '', name: match ? text.slice(match[0].length).trim() : text };
}

/** แบบฟอร์มใบเบิกสำหรับพิมพ์ (A4 แนวตั้ง) ใช้ผลคำนวณชุดเดียวกับหน้าจอเลือกชั่วโมง
 *  หน้า 1 = แบบสรุปค่าสอนพิเศษและค่าตอบแทน (ทั้งรอบ) ต่อด้วยใบเบิกเงินค่าสอนพิเศษ สัปดาห์ที่ 1…n สัปดาห์ละหน้า */
function claimPrintHtml(d, sch, evaluated) {
  var st = S.settings, t = d.teacher, college = st.college_name || '';
  var sem = IDX.Semesters[d.round.semester_id] || IDX.Semesters[S.sem] || {};
  var semText = sem.term ? sem.term + '/' + sem.year : semLabel(S.sem);
  var dept = deptName(t.department_id), head = Grid.deptHead(S.D.Teachers || [], t.department_id);
  var months = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
  var longDate = function (date) { var p = String(date || '').slice(0, 10).split('-'); return p.length === 3 ? Number(p[2]) + ' ' + months[Number(p[1]) - 1] + ' ' + (Number(p[0]) + 543) : '........................'; };
  var num = function (v) { return v ? Number(v).toLocaleString('th-TH', { maximumFractionDigits: 2 }) : '-'; };
  var rate = function (l) { return Number(sch && sch.levels[l] && sch.levels[l].rate || 0); };
  var times = Grid.periodTimes(st), dot = function (x) { return String(x || '').replace(':', '.'); };
  var line = '..............................................';
  var dateLine = '<div class="otf-date">........./........../..........</div>';
  // ลงชื่อแบบ "ลงชื่อ" ชิดเส้นจุด ชื่อ/ตำแหน่งกึ่งกลางใต้เส้นจุด (เหมือนงบหน้า)
  var sign = function (name, role, tail) {
    var p = otSignatureName(name);
    return '<div class="otf-sign"><span class="cv-sig"><span class="cv-sig-label">ลงชื่อ' + (p.prefix ? ' ' + esc(p.prefix) : '') + '&nbsp;</span><span class="cv-sig-body">' + (name && window.Sig ? Sig.slot(name) : '') + line + (tail ? ' ' + tail : '') +
      '<span class="cv-sig-under">(' + esc(p.name || line) + ')' + (role ? '<br>' + role : '') + '</span></span></span></div>';
  };
  // ฉบับร่างเหมือนเดิม: ยังไม่ล็อก แก้หลังบันทึก หรือยังผิดกติกา
  var errors = 0; evaluated.forEach(function (x) { errors += x.result.errors.length; });
  var changed = String(d.claim && d.claim.scheme_id || '') !== String(OT.scheme);
  if (d.claim) d.weeks.forEach(function (w) {
    var saved = (d.claim.weeks || {})[w.index] || {};
    function same(a, b) { var keys = Object.keys(a || {}), other = Object.keys(b || {}); return keys.length === other.length && keys.every(function (k) { return a[k] === b[k]; }); }
    if (!same(saved.sel, OT.sel[w.index]) || !same(saved.ph, OT.ph[w.index])) changed = true;
  });
  var draft = !d.claim || d.claim.status === 'draft' || changed || errors > 0;
  var draftBox = draft ? '<div class="receipt-draft">ฉบับร่าง — ยังไม่ได้ยืนยันล็อกการเบิก ตัวเลขอาจเปลี่ยนได้' + (errors ? ' · มีรายการที่ยังไม่ผ่านกติกา' : '') + '</div>' : '';
  var phRule = function (w, it) { return (OT.ph[w.index] || {})[it.course_id + '|' + it.group_id] ? Ot.perHeadRule(it, d.perHead, IDX.Courses[it.course_id]) : null; };
  var valid = function (it) { return !it.blocked && !it.absent; };
  var LEVEL_FULL = { vc: 'ประกาศนียบัตรวิชาชีพ (ปวช.)', vs: 'ประกาศนียบัตรวิชาชีพชั้นสูง (ปวส.)', bd: 'ปริญญาตรี' };

  // ---------- แบบสรุป (ทั้งรอบ) ----------
  var paid = {}, phHours = 0, phAmount = 0, total = 0, courses = {}, order = [];
  Ot.LEVELS.forEach(function (l) { paid[l] = 0; });
  evaluated.forEach(function (x) {
    var r = x.result, w = x.week;
    total += Number(r.amount) || 0; phAmount += Number(r.perHeadAmount) || 0;
    Ot.LEVELS.forEach(function (l) { paid[l] += Number(r.paid[l]) || 0; phHours += Number((r.byLevel[l] || {}).perhead) || 0; });
    w.items.forEach(function (it) {
      if ((OT.sel[w.index] || {})[it.key] !== 'C' || !valid(it) || it.no_claim) return;
      var c = courses[it.course_id];
      if (!c) { c = courses[it.course_id] = { theory: 0, practice: 0 }; order.push(it.course_id); }
      c[it.kind === 'practice' ? 'practice' : 'theory']++;
    });
  });
  var levelsUsed = Ot.LEVELS.filter(function (l) { return paid[l] || (l !== 'bd' && sch && sch.levels[l] && sch.levels[l].enabled); });
  var courseHours = order.reduce(function (a, id) { return a + courses[id].theory + courses[id].practice; }, 0);
  var paidHours = Ot.LEVELS.reduce(function (a, l) { return a + paid[l]; }, 0) + phHours;

  var summary = '<div class="otf-page otf-summary">' + draftBox +
    '<h2>แบบสรุปค่าสอนพิเศษและค่าตอบแทน</h2><h2>ประจำภาคเรียน ' + esc(semText) + '</h2>' +
    '<p>เรียน &nbsp;ผู้อำนวยการ' + esc(college) + '</p>' +
    '<p class="otf-ind">ข้าพเจ้า ' + esc(t.name) + ' ตำแหน่ง ' + esc(t.position || '.........................') + ' แผนกวิชา' + esc(dept) + ' ขอเบิกค่าสอนพิเศษและค่าตอบแทน ตั้งแต่วันที่ ' + longDate(d.round.start_date) + ' ถึงวันที่ ' + longDate(d.round.end_date) +
    ' ในภาคเรียนที่ ' + esc(sem.term || '') + ' ปีการศึกษา ' + esc(sem.year || '') + ' ดังรายวิชาต่อไปนี้</p>' +
    '<table class="otf-list">' + (order.length ? order.map(function (id, i) {
      var c = courses[id], co = courseOf(id);
      return '<tr><td class="otf-lbl">' + (i ? '' : 'ในรายวิชา') + '</td><td>' + esc(co.name) + '</td><td>ทฤษฎี</td><td class="otf-n">' + c.theory + '</td><td>ชั่วโมง</td><td>ปฏิบัติ</td><td class="otf-n">' + c.practice + '</td><td>ชั่วโมง</td></tr>';
    }).join('') : '<tr><td class="otf-lbl">ในรายวิชา</td><td colspan="7">-</td></tr>') +
    '<tr><td></td><td colspan="5" class="text-end">รวมจำนวนเบิก</td><td class="otf-n">' + courseHours + '</td><td>ชั่วโมง</td></tr></table>' +
    '<table class="otf-list">' + levelsUsed.map(function (l) {
      return '<tr><td>เบิกระดับ ' + LEVEL_FULL[l] + ' จำนวน</td><td class="otf-n">' + num(paid[l]) + '</td><td>ชั่วโมง อัตราชั่วโมงละ</td><td class="otf-n">' + num(rate(l)) + '</td><td>บาท =</td><td class="otf-n">' + money(paid[l] * rate(l)) + '</td><td>บาท</td></tr>';
    }).join('') +
    (phHours ? '<tr><td>เบิกรายหัว จำนวน</td><td class="otf-n">' + phHours + '</td><td colspan="3">ชั่วโมง</td><td class="otf-n">' + money(phAmount) + '</td><td>บาท</td></tr>' : '') +
    '<tr class="otf-bold"><td colspan="5">รวมเป็นเงิน (' + esc(Ot.bahtText(total)) + ')</td><td class="otf-n">' + money(total) + '</td><td>บาท</td></tr></table>' +
    (paidHours !== courseHours ? '<p class="otf-note">หมายเหตุ: ชั่วโมงที่จ่ายจริง ' + paidHours + ' ชั่วโมง (ตัดตามเพดาน/กติกาของแบบการเบิก)</p>' : '') +
    '<div class="otf-right">' + sign(t.name, '', 'ผู้ขอเบิก') + dateLine + '</div>' +
    '<div class="otf-opinions">' +
    '<div><b>1. ความเห็นหัวหน้างานพัฒนาหลักสูตรและการจัดการเรียนรู้</b><div class="otf-ind">ได้ตรวจสอบแล้วมีความถูกต้องเห็นควรอนุมัติ</div>' + sign(st.signer_curriculum, 'หัวหน้างานพัฒนาหลักสูตรและการจัดการเรียนรู้') + dateLine + '</div>' +
    '<div><b>2. ความเห็นรองผู้อำนวยการฝ่ายวิชาการ</b><div class="otf-ind">(&nbsp;&nbsp;&nbsp;) เห็นควรอนุมัติ &nbsp;&nbsp;(&nbsp;&nbsp;&nbsp;) ไม่เห็นควรอนุมัติ</div>' + sign(st.signer_deputy, 'รองผู้อำนวยการฝ่ายวิชาการ') + dateLine + '</div>' +
    '<div><b>3. รองผู้อำนวยการฝ่ายบริหารทรัพยากร</b><div class="otf-ind">(&nbsp;&nbsp;&nbsp;) เห็นควรอนุมัติ &nbsp;&nbsp;(&nbsp;&nbsp;&nbsp;) ไม่เห็นควรอนุมัติ</div>' + sign(st.signer_admin_deputy, 'รองผู้อำนวยการฝ่ายบริหารทรัพยากร') + dateLine + '</div>' +
    '<div><b>4. ผู้อนุมัติ</b><div class="otf-ind">(&nbsp;&nbsp;&nbsp;) อนุมัติ &nbsp;&nbsp;(&nbsp;&nbsp;&nbsp;) ไม่อนุมัติ</div>' + sign(st.signer_director, 'ผู้อำนวยการ' + esc(college)) + dateLine + '</div></div>' +
    '<div class="otf-two"><div><p>ผู้รับเงิน ได้รับเงินค่าปฏิบัติการสอนพิเศษ รวมจำนวน ' + money(total) + ' บาท</p>' + sign(t.name, '', 'ผู้รับเงิน') + '</div>' +
    '<div><p>ผู้จ่ายเงิน ได้จ่ายเงินถูกต้องแล้ว</p>' + sign(st.signer_finance, 'หัวหน้างานการเงิน') + dateLine + '</div></div>' +
    // กรรมการตรวจสอบเอกสาร อยู่ล่างสุดของหน้าแรก
    '<div class="receipt-committee">' + ['ประธานกรรมการ', 'เลขานุการ'].map(function (role) {
      return '<div><span class="cv-sig"><span class="cv-sig-label">ลงชื่อ&nbsp;</span><span class="cv-sig-body">' + line + '<span class="cv-sig-under">(' + line + ')<br>' + role + '</span></span></span></div>';
    }).join('') + '</div></div>';

  // ---------- ใบเบิกรายสัปดาห์ ----------
  var days = String(st.days || '0,1,2,3,4').split(',').map(Number);
  var weeks = evaluated.map(function (x) {
    var w = x.week, r = x.result, sel = OT.sel[w.index] || {};
    // คาบติดกันของวิชา/กลุ่มเดียวกันในวันเดียวกัน = 1 แถว
    var items = w.items.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.period - b.period; });
    var rows = [];
    items.forEach(function (it) {
      var last = rows[rows.length - 1];
      if (last && last.date === it.date && last.course_id === it.course_id && last.group_id === it.group_id && last.to === it.period - 1 && last.sub === it.sub) { last.to = it.period; last.items.push(it); return; }
      rows.push({ date: it.date, course_id: it.course_id, group_id: it.group_id, sub: it.sub, from: it.period, to: it.period, items: [it] });
    });
    var sum = { vc: 0, vs: 0, claim: 0, money: 0 }, taughtLv = {}, byDate = {};
    rows.forEach(function (row) { (byDate[row.date] = byDate[row.date] || []).push(row); });
    var body = w.dates.filter(function (date) { return days.indexOf(Ot.dow(Ot.parse(date))) >= 0 && byDate[date]; }).map(function (date) {
      var list = byDate[date];
      return list.map(function (row, i) {
        var it0 = row.items[0], co = courseOf(row.course_id), load = { vc: 0, vs: 0 }, claim = 0, amount = 0, notes = [], rt = 0;
        row.items.forEach(function (it) {
          var v = sel[it.key] || '';
          if (it.absent) { notes.push(it.absent); return; }
          taughtLv[it.level] = true;
          if (it.blocked) notes.push('ห้ามเบิก: ' + it.blocked);
          if (v === 'L' && !it.blocked) load[it.level === 'vc' ? 'vc' : 'vs']++;
          if (v === 'C' && valid(it) && !it.no_claim) {
            var ph = phRule(w, it);
            claim++; rt = ph ? Number(ph.rate_per_head || 0) : rate(it.level); amount += rt;

function renderClaim() {
  var d = OT.data, box = $('#oMain'), sch = schemeObj();
  var locked = d.claim && d.claim.status !== 'draft';
  var canEdit = !locked && can('dept');
  var t = d.teacher;
  var comp = d.schemes.map(function (s) {
    var amt = 0; d.weeks.forEach(function (w) { var r = Ot.evalWeek(w.items, Ot.autoSelect(w.items, s, d.cap), {}, s, d.cap, { subQuota: w.subQuota, perHead: d.perHead, courses: IDX.Courses, refAmount: d.refAmount }); amt += r.errors.length ? 0 : r.amount; });
    return { s: s, amt: amt };
  });
  var best = comp.filter(function (c) { return c.s.cap_method !== 'free'; }).sort(function (a, b) { return b.amt - a.amt; })[0];
  var total = { h: 0, a: 0, err: 0 }, evaluated = [];
  var weeksHtml = d.weeks.map(function (w) {
    var r = weekEval(w) || { errors: [], warnings: [], byLevel: {}, amount: 0, claimHours: 0, paid: {} };
    total.h += r.claimHours; total.a += r.amount; total.err += r.errors.length;
    evaluated.push({ week: w, result: r });
    return weekHtml(w, r, canEdit);
  }).join('');
  box.innerHTML = '<div class="ot-claim-editor no-print"><div class="card"><div class="row"><div class="grow"><h3 style="margin:0">' + esc(t.name) + '</h3><div class="small muted">' + esc(t.position || '') + ' · ' + esc(Ot.EMPLOY_TH[t.employment] || 'ไม่ระบุสถานะการจ้าง') +
    (String(t.is_unit_head) === 'true' ? ' · หัวหน้างาน' : '') + ' · เพดานรายบุคคล ' + d.cap + ' ชม./สัปดาห์' + (d.capNote ? ' (' + esc(d.capNote) + ')' : '') + '</div></div>' +
    (locked ? '<span class="tag ok">ล็อกแล้ว · ' + esc(d.claim.locked_by || '') + '</span>' + (can('curriculum') ? ' <button class="btn sm" id="oUnlock">ปลดล็อก</button>' : '') : '<span class="tag">ฉบับร่าง</span>') + '</div>' +
    (String(t.ot_enabled) !== 'true' ? '<p class="tag bad">ครูคนนี้ยังไม่เปิดสิทธิ์เบิก — ผู้ดูแลตั้งที่เมนู กำหนดแบบการเบิกให้ครู</p>' : '') +
    (!d.schemes.length ? '<p class="tag bad">ยังไม่ได้กำหนดแบบการเบิกให้ครูคนนี้</p>' :
      '<div class="row" style="margin-top:10px"><label class="small">แบบการเบิก</label><select id="oS" style="width:auto"' + (canEdit ? '' : ' disabled') + '>' + d.schemes.map(function (s) {
        return '<option value="' + esc(s.id) + '"' + (String(s.id) === String(OT.scheme) ? ' selected' : '') + '>' + esc(s.name) + '</option>';
      }).join('') + '</select>' +
      '<span class="small muted">เทียบแบบ (เลือกอัตโนมัติ): ' + comp.map(function (c) { return esc(c.s.name) + ' ' + money(c.amt) + ' บ.' + (best && c === best ? ' ★ได้มากที่สุด' : ''); }).join(' · ') + '</span></div>' +
      (sch ? '<div class="small muted" style="margin-top:4px">' + Ot.LEVELS.filter(function (l) { return sch.levels[l].enabled; }).map(function (l) { var L = sch.levels[l]; return LV[l] + ': ภาระ ' + L.load + ' · เบิก ' + L.min + '–' + L.max + ' · ' + L.rate + ' บาท/ชม.'; }).join(' | ') +
        ' · เพดานรวม ' + sch.total_cap + ' · ' + esc(Ot.METHOD_TH[sch.cap_method] || sch.cap_method) + '</div>' : '')) +
    '<div class="row" style="margin-top:12px"><b class="grow">รวมทั้งรอบ: เบิก ' + total.h + ' ชม. · ' + money(total.a) + ' บาท</b>' +
    (total.err ? '<span class="tag bad">ยังผิดกติกา ' + total.err + ' ข้อ</span>' : '<span class="tag ok">ผ่านกติกา</span>') +
    (canEdit ? '<button class="btn sm" id="oAuto">เลือกอัตโนมัติทุกสัปดาห์</button><button class="btn sm" id="oSave">บันทึก</button><button class="btn pri sm" id="oLock">ยืนยันและล็อกการเบิก</button>' : '') +
    '<button class="btn sm" onclick="window.print()">🖨 พิมพ์</button></div>' +
    '<div class="small muted" style="margin-top:6px">คลิกชั่วโมงเพื่อสลับ: ไม่ใช้ → <span class="tag ok">ภาระ</span> → <span class="tag">เบิก</span> · สีเทา = ห้ามเบิก · ขีดฆ่า = ลา/ไปราชการ/หยุด (ภาระไม่ลดลง) · ⚠ = สอนชดเชยรอรายงาน · ชดเชย ✓ = รายงานผลแล้ว นับชั่วโมงที่คาบเดิม</div></div>' +
    absenceCard(d, canEdit) + weeksHtml + '</div>' + claimPrintHtml(d, sch, evaluated);
  if ($('#oS')) $('#oS').onchange = function () { OT.scheme = this.value; renderClaim(); };
  if ($('#oAuto')) $('#oAuto').onclick = function () { d.weeks.forEach(function (w) { OT.sel[w.index] = Ot.autoSelect(w.items, schemeObj(), d.cap); }); renderClaim(); };
  if ($('#oSave')) $('#oSave').onclick = function () { saveClaim(false); };
  if ($('#oLock')) $('#oLock').onclick = function () { if (confirm('ยืนยันและล็อกใบเบิก? หลังล็อกจะแก้ไขไม่ได้ (ผู้ดูแลปลดล็อกได้)')) saveClaim(true); };
  if ($('#oUnlock')) $('#oUnlock').onclick = function () { api('otUnlockClaim', S.token, OT.round, OT.teacher).then(loadClaim); };
  if (canEdit) bindClaim();
  bindAbsence();
}

function weekHtml(w, r, canEdit) {
  var n = Number(S.settings.periods_per_day || 12);
  var days = String(S.settings.days || '0,1,2,3,4').split(',').map(Number);
  var locks = Grid.lockedMap(S.D.LockedSlots || [], days);
  var teacherId = String((OT.data.teacher || {}).id || OT.teacher || '');
  var advisees = (S.D.Groups || []).filter(function (g) { return teacherId && String(g.advisor_id) === teacherId; })
    .map(function (g) { return groupCode(g.id); }).sort(function (a, b) { return a.localeCompare(b, 'th', { numeric: true }); });
  var byCell = {};
  w.items.forEach(function (it) { (byCell[it.date + '|' + it.period] = byCell[it.date + '|' + it.period] || []).push(it); });
  var h = '<div class="card page"><div class="row" style="margin-bottom:6px"><h3 class="grow" style="margin:0">สัปดาห์ที่ ' + w.index + ' <span class="small muted">' + thDate(w.dates[0]) + ' – ' + thDate(w.dates[w.dates.length - 1]) + '</span></h3>';
  if (canEdit) h += '<button class="btn sm" data-wauto="' + w.index + '">อัตโนมัติ</button>' +
    (w.index > 1 ? '<button class="btn sm" data-wcopy="' + w.index + '">ใช้ตามสัปดาห์ที่ ' + (w.index - 1) + '</button>' : '') +
    '<button class="btn sm" data-wall="' + w.index + '">คัดลอกไปทุกสัปดาห์ที่เหลือ</button><button class="btn sm" data-wclr="' + w.index + '">ล้าง</button>';
  h += '</div><div class="tt-wrap"><table class="tt ot-claim-grid"><thead><tr><th style="width:110px">วันที่</th>';
  for (var p = 1; p <= n; p++) h += '<th>' + Grid.periodNo(S.settings, p) + '</th>';
  h += '</tr></thead><tbody>';
  w.dates.forEach(function (date) {
    var day = Ot.dow(Ot.parse(date)); if (days.indexOf(day) < 0) return;
    h += '<tr><td class="day">' + esc(S.days[day]) + '<br><span class="small muted">' + thDate(date) + '</span></td>';
    for (var p = 1; p <= n; p++) {
      var its = byCell[date + '|' + p] || [];
      var homeRoom = !its.length && advisees.length && /โฮมรูม|home\s*room/i.test(locks[day + '-' + p] || '');
      // Informational only: do not create a teaching item or a selectable claim key.
      h += '<td class="cell" style="height:46px">' + (homeRoom ? '<div class="ss ot-homeroom"><b>โฮมรูม</b><span>' + esc(advisees.join(', ')) + '</span><span>ไม่ใช้เลือกชั่วโมงเบิก</span></div>' : '') + its.map(function (it) {
        var v = (OT.sel[w.index] || {})[it.key] || '';
        var bg = it.blocked ? '#eceef3' : it.absent ? '#fde8e8' : v === 'L' ? '#dff5e3' : v === 'C' ? '#2457d6' : '#fff';
        var fg = v === 'C' && !it.blocked && !it.absent ? '#fff' : '#1d2433';
        var c = courseOf(it.course_id);
        var tip = c.code + ' ' + c.name + ' · ' + groupCode(it.group_id) + ' · ' + LV[it.level] + (it.blocked ? ' · ' + it.blocked : '') + (it.absent ? ' · ' + it.absent : '') + (it.sub ? ' · ' + (it.sub === 'sub' ? 'สอนแทน' : 'สอนชดเชย') : '') + (it.pending ? ' · ' + it.pending : '') + (it.no_claim ? ' · ' + it.no_claim : '') + (it.made_up ? ' · สอนชดเชยแล้ว ' + thDate(it.made_up) + ' (รายงานผลแล้ว) นับชั่วโมงที่คาบนี้' : '');
        return '<div class="ss" data-w="' + w.index + '" data-key="' + esc(it.key) + '" title="' + esc(tip) + '" style="min-height:40px;cursor:' + (canEdit && !it.blocked && !it.absent ? 'pointer' : 'default') + ';background:' + bg + ';color:' + fg + ';border:1px solid #cfd5e2;' + (it.absent ? 'text-decoration:line-through;' : '') + '">' +
          '<b>' + esc(c.code) + '</b><span>' + esc(groupCode(it.group_id)) + (it.sub ? ' · ' + (it.sub === 'sub' ? 'แทน' : 'ชดเชย') : '') + (it.made_up ? ' · ชดเชย ✓' : '') + (it.pending ? ' ⚠' : '') + (it.no_claim ? ' · ภาระงานเท่านั้น' : '') + '</span></div>';
      }).join('') + '</td>';
    }
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  // เบิกรายหัว
  var phCands = {};
  w.items.forEach(function (it) { if (Ot.perHeadRule(it, OT.data.perHead, IDX.Courses[it.course_id])) phCands[it.course_id + '|' + it.group_id] = it; });
  var phKeys = Object.keys(phCands);
  if (phKeys.length) h += '<div class="small" style="margin-top:6px"><b>เบิกรายหัว</b> (นักเรียนน้อยกว่าเกณฑ์): ' + phKeys.map(function (k) {
    var it = phCands[k], rule = Ot.perHeadRule(it, OT.data.perHead, IDX.Courses[it.course_id]);
    return '<label class="row" style="display:inline-flex;gap:4px;margin-right:12px"><input type="checkbox" style="width:auto" data-ph="' + w.index + '" data-phk="' + esc(k) + '"' + ((OT.ph[w.index] || {})[k] ? ' checked' : '') + (canEdit ? '' : ' disabled') + '>' +
      esc(courseOf(it.course_id).code + ' ' + groupCode(it.group_id)) + ' (' + it.students + ' คน · ' + rule.rate_per_head + ' บ./ชม. ทั้งกลุ่ม)</label>';
  }).join('') + '</div>';
  // สรุป
  var sch = schemeObj();
  h += '<div class="row small" style="margin-top:8px;gap:14px">' + Ot.LEVELS.filter(function (l) { return sch && sch.levels[l].enabled || (r.byLevel[l] && r.byLevel[l].taught); }).map(function (l) {
    var B = r.byLevel[l] || {}; return '<span><b>' + LV[l] + '</b> สอน ' + (B.taught || 0) + ' · ภาระ ' + (B.load || 0) + (sch ? '/' + sch.levels[l].load : '') + ' · เบิก ' + ((B.claim || 0) + (B.perhead || 0)) + (r.paid && r.paid[l] !== (B.claim || 0) ? ' (จ่าย ' + r.paid[l] + ')' : '') + '</span>';
  }).join('') + '<span class="grow"></span><b>เบิก ' + r.claimHours + ' ชม. · ' + money(r.amount) + ' บาท</b></div>';
  if (r.errors.length) h += '<ul class="problems small">' + r.errors.map(function (e) { return '<li class="hard">' + esc(e) + '</li>'; }).join('') + '</ul>';
  if (r.warnings.length) h += '<ul class="problems small">' + r.warnings.map(function (e) { return '<li class="soft">' + esc(e) + '</li>'; }).join('') + '</ul>';
  return h + '</div>';

function bindClaim() {
  var d = OT.data;
  $$('#oMain .ss[data-key]').forEach(function (div) {
    div.onclick = function () {
      var w = d.weeks.filter(function (x) { return String(x.index) === div.dataset.w; })[0];
      var it = w.items.filter(function (x) { return x.key === div.dataset.key; })[0];
      if (it.blocked || it.absent) return toast(it.blocked ? 'ชั่วโมงห้ามเบิก: ' + it.blocked : 'ไม่นับ: ' + it.absent, 1);
      var m = OT.sel[w.index] = OT.sel[w.index] || {};
      m[it.key] = !m[it.key] ? 'L' : m[it.key] === 'L' && !it.no_claim ? 'C' : '';
      if (!m[it.key]) delete m[it.key];
      renderClaimKeepScroll();
    };
  });
  $$('[data-ph]').forEach(function (c) { c.onchange = function () { var m = OT.ph[c.dataset.ph] = OT.ph[c.dataset.ph] || {}; if (c.checked) m[c.dataset.phk] = true; else delete m[c.dataset.phk]; renderClaimKeepScroll(); }; });
  $$('[data-wauto]').forEach(function (b) { b.onclick = function () { var w = d.weeks[Number(b.dataset.wauto) - 1]; OT.sel[w.index] = Ot.autoSelect(w.items, schemeObj(), d.cap); renderClaimKeepScroll(); }; });
  $$('[data-wclr]').forEach(function (b) { b.onclick = function () { OT.sel[b.dataset.wclr] = {}; renderClaimKeepScroll(); }; });
  $$('[data-wcopy]').forEach(function (b) { b.onclick = function () { var i = Number(b.dataset.wcopy); copyWeek(i - 1, i); renderClaimKeepScroll(); }; });
  $$('[data-wall]').forEach(function (b) { b.onclick = function () { var i = Number(b.dataset.wall); d.weeks.forEach(function (w) { if (w.index > i) copyWeek(i, w.index); }); renderClaimKeepScroll(); }; });
}

/** คัดลอกการเลือกตาม (วัน, คาบ, คาบเรียนเดียวกัน) ข้ามชั่วโมงที่ตารางไม่ตรง/ติดวันหยุด */
function copyWeek(from, to) {
  var d = OT.data, wf = d.weeks[from - 1], wt = d.weeks[to - 1], src = OT.sel[from] || {}, out = {};
  var pat = {}; wf.items.forEach(function (it) { if (src[it.key]) pat[it.day + '|' + it.period + '|' + it.session_id] = src[it.key]; });

  if (!selected) return [];
  return rows.filter(function (r) {
    return r.status !== 'cancelled' && r.status !== 'deleted' &&
      r.type === selected.type && String(r.round_id || '') === String(selected.round_id || '') &&
      String(r.original_teacher_id) === String(selected.original_teacher_id) &&
      String(r.teacher_id) === String(selected.teacher_id) &&
      String(r.reason || '') === String(selected.reason || '') && String(r.note || '') === String(selected.note || '');
  }).sort(function (a, b) {

    var head = Grid.deptHead(S.D.Teachers, dept);
    $('#smOut').className = '';
    $('#smOut').innerHTML = '<div class="page"><h2>ใบสรุปเสนอเบิกค่าสอนเกินภาระงาน</h2><div class="sub">' + esc(s.college_name) + ' · ' + (all ? 'ทุกแผนกวิชา' : 'แผนกวิชา' + esc(deptName(dept))) + ' · ' + esc(round.name) + ' ภาคเรียนที่ ' + esc(semLabel(round.semester_id)) + ' (' + thDate(round.start_date) + ' – ' + thDate(round.end_date) + ')</div>' +
      (r.notLocked.length ? '<p class="tag warn no-print">ยังไม่ล็อกใบเบิก: ' + esc(r.notLocked.join(', ')) + ' — ใบสรุปนับเฉพาะใบที่ล็อกแล้ว</p>' : '') +
      (r.submission ? '<p class="tag ok">เสนอเบิกแล้ว ' + esc(r.submission.created_at) + ' โดย ' + esc(r.submission.created_by) + (r.submission.note ? ' · ' + esc(r.submission.note) : '') + '</p>' : '') +
      '<table class="data"><thead><tr><th>ที่</th><th>ชื่อ-สกุล</th>' + (all ? '<th>แผนกวิชา</th>' : '') + '<th>ตำแหน่ง</th><th>แบบการเบิก</th><th style="text-align:right">ปวช. (ชม.)</th><th style="text-align:right">ปวส. (ชม.)</th><th style="text-align:right">รายหัว (บาท)</th><th style="text-align:right">รวม (ชม.)</th><th style="text-align:right">จำนวนเงิน (บาท)</th><th class="no-print">สถานะ</th></tr></thead><tbody>' +
      r.rows.filter(function (x) { return x.status === 'locked'; }).map(function (x, i) {
        return '<tr><td>' + (i + 1) + '</td><td>' + esc(x.name) + '</td>' + (all ? '<td>' + esc(x.department_name) + '</td>' : '') + '<td>' + esc(x.position) + '</td><td class="small">' + esc(x.scheme) + '</td><td style="text-align:right">' + x.vc + '</td><td style="text-align:right">' + x.vs + '</td><td style="text-align:right">' + money(x.perHeadAmount) +
          '</td><td style="text-align:right">' + x.hours + '</td><td style="text-align:right">' + money(x.amount) + '</td><td class="no-print"><span class="tag ok">ล็อกแล้ว</span></td></tr>';
      }).join('') +
      '<tr><td colspan="' + (all ? 9 : 8) + '" style="text-align:right"><b>รวมเป็นเงินทั้งสิ้น</b></td><td style="text-align:right"><b>' + money(r.total) + '</b></td><td class="no-print"></td></tr>' +
      '<tr><td colspan="' + (all ? 11 : 10) + '" style="text-align:center">(' + esc(r.totalText) + ')</td></tr></tbody></table>' +
      (all ? '<h3 style="margin-top:20px">ยอดรวมรายแผนกวิชา</h3><table class="data"><thead><tr><th>แผนกวิชา</th><th>ใบเบิกที่ล็อกแล้ว</th><th>รวมชั่วโมง</th><th>จำนวนเงิน (บาท)</th></tr></thead><tbody>' + (r.departments || []).map(function (d) { return '<tr><td>' + esc(d.department_name) + '</td><td>' + d.locked_count + '</td><td>' + d.hours + '</td><td>' + money(d.amount) + '</td></tr>'; }).join('') + '<tr><td colspan="3"><b>รวมทั้งวิทยาลัย</b></td><td><b>' + money(r.total) + '</b></td></tr></tbody></table>' : '') +
      '<div class="signs">' + sign(s.signer_curriculum, 'หัวหน้างานพัฒนาหลักสูตรและการจัดการเรียนรู้') + (all ? '' : sign(head && head.name, esc(Grid.deptHeadTitle(deptName(dept))))) + '</div>' +
      '<div class="signs">' + sign(s.signer_deputy, 'ผู้รับรอง<br>รองผู้อำนวยการฝ่ายวิชาการ') + sign(s.signer_finance, 'ผู้รับรอง<br>หัวหน้างานการเงิน') + sign(s.signer_admin_deputy, 'ผู้รับรอง<br>รองผู้อำนวยการฝ่ายบริหารทรัพยากร') + '</div>' +
      '<div class="signs">' + sign(s.signer_director, 'ผู้อนุมัติ<br>ผู้อำนวยการวิทยาลัย') + '</div></div>';
    if (can('curriculum') && all) $('#smAct').innerHTML = '<span class="small muted">เลือกแผนกวิชาเพื่อบันทึกเสนอเบิก</span>';
    if (can('curriculum') && !all) {
      $('#smAct').innerHTML = r.submission ? '<button class="btn bad" id="smCancel">ยกเลิกการเสนอเบิก</button>' : '<button class="btn" id="smSubmit">บันทึกเสนอเบิก</button>';
      if ($('#smSubmit')) $('#smSubmit').onclick = function () { var note = prompt('หมายเหตุ (เช่น เลขที่หนังสือ)', ''); if (note === null) return; api('otSubmit', S.token, OT.round, dept, note, false).then(function () { VIEWS['ot-summary'](el); }); };
      if ($('#smCancel')) $('#smCancel').onclick = function () { if (confirm('ยกเลิกการเสนอเบิก เพื่อส่งกลับให้แก้ไข?')) api('otSubmit', S.token, OT.round, dept, '', true).then(function () { VIEWS['ot-summary'](el); }); };
    }
  });
};

/* ---------- กำหนดแบบการเบิกให้ครู ---------- */
VIEWS['ot-teachers'] = function (el) {
  var schemes = sortBy(S.D.OtSchemes || [], function (s) { return (s.sort || 99) + s.name; });
  var dept = OT.dept || '';
  var list = otTeachers(dept);
  var capDate = ((IDX.OtRounds || {})[OT.round] || {}).start_date || null;
  el.innerHTML = '<div class="card"><div class="row" style="margin-bottom:10px"><select id="otD" style="width:auto">' + deptOptions(dept) + '</select><span class="grow"></span>' +
    '<button class="btn sm" id="otSug">แนะนำแบบการเบิกอัตโนมัติ</button></div>' +
    '<p class="small muted">แนะนำตามสถานะการจ้าง · หน้าที่หัวหน้างาน · ระดับที่สอนในภาคเรียนนี้ — ตรวจก่อนบันทึก · ครูอัตราจ้างต้องใส่ "วันเริ่มงาน" เพื่อคิดเพดาน 6/7/8 ชม. ตามอายุงาน</p>' +
    '<p class="small muted" style="margin:0">เปิดเบิกแล้ว ' + list.filter(function (t) { return String(t.ot_enabled) === 'true'; }).length + ' จาก ' + list.length + ' คน · เลือกชื่อครูเพื่อกำหนดแบบการเบิก</p></div>' +
    teacherCards(list, function (t, icon, role) {
      var on = String(t.ot_enabled) === 'true', schemes = Sched.ids(t.ot_scheme_ids).map(function (id) { return nm('OtSchemes', id); }).filter(Boolean);
      // คาบเบิกได้ต่อสัปดาห์ — คิดแบบเดียวกับ ot_personal_cap (ณ วันเริ่มรอบการเบิก)
      var pc = Ot.personalCap(t, S.settings || {}, capDate);
      var tags = '<span class="tag' + (on ? ' ok' : '') + '">' + (on ? 'เปิดเบิก' : 'ยังไม่เปิดเบิก') + '</span>' + (schemes.length ? '<span class="tag">' + schemes.length + ' แบบ</span>' : '') +
        '<span class="tag" title="' + esc(pc.note || 'เพดานวิทยาลัย') + '">เบิกได้ ' + pc.cap + ' ชม./สัปดาห์</span>' +
        (t.employment === 'contract' && !t.service_start ? '<span class="tag warn">ยังไม่ใส่วันเริ่มงาน</span>' : '');
      var title = [role].concat(schemes).filter(Boolean).join(' · ');
      return '<button type="button" class="hours-card ot-card" data-te="' + esc(t.id) + '"' + (title ? ' title="' + esc(title) + '"' : '') + '>' + icon +
        '<span class="ot-card-body"><b>' + esc(teacherBareName(t.name)) + '</b><span class="small muted">' + esc(Ot.EMPLOY_TH[t.employment] || 'ไม่ระบุสถานะการจ้าง') + '</span><span class="ot-card-tags">' + tags + '</span></span></button>';
    });
  $('#otD').onchange = function () { OT.dept = this.value; VIEWS['ot-teachers'](el); };
  $$('[data-te]', el).forEach(function (b) {
    b.onclick = function () {
      var t = IDX.Teachers[b.dataset.te];
      rowModal('Teachers', t, { title: 'กำหนดแบบการเบิก: ' + t.name, only: ['employment', 'is_unit_head', 'service_start', 'award_bonus', 'award_note', 'ot_cap', 'ot_enabled', 'ot_scheme_ids'] });
    };
  });
  $('#otSug').onclick = function () {
    api('otSuggestSchemes', S.token, S.sem, false).then(function (rows) {
      rows = rows.filter(function (r) { return !dept || String((IDX.Teachers[r.teacher_id] || {}).department_id) === String(dept); });
      var m = modal('<h3>แบบการเบิกที่แนะนำ</h3><div class="tablewrap" style="max-height:55vh"><table class="data small"><tr><th>ครู</th><th>ระดับที่สอน</th><th>แนะนำ</th></tr>' + rows.map(function (r) {
        return '<tr><td>' + esc(r.name) + '</td><td>' + r.levels.map(function (l) { return LV[l]; }).join(', ') + '</td><td>' + (r.names.join('<br>') || '<span class="muted">ไม่มีแบบที่ตรง</span>') + '</td></tr>';
      }).join('') + '</table></div><p class="small muted">บันทึกเฉพาะครูที่ยังไม่ได้กำหนดแบบการเบิก</p><div class="actions"><button class="btn" onclick="closeModal()">ปิด</button><button class="btn pri" id="sugGo">บันทึกตามคำแนะนำ</button></div>', true);
      $('#sugGo', m).onclick = function () { api('otSuggestSchemes', S.token, S.sem, true).then(reloadData).then(function () { buildIndex(); closeModal(); VIEWS['ot-teachers'](el); toast('บันทึกแล้ว'); }); };
    });
  };
};

/* ---------- วันหยุดของวิทยาลัย (ทุกคน) ---------- */
VIEWS['ot-holidays'] = function (el) {
  el.innerHTML = '<div class="card"><div class="row"><select id="hoR" style="width:auto">' + roundOptions() + '</select></div><div id="hoOut" style="margin-top:10px"></div>' +
    '<div class="row" style="margin-top:10px"><input type="date" id="hoD" style="width:auto"><input id="hoN" placeholder="ชื่อวันหยุด เช่น วันปิยมหาราช" style="width:260px"><button class="btn pri sm" id="hoAdd">+ เพิ่มวันหยุด</button></div>' +
    '<p class="small muted">วันหยุดของวิทยาลัยใช้กับครูทุกคน — ชั่วโมงในวันนั้นไม่นับเป็นชั่วโมงสอน (ภาระไม่ลดลง)</p></div>';
  function draw() {
    api('listTable', S.token, 'OtAbsences', { round_id: OT.round, teacher_id: '*' }).then(function (rows) {
      $('#hoOut').innerHTML = rows.length ? '<table class="data">' + rows.map(function (r) { return '<tr><td>' + thDate(r.date) + '</td><td>' + esc(r.note) + '</td><td><button class="btn sm bad" data-dh="' + esc(r.id) + '">ลบ</button></td></tr>'; }).join('') + '</table>' : '<p class="muted small">ยังไม่มี</p>';
      $$('[data-dh]').forEach(function (b) { b.onclick = function () { api('deleteRow', S.token, 'OtAbsences', b.dataset.dh).then(draw); }; });
    });
  }
  $('#hoR').onchange = function () { OT.round = this.value; draw(); };
  $('#hoAdd').onclick = function () { api('saveRow', S.token, 'OtAbsences', { round_id: OT.round, teacher_id: '*', date: $('#hoD').value, type: 'วันหยุด', note: $('#hoN').value }).then(draw); };
  draw();
};
</script>
